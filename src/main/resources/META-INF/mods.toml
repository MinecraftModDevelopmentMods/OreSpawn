# Values come from gradle.properties. Eclipse and release jars use the processed copy.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="${mod_issue_url}"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
displayURL="${mod_url}"
credits="The original OreSpawn contributors, the Mineralogy contributors, Forge, and the MMD Team"
authors="${mod_authors}"
description='''${mod_description}'''

# Forge and Minecraft are required; the ranges keep this jar on its own target.
[[dependencies.orespawn]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.orespawn]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
