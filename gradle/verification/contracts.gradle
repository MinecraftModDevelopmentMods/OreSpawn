// CI and command-line portability checks belong beside the other verification tasks.
tasks.register('verifyCommandPortability') {
    group = 'verification'
    description = 'Rejects shell-specific wrappers in generic Gradle task execution.'
    doLast {
        List<File> commandSources = [file('build.gradle')]
        commandSources.addAll(fileTree('.github/workflows') { include '*.yml', '*.yaml' }.files)
        commandSources.each { File source ->
            String text = source.getText('UTF-8')
            if (text =~ /(?i)(?:commandLine|executable)\s*[^\n]*(?:cmd(?:\.exe)?\s+\/c|powershell(?:\.exe)?\s+-command|(?:bash|sh)\s+-c)/) {
                throw new GradleException("Shell-specific command wrapper in ${source}")
            }
        }
    }
}

tasks.register('verifyColdNeoForgeBootstrapContract') {
    group = 'verification'
    description = 'Verifies that CI qualifies NeoGradle source patches from an isolated Java 21 cache.'
    doLast {
        Properties gradleProperties = new Properties()
        file('gradle.properties').withInputStream { gradleProperties.load(it) }
        if (gradleProperties.getProperty('neogradle.subsystems.decompiler.enabled') != 'true') {
            throw new GradleException(
                    'NeoForge 21.11 CI must retain API-complete source patching')
        }

        String workflow = file('.github/workflows/ci.yml').getText('UTF-8')
        [
                'Cold NeoForge bootstrap',
                'orespawn-neoforge-cold-cache',
                '--no-build-cache',
                '--offline',
                './gradlew classes verifyLegacyFixtures --no-daemon',
                './gradlew classes verifyLegacyFixtures --offline --no-daemon',
                './gradlew check build javadoc',
                "java-version: '21.0.7+6.0.LTS'"
        ].each { required ->
            if (!workflow.contains(required)) {
                throw new GradleException("Cold NeoForge bootstrap is missing ${required}")
            }
        }
        ['MinecraftMavenizer', 'mavenizer', 'java-version: \'25', 'net.minecraftforge.gradle'].each { forbidden ->
            if (workflow.contains(forbidden)) {
                throw new GradleException("Cold NeoForge bootstrap contains Forge-only tooling: ${forbidden}")
            }
        }
        ['./gradlew clean check', './gradlew clean classes'].each { combined ->
            if (workflow.contains(combined)) {
                throw new GradleException(
                        "NeoGradle clean must run separately from model consumers: ${combined}")
            }
        }

        String codeQlWorkflow = file('.github/workflows/codeql-analysis.yml').getText('UTF-8')
        if (!codeQlWorkflow.contains('./gradlew clean --no-daemon')
                || codeQlWorkflow.contains('clean classes')) {
            throw new GradleException(
                    'CodeQL must clean once before its cache-preserving compilation retry loop')
        }
    }
}
