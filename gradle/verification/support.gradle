shared.runtimeCrashSnapshot = runtimeCrashSnapshot

// Fixture servers use copies or hard links from one official Forge installation.
// Their worlds and mods stay in disposable run directories.
shared.stageForge52Runtime = { File runtime, File runDirectory ->
    File sourceLibraries = new File(runtime, 'libraries')
    File shim = new File(runtime,
            "forge-${project.minecraft_version}-${project.forge_version}-shim.jar")
    if (!sourceLibraries.isDirectory() || !shim.isFile()) {
        throw new GradleException("Incomplete official Forge 52 runtime: ${runtime}")
    }
    java.nio.file.Files.copy(shim.toPath(), new File(runDirectory, shim.name).toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    File targetLibraries = new File(runDirectory, 'libraries')
    sourceLibraries.eachFileRecurse(groovy.io.FileType.FILES) { File source ->
        java.nio.file.Path relative = sourceLibraries.toPath().relativize(source.toPath())
        File target = targetLibraries.toPath().resolve(relative).toFile()
        target.parentFile.mkdirs()
        try {
            java.nio.file.Files.createLink(target.toPath(), source.toPath())
        } catch (IOException | UnsupportedOperationException | SecurityException ignored) {
            java.nio.file.Files.copy(source.toPath(), target.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

shared.forge52ServerCommand = { File runtime, File runDirectory, List<String> jvmOptions ->
    File forgeDirectory = new File(runDirectory,
            "libraries/net/minecraftforge/forge/${project.minecraft_version}-${project.forge_version}")
    File sourceArguments = new File(forgeDirectory,
            System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
                    ? 'win_args.txt' : 'unix_args.txt')
    if (!sourceArguments.isFile()) {
        throw new GradleException("Incomplete official Forge 52 runtime: ${sourceArguments}")
    }
    List<String> command = [shared.java21Launcher.get().executablePath.asFile.absolutePath,
            '-Xms512m', '-Xmx2g']
    command.addAll(jvmOptions)
    command.add("@libraries/net/minecraftforge/forge/${project.minecraft_version}-${project.forge_version}/${sourceArguments.name}")
    command.add('nogui')
    command
}
