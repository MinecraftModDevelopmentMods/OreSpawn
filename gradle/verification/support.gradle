def configureFromForgeRun = { JavaExec process, String runTaskName ->
    process.actions.clear()
    process.dependsOn {
        JavaExec run = tasks.getByName(runTaskName) as JavaExec
        run.taskDependencies.getDependencies(run)
    }
    process.doLast {
        JavaExec run = tasks.getByName(runTaskName) as JavaExec
        String runConfigurationName = runTaskName.substring(3).uncapitalize()
        def runOptions = minecraft.runs.getByName(runConfigurationName)
        File originalConfiguredWorkingDir = runOptions.workingDir.get().asFile
        File originalWorkingDir = run.workingDir
        List<String> originalArgs = new ArrayList<>(run.args)
        List<String> originalJvmArgs = new ArrayList<>(run.jvmArgs)
        Map<String, Object> originalSystemProperties = new LinkedHashMap<>(run.systemProperties)
        Map<String, Object> originalEnvironment = new LinkedHashMap<>(run.environment)
        FileCollection originalClasspath = files(run.classpath.files)
        String originalMinHeap = run.minHeapSize
        String originalMaxHeap = run.maxHeapSize
        String originalMainClass = run.mainClass.orNull
        try {
            File forgeConfig = new File(process.workingDir, 'config/forge.cfg')
            if (!forgeConfig.isFile()) {
                forgeConfig.parentFile.mkdirs()
                forgeConfig.setText('''general {
    B:disableVersionCheck=true
}

version_checking {
    B:Global=false
}
''', 'UTF-8')
            }
            runOptions.workingDir.set(process.workingDir)
            run.workingDir(process.workingDir)
            // Preserve the target run's bare nogui argument while adding any
            // fixture-specific arguments. Replacing the argument list here
            // caused every automated Forge 1.11 server to open its Swing GUI.
            List<String> effectiveArgs = new ArrayList<>(originalArgs)
            effectiveArgs.addAll(process.args)
            run.setArgs(effectiveArgs)
            run.jvmArgs(process.jvmArgs)
            run.systemProperties(process.systemProperties)
            run.environment(process.environment)
            Set<File> splitMainOutputs = [
                    tasks.named('compileJava', JavaCompile).get().destinationDirectory.get().asFile,
                    sourceSets.main.output.resourcesDir
            ] as Set<File>
            run.setClasspath(files(forge11DevelopmentOutput, run.classpath.filter {
                !splitMainOutputs.contains(it)
            }))
            run.exec()
        } finally {
            runOptions.workingDir.set(originalConfiguredWorkingDir)
            run.workingDir(originalWorkingDir)
            run.setArgs(originalArgs)
            run.setJvmArgs(originalJvmArgs)
            run.setSystemProperties(originalSystemProperties)
            run.setEnvironment(originalEnvironment)
            run.setClasspath(originalClasspath)
            run.minHeapSize = originalMinHeap
            run.maxHeapSize = originalMaxHeap
            if (originalMainClass == null) {
                run.mainClass.unset()
            } else {
                run.mainClass.set(originalMainClass)
            }
        }
    }
}

// Runtime processes are not green merely because they exit with code zero.
// Forge 13 can log a fatal callback or worldgen failure and still stop cleanly.
def acceptedForge13LogNoise = [
        ~/Apache Maven library folder was not in the format expected/,
        ~/\[FML\]: Full: .*maven-artifact-/,
        ~/\[FML\]: Trimmed: .*maven-artifact/,
        ~/FML appears to be missing any signature data/,
		~/The binary patch set is missing\. Either you are in a development environment, or things are not going to work!/,
        ~/Unable to read a class file correctly/,
        ~/There was a problem reading the entry (?:META-INF\/versions\/9\/)?module-info\.class .*probably a corrupt zip/,
        ~/There was a problem reading the entry META-INF\/versions\/11\/net\/minecraftforge\/launcher\/shadow\/util\/download\/DownloadUtilsImpl\.class in the jar .*slime-launcher-0\.2\.2\.jar - probably a corrupt zip/
]

def knownMinecraft112OnlyRegistryNames = [
        'black_glazed_terracotta', 'blue_glazed_terracotta', 'brown_glazed_terracotta',
        'concrete', 'concrete_powder', 'cyan_glazed_terracotta', 'gray_glazed_terracotta',
        'green_glazed_terracotta', 'knowledge_book', 'light_blue_glazed_terracotta',
        'lime_glazed_terracotta', 'magenta_glazed_terracotta', 'orange_glazed_terracotta',
        'pink_glazed_terracotta', 'purple_glazed_terracotta', 'red_glazed_terracotta',
        'silver_glazed_terracotta', 'white_glazed_terracotta', 'yellow_glazed_terracotta'
] as Set

def assertRuntimeLogsClean = { File runDirectory, String context,
        boolean allowMinecraft112DowngradeMappings = false ->
    File crashDirectory = new File(runDirectory, 'crash-reports')
    if (crashDirectory.isDirectory()) {
        List<File> crashes = fileTree(crashDirectory) { include '**/*' }.files.findAll { it.isFile() }
        if (!crashes.isEmpty()) {
            throw new GradleException("${context} produced crash report ${crashes.first()}")
        }
    }

    Set<File> runtimeLogs = [] as Set<File>
    File logsDirectory = new File(runDirectory, 'logs')
    if (logsDirectory.isDirectory()) {
        runtimeLogs.addAll(fileTree(logsDirectory) {
            include '**/*.log'
            include '**/*.txt'
        }.files)
    }
    runtimeLogs.addAll(fileTree(runDirectory) { include '*-console.txt' }.files)

    List<String> failures = []
    runtimeLogs.each { File log ->
        String completeLog = log.getText('UTF-8')
        boolean cleanroomWindowsEpollFallback = completeLog.contains(
                '[io.netty.channel.epoll.Epoll]: Epoll support is not available')
                && completeLog.contains('Caused by: java.lang.IllegalStateException: Only supported on Linux')
                && completeLog.contains('[net.minecraft.network.NetworkSystem]: Using default channel type')
		boolean legacySlimeLauncherScanNoise = completeLog.contains('Unable to read a class file correctly')
				&& completeLog.contains('slime-launcher-0.2.2.jar')
				&& completeLog.contains('java.lang.IllegalArgumentException')
        int lineNumber = 0
        log.eachLine('UTF-8') { String line ->
            lineNumber++
            boolean unexpectedSeverity = (line ==~ /.*\/(?:ERROR|FATAL)\].*/
                    || line ==~ /.*\s(?:ERROR|FATAL)\s.*/)
            def downgradeMappingMatch = line =~ /.*\[FML\/?\]: Unidentified (?:block|item): minecraft:([a-z0-9_]+), id [0-9]+$/
            boolean knownMinecraft112DowngradeMapping = allowMinecraft112DowngradeMappings
                    && ((line.contains('[FML]: There are unidentified mappings in this world - we are going to attempt to process anyway')
                    || line.contains('[FML/]: There are unidentified mappings in this world - we are going to attempt to process anyway'))
                    || (downgradeMappingMatch.matches()
                    && knownMinecraft112OnlyRegistryNames.contains(downgradeMappingMatch.group(1))))
            boolean unsignedSourceBuiltMineralogy = allowMinecraft112DowngradeMappings
                    && line.contains('[mineralogy')
                    && line.contains('The mod mineralogy is expecting signature @FINGERPRINT@')
                    && line.contains('however there is no signature matching that description')
            boolean knownNoise = acceptedForge13LogNoise.any { line =~ it }
					|| knownMinecraft112DowngradeMapping
					|| unsignedSourceBuiltMineralogy
					|| (legacySlimeLauncherScanNoise
					&& line.contains('There was a problem reading the entry')
					&& line.contains('slime-launcher-0.2.2.jar')
					&& line.contains('probably a corrupt zip'))
                    || (line.trim() == 'java.lang.ExceptionInInitializerError'
                    && cleanroomWindowsEpollFallback)
            boolean oreSpawnCascadingLoad = line.contains('cascading worldgen lag')
                    && line.contains('OreSpawn loaded a new chunk')
            boolean fatalText = line.contains('Encountered an unexpected exception')
                    || line.contains('Exception stopping the server')
                    || line.contains('Migration audit failed')
                    || line.contains('java.lang.Error:')
                    || line.contains('IllegalAccessError')
                    || line.contains('NoSuchFieldError')
                    || line.contains('LinkageError')
                    || line.contains('NoSuchMethodError')
                    || line.contains('NoClassDefFoundError')
                    || line.contains('ExceptionInInitializerError')
                    || line.contains('Tried to assign a mutable BlockPos')
                    || oreSpawnCascadingLoad
            if (!knownNoise && (unexpectedSeverity || fatalText)) {
                failures.add("${log.name}:${lineNumber}: ${line}")
            }
        }
    }
    if (!failures.isEmpty()) {
        throw new GradleException("${context} logged unexpected errors:\n"
                + failures.take(20).join('\n'))
    }
}

tasks.register('verifyExternalRuntimeLogs') {
    group = 'verification'
    description = 'Applies the release log/crash scanner to a disposable packaged runtime.'
    doLast {
        if (!project.hasProperty('runtimeLogDirectory')) {
            throw new GradleException('runtimeLogDirectory is required')
        }
        File runtime = file(project.property('runtimeLogDirectory'))
        if (!runtime.isDirectory()) {
            throw new GradleException("Runtime log directory does not exist: ${runtime}")
        }
        assertRuntimeLogsClean(runtime, "external packaged runtime ${runtime.name}")
    }
}

tasks.register('runtimeLogScannerTest') {
    group = 'verification'
    description = 'Proves Forge 13 log validation accepts known noise and rejects runtime failures.'
    doLast {
        File probe = file("${buildDir}/runtime-log-scanner-test")
        delete probe
        File logs = new File(probe, 'logs')
        logs.mkdirs()
        new File(logs, 'latest.log').setText(
				'[main/ERROR] [FML]: The binary patch set is missing. Either you are in a development environment, or things are not going to work!\n'
						+ '[main/ERROR] [FML]: FML appears to be missing any signature data. This is not a good thing\n'
						+ '[Server thread/ERROR] [FML]: Unable to read a class file correctly\n'
						+ 'java.lang.IllegalArgumentException\n'
						+ '[Server thread/ERROR] [FML]: There was a problem reading the entry C:/cache/slime-launcher-0.2.2.jar in the jar net.minecraftforge.fml.common.LoaderException: java.lang.IllegalArgumentException - probably a corrupt zip\n'
                        + '[Server thread/ERROR] [FML]: There was a problem reading the entry META-INF/versions/11/net/minecraftforge/launcher/shadow/util/download/DownloadUtilsImpl.class in the jar C:/cache/slime-launcher-0.2.2.jar - probably a corrupt zip\n'
                        + '[Server thread/INFO] [FML]: Done\n', 'UTF-8')
        assertRuntimeLogsClean(probe, 'scanner-accepted-noise-probe')
        new File(logs, 'latest.log').setText(
                '[Server thread/DEBUG] [io.netty.channel.epoll.Epoll]: Epoll support is not available\n'
                        + 'java.lang.ExceptionInInitializerError\n'
                        + 'Caused by: java.lang.IllegalStateException: Only supported on Linux\n'
                        + '[Server thread/INFO] [net.minecraft.network.NetworkSystem]: Using default channel type\n',
                'UTF-8')
        assertRuntimeLogsClean(probe, 'scanner-cleanroom-windows-epoll-probe')
        new File(logs, 'latest.log').setText('java.lang.ExceptionInInitializerError\n', 'UTF-8')
        boolean rejected = false
        try { assertRuntimeLogsClean(probe, 'scanner-unaccounted-initializer-probe') }
        catch (GradleException expected) { rejected = true }
        if (!rejected) throw new GradleException('Runtime scanner accepted an unaccounted initializer failure')
        new File(logs, 'latest.log').setText(
                '[Server thread/WARN]: Tried to assign a mutable BlockPos to tick data...\n', 'UTF-8')
        rejected = false
        try { assertRuntimeLogsClean(probe, 'scanner-rejection-probe') }
        catch (GradleException expected) { rejected = true }
        if (!rejected) throw new GradleException('Runtime scanner accepted a mutable BlockPos leak')
        new File(logs, 'latest.log').setText(
                '[Server thread/ERROR] [example]: Unexpected fixture failure\n', 'UTF-8')
        rejected = false
        try { assertRuntimeLogsClean(probe, 'scanner-error-severity-probe') }
        catch (GradleException expected) { rejected = true }
        if (!rejected) throw new GradleException('Runtime scanner accepted an unexpected ERROR line')
        new File(logs, 'latest.log').setText(
                '[Server thread/FATAL] [FML]: There are unidentified mappings in this world - we are going to attempt to process anyway\n'
                        + '[Server thread/FATAL] [FML]: Unidentified block: minecraft:concrete, id 251\n'
                        + '[Server thread/FATAL] [FML]: Unidentified item: minecraft:knowledge_book, id 453\n', 'UTF-8')
        assertRuntimeLogsClean(probe, 'scanner-expected-1.12-downgrade-probe', true)
        rejected = false
        try { assertRuntimeLogsClean(probe, 'scanner-unscoped-1.12-downgrade-probe') }
        catch (GradleException expected) { rejected = true }
        if (!rejected) throw new GradleException('Runtime scanner accepted downgrade mappings outside the copied corpus gate')
        new File(logs, 'latest.log').setText(
                '[Server thread/FATAL] [FML]: Unidentified block: example:unknown, id 999\n', 'UTF-8')
        rejected = false
        try { assertRuntimeLogsClean(probe, 'scanner-unknown-downgrade-probe', true) }
        catch (GradleException expected) { rejected = true }
        if (!rejected) throw new GradleException('Runtime scanner accepted an unknown mapping in the downgrade corpus')
        delete probe
    }
}

