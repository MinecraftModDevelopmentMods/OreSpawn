if (project.hasProperty('migrationRunDir')) {
    def migrationRunDirectory = file(project.property('migrationRunDir'))
    task prepareMigrationIntegrationRun(dependsOn: migrationIntegrationTestModJar) {
        doLast {
            copy { from migrationIntegrationTestModJar.archiveFile; into new File(migrationRunDirectory, 'mods') }
            new File(migrationRunDirectory, 'eula.txt').setText('eula=true\n', 'UTF-8')
            File serverProperties = new File(migrationRunDirectory, 'server.properties')
            Properties values = new Properties()
            if (serverProperties.isFile()) serverProperties.withInputStream { values.load(it) }
            values.setProperty('spawn-animals', 'false')
            values.setProperty('spawn-monsters', 'false')
            serverProperties.withOutputStream { values.store(it, 'OreSpawn migration qualification') }
        }
    }
    task migrationIntegrationProcess(type: JavaExec, dependsOn: prepareMigrationIntegrationRun) {
        group = 'verification'
        workingDir migrationRunDirectory
        systemProperty 'orespawn.migrationFamily', project.findProperty('migrationFamily') ?: 'unspecified'
        systemProperty 'orespawn.migrationPhase', project.findProperty('migrationPhase') ?: 'fresh'
        configureFromForgeRun(delegate, 'runServer')
        doLast {
            String phase = project.findProperty('migrationPhase') ?: 'fresh'
            File marker = new File(migrationRunDirectory, 'world/orespawn4-migration-probe.properties')
            if (!marker.isFile()) throw new GradleException("Migration probe did not produce ${marker}")
            Properties values = new Properties(); marker.withInputStream { values.load(it) }
            if (values.getProperty("${phase}_complete") != 'true') {
                throw new GradleException("Migration ${phase} phase did not complete: ${marker}")
            }
            File latest = new File(migrationRunDirectory, 'logs/latest.log')
            if (latest.isFile() && (latest.text.contains('Migration audit failed')
                    || latest.text.contains('Encountered an unexpected exception'))) {
                throw new GradleException("Migration ${phase} phase logged a server failure: ${latest}")
            }
        }
    }
}

def legacyMineralogyMigrationRunDirectory = file("${buildDir}/legacy-mineralogy-migration-run")
def legacyMineralogyMigrationArchive = new File(legacyFixtureWorlds,
        'sylvester-era-trio-source-v2.zip')

task prepareLegacyMineralogyMigrationRun(dependsOn: [migrationIntegrationTestModJar,
        verifyLegacyFixtures]) {
    doLast {
        delete legacyMineralogyMigrationRunDirectory
        copy { from zipTree(legacyMineralogyMigrationArchive); into legacyMineralogyMigrationRunDirectory }
        File mods = new File(legacyMineralogyMigrationRunDirectory, 'mods')
        mods.mkdirs()
        copy {
            from new File(legacyFixtureArtifacts, 'BaseMetals_1.10.2-2.4.0.11.jar')
            from new File(legacyFixtureArtifacts, 'Mineralogy-1.10.2-3.3.8.26.jar')
            from migrationIntegrationTestModJar.archiveFile
            into mods
        }
        new File(legacyMineralogyMigrationRunDirectory, 'eula.txt').setText('eula=true\n', 'UTF-8')
    }
}

def configureLegacyMineralogyMigrationProcess = { JavaExec process, String phase ->
    process.group = 'verification'
    process.workingDir legacyMineralogyMigrationRunDirectory
    process.systemProperty 'orespawn.migrationFamily', 'legacy-mineralogy-cyano'
    process.systemProperty 'orespawn.migrationPhase', phase
    // The sealed corpus was last saved by 1.12.2. Forge 1.11 correctly asks
    // before discarding only vanilla 1.12 additions from this disposable copy.
    process.systemProperty 'fml.queryResult', 'confirm'
    configureFromForgeRun(process, 'runServer')
    process.doLast {
        File marker = new File(legacyMineralogyMigrationRunDirectory,
                'world/orespawn4-migration-probe.properties')
        if (!marker.isFile()) throw new GradleException("Legacy Mineralogy migration did not produce ${marker}")
        Properties values = new Properties(); marker.withInputStream { values.load(it) }
        if (values.getProperty("${phase}_complete") != 'true') {
            throw new GradleException("Legacy Mineralogy migration ${phase} phase did not complete")
        }
    }
}

task legacyMineralogyMigrationFresh(type: JavaExec, dependsOn: prepareLegacyMineralogyMigrationRun)
configureLegacyMineralogyMigrationProcess(legacyMineralogyMigrationFresh, 'fresh')

task legacyMineralogyMigrationReload(type: JavaExec, dependsOn: legacyMineralogyMigrationFresh)
configureLegacyMineralogyMigrationProcess(legacyMineralogyMigrationReload, 'reload')

task legacyMineralogyMigrationTest(dependsOn: legacyMineralogyMigrationReload) {
    group = 'verification'
    description = 'Proves an existing Mineralogy 3 world is pinned to Cyano settings across reload.'
    doLast {
        File marker = new File(legacyMineralogyMigrationRunDirectory,
                'world/orespawn4-migration-probe.properties')
        Properties values = new Properties(); marker.withInputStream { values.load(it) }
        ['fresh_complete', 'reload_complete', 'legacy_mineralogy_config_sha256',
                'legacy_mineralogy_world_profile_sha256'].each { key ->
            if (!values.getProperty(key)) throw new GradleException("Missing legacy Mineralogy evidence ${key}")
        }
        logger.lifecycle('Existing Mineralogy 3 world retained Cyano profile and exact config/profile hashes across reload')
    }
}

