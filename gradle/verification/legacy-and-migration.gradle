def configureLegacyAbiProcess = { String generation, Task fixtureJar, String markerName ->
    File runDirectory = file("${buildDir}/legacy-abi/${generation}/run")
    Task prepare = tasks.create("prepare${generation.capitalize()}AbiRun", Copy) {
        dependsOn fixtureJar
        into new File(runDirectory, 'mods')
        from fixtureJar.archiveFile
        // A copied probe jar may be unchanged, but every ABI run needs a new world and marker.
        outputs.upToDateWhen { false }
        doFirst { project.delete(runDirectory) }
        doLast {
            new File(runDirectory, 'eula.txt').setText('eula=true\n', 'UTF-8')
            new File(runDirectory, 'server.properties').setText(
                    'eula=true\nonline-mode=false\nlevel-name=world\nlevel-seed=zsjpxah\n' +
                    'spawn-animals=false\nspawn-monsters=false\n', 'UTF-8')
        }
    }
    tasks.create("${generation}AbiIntegrationProcess", JavaExec) {
        group = 'verification'
        dependsOn prepare
        workingDir runDirectory
        configureFromForgeRun(delegate, 'runServer')
        doLast {
            File marker = new File(runDirectory, "world/${markerName}")
            if (!marker.isFile() || !marker.text.contains('registered=true')) {
                throw new GradleException("${generation.toUpperCase()} binary ABI probe did not complete: ${marker}")
            }
            assertRuntimeLogsClean(runDirectory, "${generation.toUpperCase()} binary ABI probe")
        }
    }
}

configureLegacyAbiProcess('os1', os1AbiFixtureJar, 'os1-abi-probe.properties')
configureLegacyAbiProcess('os3', os3AbiFixtureJar, 'os3-abi-probe.properties')

task legacyAbiIntegrationTest {
    group = 'verification'
    dependsOn os1AbiIntegrationProcess, os3AbiIntegrationProcess
}

// Forge 1.11's native OS3 ABI fixture remains isolated from the ordinary
// production classpath and is exercised only by the explicit compatibility gate.

def legacyMineralogyArchive = new File(legacyFixtureWorlds, 'os3-331-default-source.zip')
def legacyMineralogyJar = legacyMineralogy111OracleJar
def legacyMineralogyGates = []
[
        '110': [version: '3.3.8.26', config: '''\
world-gen {
    I:GEOME_SIZE=144
    B:REALISTIC_COAL_LAYERS=true
    S:ROCK_LAYER_NOISE=41.5
    I:ROCK_LAYER_THICKNESS=11
}
'''],
        '111': [version: '3.3.0', config: '''\
world-gen {
    I:GEOME_SIZE=100
    S:ROCK_LAYER_NOISE=32
    I:ROCK_LAYER_THICKNESS=8
}
'''],
        '112': [version: '3.8.0.53', config: '''\
world-gen {
    B:PLACE_MINERALOGY_ROCK=false
    I:GEOME_SIZE=128
    S:ROCK_LAYER_NOISE=37.25
    I:ROCK_LAYER_THICKNESS=9
}
''']
].each { String lineage, Map fixture ->
    String label = lineage
    File runDirectory = file("${buildDir}/legacy-mineralogy-${lineage}-run")
    Task prepareTask = tasks.create("prepareLegacyMineralogy${label}Run") {
        dependsOn migrationIntegrationTestModJar, verifyLegacyFixtures
        doLast {
            delete runDirectory
            copy { from zipTree(legacyMineralogyArchive); into runDirectory }
            File mods = new File(runDirectory, 'mods')
            mods.mkdirs()
            copy { from migrationIntegrationTestModJar.archiveFile; from legacyMineralogyJar; into mods }
            File config = new File(runDirectory, 'config/mineralogy.cfg')
            config.parentFile.mkdirs()
            config.setText(fixture.config as String, 'UTF-8')
            new File(runDirectory, 'eula.txt').setText('eula=true\n', 'UTF-8')
        }
    }
    Task seedMetadataTask = tasks.create("seedLegacyMineralogy${label}Metadata", JavaExec) {
        group = 'verification'
        dependsOn prepareTask
        javaLauncher = java8Launcher
        mainClass = 'zone.moddev.mc.orespawn.migrationtest.LegacyMineralogyMetadataFixture'
        classpath = files(migrationIntegrationClasses, sourceSets.main.runtimeClasspath)
        args new File(runDirectory, 'world').absolutePath, fixture.version
    }

    def createLegacyMineralogyProcess = { String phase, Object dependency ->
        Task process = tasks.create("legacyMineralogy${label}${phase.capitalize()}", JavaExec) {
            group = 'verification'
            dependsOn dependency
            workingDir runDirectory
            systemProperty 'forge.logging.console.level', 'info'
            systemProperty 'orespawn.migrationFamily', "legacy-mineralogy-${lineage}"
            systemProperty 'orespawn.migrationPhase', phase
            systemProperty 'fml.queryResult', 'confirm'
            configureFromForgeRun(delegate, 'runServer')
            doLast {
                File marker = new File(runDirectory, 'world/orespawn4-migration-probe.properties')
                if (!marker.isFile()) {
                    throw new GradleException("Legacy Mineralogy ${lineage} ${phase} marker is missing")
                }
                Properties values = new Properties()
                marker.withInputStream { values.load(it) }
                if (values.getProperty("${phase}_complete") != 'true') {
                    throw new GradleException("Legacy Mineralogy ${lineage} ${phase} did not complete")
                }
                assertRuntimeLogsClean(runDirectory,
                        "legacy Mineralogy ${lineage} ${phase} phase", true)
            }
        }
        process
    }

    Task freshTask = createLegacyMineralogyProcess('fresh', seedMetadataTask)
    Task reloadTask = createLegacyMineralogyProcess('reload', freshTask)
    Task gate = tasks.create("legacyMineralogy${label}MigrationTest") {
        group = 'verification'
        description = "Proves Mineralogy ${lineage} settings remain exact across upgrade and reload."
        dependsOn reloadTask
    }
    legacyMineralogyGates.add(gate)
}

tasks.named('check') {
    dependsOn legacyMineralogyGates
}
