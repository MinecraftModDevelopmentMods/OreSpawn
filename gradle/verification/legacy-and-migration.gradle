def baseMetals111RunDirectory = file("${buildDir}/basemetals-111-provider-run")
task prepareBaseMetals111ProviderRun(dependsOn: [migrationIntegrationTestModJar,
        baseMetals111FixtureJar]) {
    doLast {
        delete baseMetals111RunDirectory
        File mods = new File(baseMetals111RunDirectory, 'mods')
        copy {
            from migrationIntegrationTestModJar.archiveFile
            from baseMetals111FixtureJar.archiveFile
            into mods
        }
        new File(baseMetals111RunDirectory, 'server.properties').setText('''\
level-name=world
level-seed=zsjpxah
level-type=default
online-mode=false
server-port=0
allow-nether=true
generate-structures=false
spawn-protection=0
max-tick-time=-1
spawn-animals=false
spawn-monsters=false
''', 'UTF-8')
        new File(baseMetals111RunDirectory, 'eula.txt').setText('eula=true\n', 'UTF-8')
    }
}

def createBaseMetals111Process = { String phase, Object dependency ->
    tasks.create("baseMetals111Provider${phase.capitalize()}", JavaExec) {
        group = 'verification'
        dependsOn dependency
        workingDir baseMetals111RunDirectory
        systemProperty 'orespawn.migrationFamily', 'basemetals-fresh-install'
        systemProperty 'orespawn.migrationPhase', phase
        configureFromForgeRun(delegate, 'runServer')
        doLast {
            File marker = new File(baseMetals111RunDirectory,
                    'world/orespawn4-migration-probe.properties')
            if (!marker.isFile()) {
                throw new GradleException("Base Metals 1.11 ${phase} marker is missing")
            }
            Properties values = new Properties()
            marker.withInputStream { values.load(it) }
            if (values.getProperty("${phase}_complete") != 'true') {
                throw new GradleException("Base Metals 1.11 ${phase} did not complete")
            }
            assertRuntimeLogsClean(baseMetals111RunDirectory,
                    "Base Metals 1.11 ${phase} provider phase")
        }
    }
}

def baseMetals111Fresh = createBaseMetals111Process('fresh', prepareBaseMetals111ProviderRun)
