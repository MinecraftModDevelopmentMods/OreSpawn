            new File(legacyFixtureArtifacts, 'OreSpawn_1.10.2-1.1.0.jar'))
    destinationDirectory = os1AbiFixtureClasses
    options.encoding = 'UTF-8'
}

task os1AbiFixtureJar(type: Jar, dependsOn: compileOs1AbiFixture) {
    archiveFileName = 'os1abiprobe.jar'
    destinationDirectory = file("${buildDir}/legacy-abi/os1")
