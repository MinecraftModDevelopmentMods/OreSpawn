def verification = project.ext.oreSpawnVerification
def legacyFixtureArtifacts = verification.fixtureArtifacts
def legacyFixtureWorlds = verification.fixtureWorlds
def verifyLegacyFixtures = tasks.named('verifyLegacyFixtures')
def configureFromForgeRun = verification.configureFromForgeRun

// These disposable worlds prove that old saves and binary consumers still
// behave as they did before the build changed.
def surfaceIntegrationClasses = file("${buildDir}/surface-integration-fixture/classes")
task compileSurfaceIntegrationTestMod(type: JavaCompile, dependsOn: classes) {
    source fileTree('src/biomeIntegrationTest/java')
    classpath = files(sourceSets.main.output, sourceSets.main.compileClasspath)
    destinationDirectory = surfaceIntegrationClasses
    options.encoding = 'UTF-8'
}

task surfaceIntegrationTestModJar(type: Jar, dependsOn: compileSurfaceIntegrationTestMod) {
    archiveFileName = 'surfaceprobe.jar'
    destinationDirectory = file("${buildDir}/surface-integration-fixture")
    from surfaceIntegrationClasses
    from 'src/biomeIntegrationTest/resources'
}

def surfaceIntegrationRunDirectory = file("${buildDir}/surface-integration-run")
task prepareSurfaceIntegrationTest(dependsOn: surfaceIntegrationTestModJar) {
    doLast {
        delete surfaceIntegrationRunDirectory
        surfaceIntegrationRunDirectory.mkdirs()
        copy {
            from surfaceIntegrationTestModJar.archiveFile
            into new File(surfaceIntegrationRunDirectory, 'mods')
        }
        new File(surfaceIntegrationRunDirectory, 'server.properties').setText('''\
level-name=surface-integration-world
level-seed=zsjpxah
level-type=default
online-mode=false
server-port=0
allow-nether=true
generate-structures=false
spawn-protection=0
max-tick-time=-1
''', 'UTF-8')
        new File(surfaceIntegrationRunDirectory, 'eula.txt').setText('eula=true\n', 'UTF-8')
    }
}

def createSurfaceProcess = { String phase, Object dependency ->
    task("surfaceIntegration${phase}Process", type: JavaExec, dependsOn: dependency) {
        group = 'verification'
        workingDir surfaceIntegrationRunDirectory
        systemProperty 'surfaceprobe.integrationPhase', phase.toLowerCase()
        configureFromForgeRun(delegate, 'runServer')
    }
}

def surfaceIntegrationFreshProcess = createSurfaceProcess('Fresh', prepareSurfaceIntegrationTest)
surfaceIntegrationFreshProcess.doLast {
    File marker = new File(surfaceIntegrationRunDirectory,
            'surface-integration-world/surfaceprobe-integration.properties')
    if (!marker.isFile()) {
        throw new GradleException("Fresh surface integration completion marker is missing: ${marker}")
    }
}
def surfaceIntegrationReloadProcess = createSurfaceProcess('Reload', surfaceIntegrationFreshProcess)

task surfaceIntegrationTest(dependsOn: surfaceIntegrationReloadProcess) {
    group = 'verification'
    doLast {
        File marker = new File(surfaceIntegrationRunDirectory,
                'surface-integration-world/surfaceprobe-integration.properties')
        Properties result = new Properties()
        marker.withInputStream { result.load(it) }
        if (result.getProperty('reload_verified') != 'true') {
            throw new GradleException("Surface integration reload was not verified: ${marker}")
        }
        if (result.getProperty('ore_sources_reset_verified') != 'true') {
            throw new GradleException("Ore-source editor/profile/generation integration was not verified: ${marker}")
        }
		if (result.getProperty('biome_override_verified') != 'true') {
			throw new GradleException("Biome editor/profile/new-terrain integration was not verified: ${marker}")
		}
        if (!(result.getProperty('dynamic_fluid_placements') ?: '0').isInteger()
                || result.getProperty('dynamic_fluid_placements').toInteger() <= 0) {
            throw new GradleException("Dynamic fluid-deposit probe did not place any blocks: ${marker}")
        }
        [
                'end.raw_natural_sources': '108',
                'end.structure_natural_sources': '108',
                'end.vegetation_natural_sources': '108',
                'end.cave_pockets': '54',
                'end.underwater_pockets': '54',
                'end.raw_bedrock': '9',
                'end.raw_block_entities': '9',
                'end.exposed_snow_converted': '9',
                'end.surface_ice_converted': '9',
                'end.buried_snow_preserved': '9',
                'end.buried_ice_preserved': '9',
                'nether.unconfigured_snow_preserved': '9',
                'nether.unconfigured_ice_preserved': '9'
        ].each { key, expected ->
            if (result.getProperty(key) != expected) {
                throw new GradleException("Unexpected surface integration result ${key}: "
                        + "expected ${expected}, found ${result.getProperty(key)}")
            }
        }
        File latest = new File(surfaceIntegrationRunDirectory, 'logs/latest.log')
        if (!latest.isFile() || latest.text.contains('Tried to assign a mutable BlockPos')) {
            throw new GradleException("Surface integration leaked a mutable position into tick data: ${latest}")
        }
        logger.lifecycle('Provider surfaces and exact-biome geology verified: {} dimensions, {} columns each, fresh + reload',
                result.getProperty('dimensions'), result.getProperty('columns_per_dimension'))
    }
}

check.dependsOn surfaceIntegrationTest

// The migration probe starts from a copy of an old world, then reloads that
// exact copy to catch a second conversion or changed profile.
def migrationIntegrationClasses = file("${buildDir}/migration-integration-fixture/classes")
task compileMigrationIntegrationTestMod(type: JavaCompile, dependsOn: classes) {
    source fileTree('src/migrationIntegrationTest/java')
    classpath = files(sourceSets.main.output, sourceSets.main.compileClasspath)
    destinationDirectory = migrationIntegrationClasses
    options.encoding = 'UTF-8'
}

task migrationIntegrationTestModJar(type: Jar, dependsOn: compileMigrationIntegrationTestMod) {
    archiveFileName = 'migrationprobe.jar'
    destinationDirectory = file("${buildDir}/migration-integration-fixture")
    from migrationIntegrationClasses
    from 'src/migrationIntegrationTest/resources'
}

if (project.hasProperty('migrationRunDir')) {
    def migrationRunDirectory = file(project.property('migrationRunDir'))
    task prepareMigrationIntegrationRun(dependsOn: migrationIntegrationTestModJar) {
        doLast {
            copy { from migrationIntegrationTestModJar.archiveFile; into new File(migrationRunDirectory, 'mods') }
            new File(migrationRunDirectory, 'eula.txt').setText('eula=true\n', 'UTF-8')
            File serverProperties = new File(migrationRunDirectory, 'server.properties')
            Properties values = new Properties()
            if (serverProperties.isFile()) serverProperties.withInputStream { values.load(it) }
            values.setProperty('spawn-animals', 'false')
            values.setProperty('spawn-monsters', 'false')
            serverProperties.withOutputStream { values.store(it, 'OreSpawn migration qualification') }
        }
    }
    task migrationIntegrationProcess(type: JavaExec, dependsOn: prepareMigrationIntegrationRun) {
        group = 'verification'
        workingDir migrationRunDirectory
        systemProperty 'orespawn.migrationFamily', project.findProperty('migrationFamily') ?: 'unspecified'
        systemProperty 'orespawn.migrationPhase', project.findProperty('migrationPhase') ?: 'fresh'
        configureFromForgeRun(delegate, 'runServer')
        doLast {
            String phase = project.findProperty('migrationPhase') ?: 'fresh'
            File marker = new File(migrationRunDirectory, 'world/orespawn4-migration-probe.properties')
            if (!marker.isFile()) throw new GradleException("Migration probe did not produce ${marker}")
            Properties values = new Properties(); marker.withInputStream { values.load(it) }
            if (values.getProperty("${phase}_complete") != 'true') {
                throw new GradleException("Migration ${phase} phase did not complete: ${marker}")
            }
            File latest = new File(migrationRunDirectory, 'logs/latest.log')
            if (latest.isFile() && (latest.text.contains('Migration audit failed')
                    || latest.text.contains('Encountered an unexpected exception'))) {
                throw new GradleException("Migration ${phase} phase logged a server failure: ${latest}")
            }
        }
    }
}

// This 1.10-only gate is live code: existing Mineralogy 3 worlds must keep
// their Cyano settings even when modern provider defaults are installed.
def legacyMineralogyMigrationRunDirectory = file("${buildDir}/legacy-mineralogy-migration-run")
def legacyMineralogyMigrationArchive = new File(legacyFixtureWorlds,
        'sylvester-era-trio-source-v2.zip')

task prepareLegacyMineralogyMigrationRun(dependsOn: [migrationIntegrationTestModJar,
        verifyLegacyFixtures]) {
    doLast {
        delete legacyMineralogyMigrationRunDirectory
        copy { from zipTree(legacyMineralogyMigrationArchive); into legacyMineralogyMigrationRunDirectory }
        File mods = new File(legacyMineralogyMigrationRunDirectory, 'mods')
        mods.mkdirs()
        copy {
            from new File(legacyFixtureArtifacts, 'BaseMetals_1.10.2-2.4.0.11.jar')
            from new File(legacyFixtureArtifacts, 'Mineralogy-1.10.2-3.3.8.26.jar')
            from migrationIntegrationTestModJar.archiveFile
            into mods
        }
        new File(legacyMineralogyMigrationRunDirectory, 'eula.txt').setText('eula=true\n', 'UTF-8')
    }
}

def configureLegacyMineralogyMigrationProcess = { JavaExec process, String phase ->
    process.group = 'verification'
    process.workingDir legacyMineralogyMigrationRunDirectory
    process.systemProperty 'orespawn.migrationFamily', 'legacy-mineralogy-cyano'
    process.systemProperty 'orespawn.migrationPhase', phase
    configureFromForgeRun(process, 'runServer')
    process.doLast {
        File marker = new File(legacyMineralogyMigrationRunDirectory,
                'world/orespawn4-migration-probe.properties')
        if (!marker.isFile()) throw new GradleException("Legacy Mineralogy migration did not produce ${marker}")
        Properties values = new Properties()
        marker.withInputStream { values.load(it) }
        if (values.getProperty("${phase}_complete") != 'true') {
            throw new GradleException("Legacy Mineralogy migration ${phase} phase did not complete")
        }
    }
}

task legacyMineralogyMigrationFresh(type: JavaExec, dependsOn: prepareLegacyMineralogyMigrationRun)
configureLegacyMineralogyMigrationProcess(legacyMineralogyMigrationFresh, 'fresh')

task legacyMineralogyMigrationReload(type: JavaExec, dependsOn: legacyMineralogyMigrationFresh)
configureLegacyMineralogyMigrationProcess(legacyMineralogyMigrationReload, 'reload')

task legacyMineralogyMigrationTest(dependsOn: legacyMineralogyMigrationReload) {
    group = 'verification'
    description = 'Proves an existing Mineralogy 3 world is pinned to Cyano settings across reload.'
    doLast {
        File marker = new File(legacyMineralogyMigrationRunDirectory,
                'world/orespawn4-migration-probe.properties')
        Properties values = new Properties(); marker.withInputStream { values.load(it) }
        ['fresh_complete', 'reload_complete', 'legacy_mineralogy_config_sha256',
                'legacy_mineralogy_world_profile_sha256'].each { key ->
            if (!values.getProperty(key)) throw new GradleException("Missing legacy Mineralogy evidence ${key}")
        }
        logger.lifecycle('Existing Mineralogy 3 world retained Cyano profile and exact config/profile hashes across reload')
    }
}

check.dependsOn legacyMineralogyMigrationTest

// Compile published OS1 and OS3 consumers unchanged. These manual checks
// protect old binary contracts without putting their classes in the release.
def os1AbiFixtureClasses = file("${buildDir}/legacy-abi/os1/classes")
def os3AbiFixtureClasses = file("${buildDir}/legacy-abi/os3/classes")

