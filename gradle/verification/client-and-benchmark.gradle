    destinationDirectory = layout.buildDirectory.dir('benchmark-integration-fixture')
    from benchmarkIntegrationClasses
    from 'src/benchmarkIntegrationTest/resources'
}


shared.surfaceIntegrationClasses = surfaceIntegrationClasses
shared.surfaceIntegrationRunDirectory = surfaceIntegrationRunDirectory
shared.clientIntegrationTestModJar = clientIntegrationTestModJar
shared.benchmarkIntegrationTestModJar = benchmarkIntegrationTestModJar
