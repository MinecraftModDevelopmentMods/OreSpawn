// A real Nether checks the shipped host tag and explicit block hosts.
// The fixture is compiled separately and never joins a production classpath.
def shared = project.ext.oreSpawnBuild
def classes = layout.buildDirectory.dir('native-ore-fixture/classes')
def compile = tasks.register('compileNativeOreProbe', JavaCompile) {
    dependsOn tasks.named('classes')
    source fileTree('src/nativeOreIntegrationTest/java')
    classpath = files(sourceSets.main.output, sourceSets.main.compileClasspath)
    destinationDirectory = classes
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    options.encoding = 'UTF-8'
}
def jar = tasks.register('nativeOreProbeJar', Jar) {
    dependsOn compile
    archiveFileName = 'nativeoreprobe.jar'
    destinationDirectory = layout.buildDirectory.dir('native-ore-fixture')
    from classes
    from 'src/nativeOreIntegrationTest/resources'
}
def packagedJar = jar
def serverRuntime = providers.gradleProperty('packagedForgeServerRuntime')
def comparisonJar = providers.gradleProperty('nativeOreSpawnJar')
def finalTasks = []
['Default', 'Explicit', 'Imported', 'OffControl', 'OffImported'].each { scenario ->
    boolean imported = scenario in ['Imported', 'OffImported']
    boolean managed = !scenario.startsWith('Off')
    File runDirectory = file("${buildDir}/native-ore-${scenario.toLowerCase()}-run")
    def prepare = tasks.register("prepareNativeOre${scenario}") {
        dependsOn shared.releaseJar, packagedJar
        doLast {
            // This directory is build-owned; no manual saves are used here.
            delete runDirectory
            runDirectory.mkdirs()
            if (!serverRuntime.isPresent()) {
                throw new GradleException('Pass -PpackagedForgeServerRuntime=<official Forge 65 installation>')
            }
            shared.stageForge65Runtime(file(serverRuntime.get()), runDirectory)
            shared.prepareTestForgeConfig(runDirectory)
            copy {
                from comparisonJar.isPresent() ? file(comparisonJar.get()) : shared.releaseJar
                from packagedJar
                into new File(runDirectory, 'mods')
            }
            new File(runDirectory, 'eula.txt').setText('eula=true\n', 'UTF-8')
            new File(runDirectory, 'server.properties').setText('''\
level-name=native-ore-world
level-seed=4192643144957839458
level-type=default
online-mode=false
server-port=0
allow-nether=true
generate-structures=false
spawn-protection=0
max-tick-time=-1
''', 'UTF-8')
        }
    }
    def previous = prepare
    ['Fresh', 'Reload', 'Edited'].each { phase ->
        def dependency = previous
        previous = tasks.register("nativeOre${scenario}${phase}", Exec) {
            group = 'verification'
            description = "Checks managed quartz with ${scenario.toLowerCase()} hosts (${phase.toLowerCase()})."
            dependsOn dependency
            doFirst {
                if (!serverRuntime.isPresent()) {
                    throw new GradleException('Pass -PpackagedForgeServerRuntime=<official Forge 65 installation>')
                }
                workingDir runDirectory
                // One generation worker makes independent host-form runs comparable.
                // Ordinary runtime and performance checks keep their normal worker count.
                commandLine shared.forge65ServerCommand(file(serverRuntime.get()), runDirectory,
                        ['-XX:ActiveProcessorCount=2',
                         "-Dnativeoreprobe.phase=${phase.toLowerCase()}",
                         "-Dnativeoreprobe.manage=${managed}",
                         "-Dnativeoreprobe.imported=${imported}",
                         "-Dnativeoreprobe.host=${scenario.toLowerCase()}"])
            }
            doLast {
                Properties result = new Properties()
                File marker = new File(runDirectory, 'native-ore-world/nativeoreprobe.properties')
                if (!marker.isFile()) throw new GradleException("Quartz audit is missing: ${marker}")
                marker.withInputStream { result.load(it) }
                if (result.getProperty("${phase.toLowerCase()}_verified") != 'true') {
                    throw new GradleException("Quartz ${phase.toLowerCase()} was not verified")
                }
                shared.assertRuntimeLogsClean(runDirectory, "Native quartz ${scenario} ${phase}", [] as Set,
                        shared.windowsOshiSystemReportNoise)
                if (new File(runDirectory, 'logs/latest.log').getText('UTF-8')
                        .contains("Ignoring invalid placement rule for OreSpawn-managed ore 'minecraft:nether_quartz_ore'")) {
                    throw new GradleException('Managed quartz was rejected during startup')
                }
                copy { from new File(runDirectory, 'logs/latest.log'); into new File(runDirectory, 'audit-logs');
                    rename { "${phase.toLowerCase()}.log" } }
                copy { from marker; into new File(runDirectory, 'audit-logs');
                    rename { "${phase.toLowerCase()}.properties" } }
            }
        }
    }
    finalTasks.add(previous)
}
tasks.register('nativeOreIntegrationTest') {
    group = 'verification'
    description = 'Checks quartz defaults and imports, vanilla OFF parity, reloads and new-terrain-only edits.'
    dependsOn finalTasks
    doLast {
        ['fresh', 'reload', 'edited'].each { phase ->
            Properties tagged = new Properties()
            Properties explicit = new Properties()
            file("${buildDir}/native-ore-default-run/audit-logs/${phase}.properties")
                    .withInputStream { tagged.load(it) }
            file("${buildDir}/native-ore-explicit-run/audit-logs/${phase}.properties")
                    .withInputStream { explicit.load(it) }
            ['quartz', 'blocks_sha256', 'biomes_sha256', 'new_terrain_quartz', 'water', 'new_terrain_water'].each { key ->
                if (tagged.getProperty(key) != explicit.getProperty(key)) {
                    throw new GradleException("Tag and explicit quartz hosts differ for ${phase}: ${key}")
                }
            }
        }
        logger.lifecycle('Tag and explicit quartz hosts produce identical terrain, fresh/reload/edited')
        [['default', 'imported'], ['offcontrol', 'offimported']].each { pair ->
            ['fresh', 'reload', 'edited'].each { phase ->
                def audits = pair.collect { scenario ->
                    Properties result = new Properties()
                    file("${buildDir}/native-ore-${scenario}-run/audit-logs/${phase}.properties")
                            .withInputStream { result.load(it) }
                    result
                }
                ['quartz', 'blocks_sha256', 'biomes_sha256', 'new_terrain_quartz', 'water', 'new_terrain_water'].each { key ->
                    if (audits[0].getProperty(key) != audits[1].getProperty(key)) {
                        throw new GradleException("Imported quartz changed ${pair}, ${phase}: ${key}")
                    }
                }
            }
        }
        logger.lifecycle('Imported quartz: OFF matches native terrain; ON matches one configured pass; reload and no-retrogen verified')
    }
}
