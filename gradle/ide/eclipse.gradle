// Ordinary Eclipse launches use production classes and processed resources.
def shared = project.ext.oreSpawnBuild
def prepareEclipseResources = shared.prepareEclipseResources
def surfaceIntegrationClasses = shared.surfaceIntegrationClasses
def surfaceIntegrationRunDirectory = shared.surfaceIntegrationRunDirectory
task syncForge40EclipseLaunches(dependsOn: compileSurfaceIntegrationTestMod) {
    group = 'ide'
    dependsOn 'prepareOreSourcesClient'
    doLast {
        String mainOutput = new File(projectDir, 'bin/main').absolutePath
		String ordinaryModClasses = "${mod_id}%%${mainOutput}"
        String fixtureOutput = surfaceIntegrationClasses.absolutePath
        String fixtureResources = new File(projectDir, 'src/biomeIntegrationTest/resources').absolutePath
        String fixtureModClasses = "${mod_id}%%${mainOutput}${File.pathSeparator}" +
                "surfaceprobe%%${fixtureOutput}${File.pathSeparator}" +
                "surfaceprobe%%${fixtureResources}"
		['Client', 'Server', 'Data'].each { String runName ->
			File launch = file("run${runName}.launch")
			if (!launch.isFile()) {
				throw new GradleException("Missing generated Eclipse launch: ${launch}")
			}
			String text = launch.getText('UTF-8')
			if (text.contains('<mapAttribute key="org.eclipse.debug.core.environmentVariables"/>')) {
				text = text.replace(
						'<mapAttribute key="org.eclipse.debug.core.environmentVariables"/>',
						'<mapAttribute key="org.eclipse.debug.core.environmentVariables">\r\n' +
						"    <mapEntry key=\"MOD_CLASSES\" value=\"${ordinaryModClasses}\"/>\r\n" +
						'</mapAttribute>')
			}
			text = text.replaceFirst(
					/<mapEntry key="MOD_CLASSES" value="[^"]*"\/>/,
					java.util.regex.Matcher.quoteReplacement(
							"<mapEntry key=\"MOD_CLASSES\" value=\"${ordinaryModClasses}\"/>"))
			if (!text.contains('org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE')) {
				text = text.replace('</launchConfiguration>',
						'    <booleanAttribute key="org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE" value="true"/>\r\n' +
						'</launchConfiguration>')
			}
			launch.setText(text, 'UTF-8')
		}
        ['Fresh', 'Reload'].each { String phase ->
            File launch = file("runSurfaceIntegration${phase}.launch")
            File serverLaunch = file('runServer.launch')
            if (!serverLaunch.isFile()) {
                throw new GradleException("Missing generated Eclipse launch: ${serverLaunch}")
            }
            String text = serverLaunch.getText('UTF-8')
            text = text.replaceFirst(
                    /<mapEntry key="MOD_CLASSES" value="[^"]*"\/>/,
                    java.util.regex.Matcher.quoteReplacement(
                            "<mapEntry key=\"MOD_CLASSES\" value=\"${fixtureModClasses}\"/>"))
            text = text.replaceFirst(
                    /<stringAttribute key="org.eclipse.jdt.launching.VM_ARGUMENTS" value="([^"]*)"\/>/,
                    { String match, String arguments ->
                        "<stringAttribute key=\"org.eclipse.jdt.launching.VM_ARGUMENTS\" value=\"${arguments} -Dsurfaceprobe.integrationPhase=${phase.toLowerCase(Locale.ROOT)}\"/>"
                    })
            text = text.replaceFirst(
                    /<stringAttribute key="org.eclipse.jdt.launching.WORKING_DIRECTORY" value="[^"]*"\/>/,
                    java.util.regex.Matcher.quoteReplacement(
                            "<stringAttribute key=\"org.eclipse.jdt.launching.WORKING_DIRECTORY\" value=\"${surfaceIntegrationRunDirectory.absolutePath}\"/>"))
            launch.setText(text, 'UTF-8')
        }
        // Inherit Forge 40's module path, assets, mappings and JRE.
        def parser = new groovy.xml.XmlParser(false, false)
        parser.setTrimWhitespace(true)
        def manual = parser.parse(file('runClient.launch'))
        manual.stringAttribute.find {
            it.@key == 'org.eclipse.jdt.launching.WORKING_DIRECTORY'
        }.@value = file('run-ore-sources').absolutePath
        manual.mapAttribute.find {
            it.@key == 'org.eclipse.debug.core.environmentVariables'
        }.mapEntry.find { it.@key == 'MOD_CLASSES' }.@value =
                shared.oreSourcesClientModClasses(file('bin/main'))
        def classpath = manual.listAttribute.find {
            it.@key == 'org.eclipse.jdt.launching.CLASSPATH'
        }
        shared.oreSourceFixtureOutputs.values().each { File output ->
            def entry = new Node(null, 'runtimeClasspathEntry', [
                    externalArchive: output.absolutePath, type: '2', path: '5'])
            classpath.appendNode('listEntry', [value: groovy.xml.XmlUtil.serialize(entry)])
        }
        String manualText = groovy.xml.XmlUtil.serialize(manual).replace('\r\n', '\n')
        file('runOreSourcesClient.launch').setText(manualText, 'UTF-8')
        file('runTestOreSourcesClient.launch').setText(manualText, 'UTF-8')
    }
}

task verifyForge40EclipseLaunchIsolation {
    group = 'verification'
    doLast {
        ['runClient.launch', 'runServer.launch', 'runData.launch'].each { String launchName ->
            File launch = file(launchName)
            String launchText = launch.getText('UTF-8')
            if (launchText.contains('Mineralogy-') || launchText.contains('biomeIntegrationTest') ||
                    !launchText.contains('org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE')) {
                throw new GradleException("Ordinary Eclipse launch is not isolated from test oracles: ${launch}")
            }
        }
    }
}

syncForge40EclipseLaunches.finalizedBy verifyForge40EclipseLaunchIsolation

tasks.matching { it.name == 'genEclipseRuns' }.all {
    finalizedBy syncForge40EclipseLaunches
}

eclipse {
    classpath {
        downloadSources = true
        downloadJavadoc = true
        file.whenMerged { classpath ->
            classpath.entries.removeAll { entry ->
                entry instanceof org.gradle.plugins.ide.eclipse.model.SourceFolder
                        && ['src/main/resources', 'src/generated/resources'].contains(entry.path)
            }
            if (!classpath.entries.any { entry -> entry.path == 'build/resources/main' }) {
                classpath.entries.add(new org.gradle.plugins.ide.eclipse.model.SourceFolder(
                        'build/resources/main', 'bin/main'))
            }
        }
    }
    synchronizationTasks 'isolateEclipseProductionRuns'
}
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
tasks.register('configureEclipseBuildship') {
    group = 'ide'
    doLast {
        File preferencesFile = file('.settings/org.eclipse.buildship.core.prefs')
        Properties preferences = new Properties()
        [
                'eclipse.preferences.version'    : '1',
                'connection.gradle.distribution': 'GRADLE_DISTRIBUTION(WRAPPER)',
                'connection.gradle.user.home'   : gradle.gradleUserHomeDir.canonicalPath,
                'connection.project.dir'        : '',
                'gradle.user.home'               : gradle.gradleUserHomeDir.canonicalPath,
                'override.workspace.settings'   : 'true'
        ].each { key, value -> preferences.setProperty(key, value) }
        preferencesFile.parentFile.mkdirs()
        preferencesFile.withOutputStream {
            preferences.store(it, 'Generated by OreSpawn Buildship configuration.')
        }
    }
}
tasks.register('isolateEclipseProductionRuns') {
    group = 'ide'
    dependsOn tasks.named('genEclipseRuns')
    dependsOn syncForge40EclipseLaunches
    dependsOn tasks.named('configureEclipseBuildship')
    dependsOn prepareEclipseResources
    doLast {
        [
                'OreSpawn_Client.launch': 'GradleStart',
                'OreSpawn_Server.launch': 'GradleStartServer'
        ].each { String name, String mainClass ->
            File launch = file(name)
            if (launch.isFile() && launch.getText('UTF-8').contains(mainClass)
                    && !launch.delete()) {
                throw new GradleException("Could not remove obsolete launch ${name}")
            }
        }
        fileTree(project.projectDir) { include 'run*.launch' }.files.each { launch ->
            String contents = launch.getText('UTF-8')
            contents = contents.replace(
                    'key="MC_VERSION" value="${MC_VERSION}"',
                    "key=\"MC_VERSION\" value=\"${minecraft_version}\"")
            launch.setText(contents.replace('\r\n', '\n'), 'UTF-8')
        }
    }
}
tasks.register('verifyEclipseProductionClasspath') {
    group = 'verification'
    dependsOn tasks.named('eclipseClasspath')
    dependsOn tasks.named('eclipseProject')
    dependsOn tasks.named('isolateEclipseProductionRuns')
    dependsOn tasks.named('verifyLegacyOracleIsolation')
    doLast {
        File prefs = file('.settings/org.eclipse.buildship.core.prefs')
        if (!prefs.isFile()) throw new GradleException('Missing Buildship preferences')
        Properties buildshipPreferences = new Properties()
        prefs.withInputStream { buildshipPreferences.load(it) }
        String expectedGradleHome = gradle.gradleUserHomeDir.canonicalPath
        if (buildshipPreferences.getProperty('connection.gradle.user.home') != expectedGradleHome
                || buildshipPreferences.getProperty('gradle.user.home') != expectedGradleHome
                || buildshipPreferences.getProperty('override.workspace.settings') != 'true') {
            throw new GradleException(
                    "Eclipse Buildship must use the validated Gradle home ${expectedGradleHome}")
        }
        Set<String> legacyLwjglArtifacts = configurations.compileClasspath.resolvedConfiguration
                .resolvedArtifacts
                .findAll { it.moduleVersion.id.group == 'org.lwjgl.lwjgl' }
                .collect { "${it.moduleVersion.id.group}:${it.name}:${it.moduleVersion.id.version}" }
                .toSet()
        if (!legacyLwjglArtifacts.isEmpty()) {
            throw new GradleException(
                    "Forge 1.18 Eclipse classpath contains legacy LWJGL 2 artifacts: ${legacyLwjglArtifacts}")
        }
        File eclipseClasspath = file('.classpath')
        if (!eclipseClasspath.isFile()) {
            throw new GradleException('Eclipse .classpath was not generated')
        }
        String eclipseClasspathText = eclipseClasspath.getText('UTF-8')
        if (!eclipseClasspathText.contains('path="build/resources/main"')
                || eclipseClasspathText.contains('path="src/main/resources"')
                || eclipseClasspathText.contains('path="src/generated/resources"')) {
            throw new GradleException(
                    'Eclipse must consume only Gradle-processed production resources')
        }
        [
                'META-INF/mods.toml',
                'META-INF/orespawn/docs/README.md',
                'META-INF/orespawn/docs/VERSIONS.md'
        ].each { relative ->
            if (!new File('bin/main', relative).isFile()) {
                throw new GradleException("Eclipse output is missing ${relative}")
            }
        }
        File processedModMetadata = new File(sourceSets.main.output.resourcesDir,
                'META-INF/mods.toml')
        File eclipseModMetadata = file('bin/main/META-INF/mods.toml')
        if (!java.util.Arrays.equals(processedModMetadata.bytes, eclipseModMetadata.bytes)
                || eclipseModMetadata.getText('UTF-8').contains('${version}')
                || !eclipseModMetadata.getText('UTF-8').contains(
                        "version=\"${project.version}\"")) {
            throw new GradleException(
                    'Eclipse output contains unexpanded or stale Forge mod metadata')
        }
        List<String> forbidden = [
                'src/test', 'bin/test', 'build/classes/java/test',
                'biomeIntegrationTest', 'clientIntegrationTest',
                'oreSourceMineralsTest', 'oreSourceAdvantageTest', 'worldHashTest',
                'nativeOreIntegrationTest', 'nativeoreprobe', 'native-ore-fixture',
                'worldhashprobe', 'oresource-minerals', 'oresource-advantage',
                'surfaceprobe', 'clientprobe', 'junit-', 'opentest4j-',
                'Mineralogy-1.18.2-5.4.0.jar', 'C:\\Users\\John'
        ]
        String mainOutput = new File(projectDir, 'bin/main').absolutePath
        String expectedModClasses = "${mod_id}%%${mainOutput}"
        ['runClient.launch', 'runServer.launch', 'runData.launch'].each { name ->
            File launch = file(name)
            if (!launch.isFile()) throw new GradleException("Missing ${name}")
            String contents = launch.getText('UTF-8')
            List<String> leaked = forbidden.findAll { contents.contains(it) }
            if (!leaked.isEmpty()) {
                throw new GradleException("${name} exposes test/local content: ${leaked}")
            }
            if (!contents.contains('ATTR_EXCLUDE_TEST_CODE')
                    || !contents.contains('PROJECT_ATTR" value="OreSpawn"')) {
                throw new GradleException("${name} is not a production-only OreSpawn launch")
            }
            if (!contents.contains("MOD_CLASSES\" value=\"${expectedModClasses}\"")) {
                throw new GradleException("${name} lacks Forge 40 merged output discovery")
            }
        }
    }
}

tasks.register('verifyCommandPortability') {
    group = 'verification'
    description = 'Rejects shell-specific launch wrappers and hard-coded classpath separators.'
    doLast {
        String gradleSource = fileTree('gradle') { include '**/*.gradle' }.files
                .collect { it.getText('UTF-8') }.join('\n')
        List<File> commandSources = [file('build.gradle')]
        commandSources.addAll(fileTree('gradle') { include '**/*.gradle' }.files)
        commandSources.addAll(fileTree('.github/workflows') { include '*.yml', '*.yaml' }.files)
        commandSources.each { File source ->
            String text = source.getText('UTF-8')
            if (text =~ /(?i)(?:commandLine|executable|run:)\s*[^\n]*(?:cmd(?:\.exe)?\s+\/c|powershell(?:\.exe)?\s+-command|(?:bash|sh)\s+-c)/) {
                throw new GradleException("Shell-specific command wrapper in ${source}")
            }
        }
        if (!gradleSource.contains('commandLine(([javaExecutable.absolutePath] + arguments) as List<String>)')
                || !gradleSource.contains('join(File.pathSeparator)')
                || !gradleSource.contains('${File.pathSeparator}')) {
            throw new GradleException('Runtime commands and exploded-mod paths must use native argument/path APIs')
        }
    }
}

tasks.named('check') { dependsOn tasks.named('verifyCommandPortability') }
tasks.named('check') { dependsOn tasks.named('verifyMavenCoordinates') }

// The named test launch inherits the ordinary launch rather than guessing
// Forge's module path, asset locations or Slime Launcher mapping arguments.
project.ext.oreSpawnBuild.oreSourcesClientLaunch = {
    def xml = new groovy.xml.XmlParser(false, false).parse(file('runOreSourcesClient.launch'))
    def attribute = { String key -> xml.stringAttribute.find { it.@key == key }.@value.toString() }
    Map<String, String> environment = [:]
    xml.mapAttribute.find {
        it.@key == 'org.eclipse.debug.core.environmentVariables'
    }.mapEntry.each { environment[it.@key.toString()] = it.@value.toString() }
    List<File> archives = []
    xml.listAttribute.find {
        it.@key == 'org.eclipse.jdt.launching.CLASSPATH'
    }.listEntry.each { entry ->
        def runtime = new groovy.xml.XmlParser(false, false).parseText(entry.@value.toString())
        if (runtime.@externalArchive) archives.add(file(runtime.@externalArchive.toString()))
    }
    [mainClass: attribute('org.eclipse.jdt.launching.MAIN_TYPE'),
            jvmArguments: org.apache.tools.ant.types.Commandline.translateCommandline(
                    attribute('org.eclipse.jdt.launching.VM_ARGUMENTS')) as List,
            arguments: org.apache.tools.ant.types.Commandline.translateCommandline(
                    attribute('org.eclipse.jdt.launching.PROGRAM_ARGUMENTS')) as List,
            environment: environment, archives: archives]
}

def requiredClientArguments = [
        '--main': 'cpw.mods.bootstraplauncher.BootstrapLauncher',
        '--launchTarget': 'forgeclientuserdev', '--fml.forgeVersion': forge_version,
        '--fml.mcVersion': minecraft_version, '--fml.forgeGroup': 'net.minecraftforge',
        '--fml.mcpVersion': mcp_version
]
def verifyClientBootstrap = { Map launch ->
    if (launch.mainClass != 'net.minecraftforge.launcher.Main'
            || !launch.jvmArguments.contains('-p')
            || !launch.jvmArguments.contains('ALL-MODULE-PATH')
            || launch.environment.MCP_MAPPINGS != "${mapping_channel}_${mapping_version}".toString()) {
        throw new GradleException('The client needs Forge 40 module, mapping and launcher settings')
    }
    requiredClientArguments.each { key, expected ->
        int index = launch.arguments.indexOf(key)
        if (index < 0 || index + 1 >= launch.arguments.size()
                || launch.arguments[index + 1] != expected.toString()) {
            throw new GradleException("The client needs ${key} ${expected}")
        }
    }
}

tasks.register('oreSourcesClientLaunchContractTest') {
    group = 'verification'
    description = 'Rejects missing or incorrect Forge 40 client bootstrap arguments.'
    doLast {
        Map valid = [mainClass: 'net.minecraftforge.launcher.Main',
                jvmArguments: ['-p', 'modules', '--add-modules', 'ALL-MODULE-PATH'],
                arguments: requiredClientArguments.collectMany { key, value -> [key, value.toString()] },
                environment: [MCP_MAPPINGS: "${mapping_channel}_${mapping_version}".toString()]]
        verifyClientBootstrap(valid)
        requiredClientArguments.keySet().each { key ->
            ['missing', 'incorrect'].each { scenario ->
                Map invalid = new LinkedHashMap(valid)
                invalid.arguments = new ArrayList(valid.arguments)
                int index = invalid.arguments.indexOf(key)
                if (scenario == 'missing') {
                    invalid.arguments.remove(index + 1)
                    invalid.arguments.remove(index)
                } else invalid.arguments[index + 1] = 'incorrect'
                boolean rejected = false
                try { verifyClientBootstrap(invalid) }
                catch (GradleException expected) { rejected = true }
                if (!rejected) throw new GradleException("Client launch accepted ${scenario} ${key}")
            }
        }
    }
}

tasks.register('verifyOreSourcesClientLaunch') {
    group = 'verification'
    description = 'Checks the shared-ore client stays separate from production and automatic probes.'
    dependsOn tasks.named('isolateEclipseProductionRuns')
    doLast {
        Map launch = project.ext.oreSpawnBuild.oreSourcesClientLaunch()
        verifyClientBootstrap(launch)
        ['runOreSourcesClient.launch', 'runTestOreSourcesClient.launch'].each { name ->
            File source = file(name)
            def xml = new groovy.xml.XmlParser(false, false).parse(source)
            if (xml.stringAttribute.find {
                it.@key == 'org.eclipse.jdt.launching.WORKING_DIRECTORY'
            }.@value.toString() != file('run-ore-sources').absolutePath
                    || launch.environment.MOD_CLASSES !=
                    project.ext.oreSpawnBuild.oreSourcesClientModClasses(file('bin/main'))) {
                throw new GradleException('Shared-ore launch must use its separate directory and merged fixture outputs')
            }
            ['bin/test', 'src/test', 'junit-', 'clientprobe', 'surfaceprobe',
                    'oresourceprobe.phase', 'clientprobe.enabled'].each { forbidden ->
                if (source.getText('UTF-8').contains(forbidden)) {
                    throw new GradleException("Manual launch leaked ${forbidden}")
                }
            }
        }
        project.ext.oreSpawnBuild.oreSourceFixtureOutputs.values().each { File output ->
            if (!new File(output, 'META-INF/mods.toml').isFile() || !launch.archives.contains(output)) {
                throw new GradleException("Missing shared-ore fixture output ${output}")
            }
        }
        if (!java.util.Arrays.equals(file('runOreSourcesClient.launch').bytes,
                file('runTestOreSourcesClient.launch').bytes)) {
            throw new GradleException('Both shared-ore launch names must stay identical')
        }
    }
}

// Eclipse copies resources again during a Java rebuild; test that copy too.
tasks.register('eclipseResourceRebuildTest') {
    group = 'verification'
    description = 'Checks an Eclipse rebuild retains expanded Forge metadata and bundled guides.'
    dependsOn tasks.named('eclipseClasspath'), tasks.named('processResources')
    doLast {
        def xml = new groovy.xml.XmlParser(false, false).parse(file('.classpath'))
        List<String> resourceFolders = xml.classpathentry.findAll { entry ->
            entry.@kind == 'src' && entry.@output == 'bin/main'
                    && entry.@path != 'src/main/java'
        }.collect { it.@path.toString() }
        if (resourceFolders != ['build/resources/main']) {
            throw new GradleException("Eclipse must rebuild from processed resources only: ${resourceFolders}")
        }
        File rebuilt = file("${buildDir}/eclipse-resource-rebuild-test")
        project.sync { resourceFolders.each { from file(it) }; into rebuilt }
        File metadata = new File(rebuilt, 'META-INF/mods.toml')
        File processed = file("${buildDir}/resources/main/META-INF/mods.toml")
        if (!metadata.isFile() || metadata.getText('UTF-8').contains('${version}')
                || !java.util.Arrays.equals(metadata.bytes, processed.bytes)) {
            throw new GradleException('Eclipse rebuild copied unexpanded or stale Forge metadata')
        }
        ['README.md', 'VERSIONS.md'].each { name ->
            if (!new File(rebuilt, "META-INF/orespawn/docs/${name}").isFile()) {
                throw new GradleException("Eclipse rebuild lost the bundled guide ${name}")
            }
        }
    }
}
tasks.named('check') {
    dependsOn tasks.named('eclipseResourceRebuildTest'), tasks.named('oreSourcesClientLaunchContractTest')
}
