import groovy.json.JsonSlurper
import java.nio.charset.StandardCharsets
import java.security.MessageDigest
import java.util.jar.Manifest
import java.util.zip.ZipFile

def shared = project.ext.oreSpawnBuild
def expectedMavenGroup = shared.mavenGroup
def expectedMavenArtifact = shared.mavenArtifact
def expectedMavenCoordinate = shared.mavenCoordinate
def archiveTextSuffixes = shared.archiveTextSuffixes
def archiveTextPatterns = shared.archiveTextPatterns
def normalizeArchiveLineEndings = shared.normalizeArchiveLineEndings

tasks.named('jar', Jar) {
    archiveClassifier = 'deobf'
    destinationDirectory = layout.buildDirectory.dir('libs-dev')
    manifest {
        attributes([
                'Specification-Title'      : 'OreSpawn',
                'Specification-Vendor'     : 'SkyBlade1978',
                'Specification-Version'    : '1',
                'Implementation-Title'     : base.archivesName.get(),
                'Implementation-Version'   : project.version,
                'Implementation-Vendor'    : 'SkyBlade1978',
                'OreSpawn-API-Version'     : '1',
                'FMLAT'                    : 'accesstransformer.cfg',
                'Maven-Artifact'           : expectedMavenCoordinate,
                'Built-On-Java'            : '8',
                'Built-On'                 : "${project.minecraft_version}-${project.forge_version}"
        ])
    }
}

def releaseJar = renamer.classes(tasks.named('jar', Jar)) {
    map.from minecraft.dependency.toSrgFile
    archiveClassifier = null
    accessTransformers = true
    output = layout.buildDirectory.file(
            "libs/${base.archivesName.get()}-${project.version}.jar")
}

tasks.named('sourcesJar', Jar) {
    dependsOn prepareBundledDocumentation
    filteringCharset = 'UTF-8'
    includeEmptyDirs = false
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
    manifest {
        attributes([
                'Implementation-Title'  : 'OreSpawn-sources',
                'Implementation-Version': project.version
        ])
    }
}
tasks.named('javadocJar', Jar) {
    filteringCharset = 'UTF-8'
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
    manifest {
        attributes([
                'Implementation-Title'  : 'OreSpawn-javadoc',
                'Implementation-Version': project.version
        ])
    }
}
['apiElements', 'runtimeElements'].each { configurationName ->
    configurations.named(configurationName) { artifacts.clear() }
    artifacts { add(configurationName, releaseJar) }
}
tasks.named('assemble') {
    dependsOn releaseJar
    dependsOn tasks.named('sourcesJar')
    dependsOn tasks.named('javadocJar')
}

def expectedReleaseFiles = providers.provider {
    String prefix = "${base.archivesName.get()}-${project.version}"
    ["${prefix}.jar", "${prefix}-sources.jar", "${prefix}-javadoc.jar"]
}
def preparedReleaseDir = providers.gradleProperty('preparedReleaseDir')

tasks.register('verifyReleaseConfiguration') {
    group = 'verification'
    doLast {
        if (project.mod_version != '4.1.0.113021'
                || project.mod_group != expectedMavenGroup
                || project.minecraft_version != '1.13.2'
                || project.forge_version != '25.0.223'
                || project.mapping_channel != 'snapshot'
                || project.mapping_version != '20180921-1.13') {
            throw new GradleException('Unexpected OreSpawn 1.13.2 release identity')
        }
        if (project.loader_name != 'forge' || project.loader_code != '1'
                || project.java_version != '8' || project.gradle_java_version != '17'
                || project.java_toolchain_version != '8.0.502+7') {
            throw new GradleException('Unexpected dispatcher or Java target metadata')
        }
        List<String> expectedPublicArtifacts = [
                'OreSpawn-4.1.0.113021.jar',
                'OreSpawn-4.1.0.113021-sources.jar',
                'OreSpawn-4.1.0.113021-javadoc.jar'
        ]
        if (base.archivesName.get() != expectedMavenArtifact
                || expectedReleaseFiles.get().collect { it.toString() } != expectedPublicArtifacts) {
            throw new GradleException('Public artifacts must use the version-only OreSpawn filename contract')
        }
        String ciWorkflow = file('.github/workflows/ci.yml').getText('UTF-8')
        expectedPublicArtifacts.each { artifactName ->
            if (!ciWorkflow.contains("build/libs/${artifactName}")) {
                throw new GradleException("CI does not upload expected public artifact ${artifactName}")
            }
        }
        [
                'src/main/java/zone/moddev/mc/orespawn/worldgen/LegacyConfigMigrator.java',
                'src/main/java/zone/moddev/mc/orespawn/worldgen/LegacyMineralogyProfileMigration.java',
                'README.md', 'CHANGELOG.txt'
        ].each { path ->
            if (!file(path).getText('UTF-8').contains('4.1.0.113021')) {
                throw new GradleException("Release identity missing from ${path}")
            }
        }
        if (!file('docs/API.md').getText('UTF-8').contains('versionRange="[4.0.6,5.0.0)"')) {
            throw new GradleException('Consumer compatibility floor must remain [4.0.6,5.0.0)')
        }
        if (!file('src/main/java/zone/moddev/mc/orespawn/api/OreSpawnApi.java')
                .getText('UTF-8').contains('API_VERSION = 1')) {
            throw new GradleException('OreSpawn API major must remain 1')
        }
        if (!file('src/main/java/zone/moddev/mc/orespawn/worldgen/GeomeConfig.java')
                .getText('UTF-8').contains('SCHEMA_VERSION = 8')
                || !file('src/main/java/zone/moddev/mc/orespawn/worldgen/WorldGeologyProfile.java')
                .getText('UTF-8').contains('SCHEMA_VERSION = 7')) {
            throw new GradleException('Global/world schemas must remain 8/7')
        }
        def schema = new JsonSlurper().parse(file('docs/schemas/orespawn-provider.schema.json'))
        if (!(schema.properties.schema_version.enum as List).contains(5)) {
            throw new GradleException('Provider schema must remain version 5')
        }
    }
}

tasks.register('verifyReleaseArtifacts') {
    group = 'verification'
    dependsOn tasks.named('verifyReleaseConfiguration')
    dependsOn tasks.named('assemble')
    doLast {
        File libs = layout.buildDirectory.dir('libs').get().asFile
        List<File> jars = (libs.listFiles() ?: [] as File[])
                .findAll { it.name.endsWith('.jar') }.sort { it.name }
        // Convert interpolated GStrings to Strings before comparing them with filesystem names.
        List<String> expected = expectedReleaseFiles.get()
                .collect { it.toString() }.sort()
        if (jars.collect { it.name } != expected) {
            throw new GradleException("Expected exactly ${expected}, found ${jars*.name}")
        }
        jars.each { candidate ->
            if (candidate.length() == 0L) throw new GradleException("Empty artifact ${candidate}")
            new ZipFile(candidate).withCloseable { zip ->
                zip.entries().findAll { entry ->
                    !entry.isDirectory() && (archiveTextSuffixes.any { entry.name.endsWith(it) }
                            || entry.name.endsWith('/element-list')
                            || entry.name.endsWith('/package-list'))
                }.each { entry ->
                    boolean cr = zip.getInputStream(entry).withCloseable {
                        input -> input.bytes.any { value -> value == 13 }
                    }
                    if (cr) throw new GradleException(
                            "${candidate.name}!/${entry.name} is not LF-normalized")
                }
                [
                        'src/test/', 'src/biomeIntegrationTest/', 'src/clientIntegrationTest/',
                        'src/oreSourceMineralsTest/', 'src/oreSourceAdvantageTest/',
                        'src/nativeOreIntegrationTest/', 'nativeoreprobe',
                        'NativeOreProbeTestMod', 'NativeOreProbeBridge',
                        'src/worldHashTest/', 'agent-notes/', 'surfaceprobe', 'clientprobe',
                        'worldhashprobe', 'oresource-minerals',
                        'oresource-advantage', 'ci-fixtures/',
                        'FutureMineralsTestMod', 'FutureAdvantageTestMod',
                        'BiomeEditorProbeBridge', 'WorldHashProbeTestMod',
                        'org/junit/', 'org/mockito/', 'net/bytebuddy/',
                        'Mineralogy-1.13.2-5.0.1.jar'
                ].each { forbidden ->
                    if (zip.entries().any { it.name.contains(forbidden) }) {
                        throw new GradleException(
                                "${candidate.name} contains forbidden ${forbidden}")
                    }
                }
            }
        }

        File mainJar = new File(libs, expectedReleaseFiles.get()[0])
        new ZipFile(mainJar).withCloseable { zip ->
            List<String> names = zip.entries().collect { it.name }
            [
                    'META-INF/mods.toml',
                    'META-INF/accesstransformer.cfg',
                    'zone/moddev/mc/orespawn/api/OreSpawnApi.class',
                    'META-INF/orespawn/docs/README.md',
                    'META-INF/orespawn/docs/VERSIONS.md',
                    'META-INF/orespawn/docs/schemas/orespawn-provider.schema.json'
            ].each { required ->
                if (!names.contains(required)) {
                    throw new GradleException("Release jar is missing ${required}")
                }
            }
            if (names.contains('AGENTS.md') || names.contains('META-INF/orespawn/docs/AGENTS.md')) {
                throw new GradleException('Agent instructions must not be packaged as public documentation')
            }
            List<File> publicDocs = fileTree('docs') { include '**/*' }.files
                    .findAll { it.isFile() }.sort { project.relativePath(it) }
            if (publicDocs.size() != 20) {
                throw new GradleException("Expected 20 public documentation files, found ${publicDocs.size()}")
            }
            publicDocs.each { File source ->
                String relative = file('docs').toPath().relativize(source.toPath())
                        .toString().replace('\\', '/')
                def entry = zip.getEntry("META-INF/orespawn/docs/${relative}")
                if (entry == null || !java.util.Arrays.equals(source.bytes,
                        zip.getInputStream(entry).bytes)) {
                    throw new GradleException("Packaged guide differs from docs/${relative}")
                }
            }
            String metadata = zip.getInputStream(zip.getEntry('META-INF/mods.toml'))
                    .getText(StandardCharsets.UTF_8.name())
            if (!metadata.contains('modId="orespawn"')
                    || !metadata.contains("version=\"${project.version}\"")
                    || !metadata.contains('versionRange="[1.13.2]"')) {
                throw new GradleException('Packaged Forge metadata is incorrect')
            }
            String transformer = zip.getInputStream(
                    zip.getEntry('META-INF/accesstransformer.cfg'))
                    .getText(StandardCharsets.UTF_8.name())
            List<String> actualRules = transformer.readLines()
                    .collect { it.replaceFirst(/\s*#.*/, '').trim() }
                    .findAll { !it.isEmpty() }
            List<String> expectedRules = [
                    'public-f net.minecraft.world.gen.AbstractChunkGenerator field_202097_c',
                    'public-f net.minecraft.world.gen.ChunkGeneratorOverworld field_205476_s',
                    'public-f net.minecraft.world.gen.ChunkGeneratorNether field_205604_n',
                    'public-f net.minecraft.world.gen.ChunkGeneratorEnd field_205477_p',
                    'public net.minecraft.world.biome.Biome field_201874_aj'
            ]
            if (actualRules != expectedRules) {
                throw new GradleException("Unexpected packaged SRG access transformer: ${actualRules}")
            }
            def manifestEntry = zip.getEntry('META-INF/MANIFEST.MF')
            def manifest = manifestEntry == null ? null :
                    new Manifest(zip.getInputStream(manifestEntry)).mainAttributes
            if (manifest == null
                    || manifest.getValue('Implementation-Version') != project.mod_version
                    || manifest.getValue('OreSpawn-API-Version') != '1'
                    || manifest.getValue('FMLAT') != 'accesstransformer.cfg'
                    || manifest.getValue('Maven-Artifact') != expectedMavenCoordinate
                    || manifest.getValue('Implementation-Timestamp') != null) {
                throw new GradleException('Release manifest is incorrect or volatile')
            }
            zip.entries().findAll { it.name.endsWith('.class') }.each { entry ->
                byte[] header = new byte[8]
                zip.getInputStream(entry).withCloseable { input ->
                    if (input.read(header) != 8) throw new GradleException("Cannot inspect ${entry.name}")
                }
                int major = ((header[6] & 0xff) << 8) | (header[7] & 0xff)
                if (major != 52) {
                    throw new GradleException("${entry.name} uses class major ${major}, expected 52")
                }
            }
        }
        new ZipFile(new File(libs, expectedReleaseFiles.get()[1])).withCloseable { zip ->
            if (zip.getEntry('zone/moddev/mc/orespawn/OreSpawn.java') == null) {
                throw new GradleException('Sources jar is missing OreSpawn.java')
            }
        }
        new ZipFile(new File(libs, expectedReleaseFiles.get()[2])).withCloseable { zip ->
            if (zip.getEntry('index.html') == null) {
                throw new GradleException('Javadoc jar is missing index.html')
            }
        }
    }
}

tasks.register('writeReleaseChecksums') {
    group = 'verification'
    dependsOn tasks.named('verifyReleaseArtifacts')
    def outputFile = layout.buildDirectory.file('release/SHA256SUMS')
    outputs.file(outputFile)
    doLast {
        File output = outputFile.get().asFile
        output.parentFile.mkdirs()
        File libs = layout.buildDirectory.dir('libs').get().asFile
        String contents = expectedReleaseFiles.get().sort().collect { name ->
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            new File(libs, name).withInputStream { input ->
                byte[] buffer = new byte[8192]
                for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
                    if (read > 0) digest.update(buffer, 0, read)
                }
            }
            "${digest.digest().encodeHex().toString().toUpperCase()}  ${name}"
        }.join('\n') + '\n'
        output.setText(contents, 'UTF-8')
    }
}

tasks.register('verifyPreparedReleaseArtifacts') {
    group = 'verification'
    doLast {
        if (!preparedReleaseDir.isPresent()) {
            throw new GradleException('preparedReleaseDir is required')
        }
        File prepared = file(preparedReleaseDir.get())
        // Convert interpolated GStrings to Strings before comparing them with filesystem names.
        List<String> expected = expectedReleaseFiles.get()
                .collect { it.toString() }.sort()
        List<File> jars = (prepared.listFiles() ?: [] as File[])
                .findAll { it.name.endsWith('.jar') }.sort { it.name }
        List<String> actualNames = jars.collect { it.name.toString() }.sort()
        if (actualNames != expected) {
            throw new GradleException(
                    "Prepared release jars ${actualNames} do not match ${expected}")
        }
        if (jars.any { it.length() == 0L }) {
            throw new GradleException('Prepared release contains an empty jar')
        }
        File checksums = new File(prepared, 'SHA256SUMS')
        if (!checksums.isFile() || !new File(prepared, 'CHANGELOG.txt').isFile()) {
            throw new GradleException('Prepared release is missing checksums or changelog')
        }
        List<String> actual = jars.collect { candidate ->
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            candidate.withInputStream { input ->
                byte[] buffer = new byte[8192]
                for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
                    if (read > 0) digest.update(buffer, 0, read)
                }
            }
            "${digest.digest().encodeHex().toString().toUpperCase()}  ${candidate.name}"
        }.sort()
        if (actual != checksums.readLines('UTF-8').findAll { !it.trim().isEmpty() }.sort()) {
            throw new GradleException('Prepared release checksums do not match')
        }
    }
}
shared.releaseJar = releaseJar
shared.expectedReleaseFiles = expectedReleaseFiles
shared.preparedReleaseDir = preparedReleaseDir
