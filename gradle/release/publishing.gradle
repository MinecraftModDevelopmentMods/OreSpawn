// Maven coordinates and opt-in publication.
import groovy.json.JsonSlurper
import groovy.xml.XmlSlurper
import java.nio.charset.StandardCharsets
import java.security.MessageDigest
import java.util.jar.Manifest
import java.util.zip.ZipFile
import org.apache.tools.ant.filters.FixCrLfFilter

def shared = project.ext.oreSpawnBuild
def expectedMavenGroup = shared.expectedMavenGroup
def expectedMavenArtifact = shared.expectedMavenArtifact
def preparedReleaseDir = shared.preparedReleaseDir
def expectedReleaseFiles = shared.expectedReleaseFiles
def releaseJar = shared.releaseJar

def mavenUploadUrl = providers.environmentVariable('MAVEN_UPLOAD_URL')
        .orElse('https://invalid.invalid/missing-maven-upload-url')
def mavenUploadUsername = providers.environmentVariable('MAVEN_UPLOAD_USERNAME')
def mavenUploadPassword = providers.environmentVariable('MAVEN_UPLOAD_PASSWORD')

publishing {
    publications {
		mavenJava(MavenPublication) {
			groupId = expectedMavenGroup
			artifactId = expectedMavenArtifact
            version = project.version.toString()
            if (preparedReleaseDir.isPresent()) {
                File prepared = file(preparedReleaseDir.get())
                artifact(new File(prepared, expectedReleaseFiles.get()[0]))
                artifact(new File(prepared, expectedReleaseFiles.get()[1])) {
                    classifier = 'sources'
                }
                artifact(new File(prepared, expectedReleaseFiles.get()[2])) {
                    classifier = 'javadoc'
                }
            } else {
                artifact(releaseJar)
                artifact(tasks.named('sourcesJar'))
                artifact(tasks.named('javadocJar'))
            }
            pom {
                name = 'MMD OreSpawn'
                description = project.mod_description
                url = 'https://github.com/MinecraftModDevelopmentMods/OreSpawn'
                licenses {
                    license {
                        name = 'GNU Lesser General Public License, Version 2.1'
                        url = 'https://www.gnu.org/licenses/old-licenses/lgpl-2.1.txt'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/MinecraftModDevelopmentMods/OreSpawn.git'
                    developerConnection = 'scm:git:ssh://git@github.com/MinecraftModDevelopmentMods/OreSpawn.git'
                    url = 'https://github.com/MinecraftModDevelopmentMods/OreSpawn'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'release'
            url = uri(mavenUploadUrl.get())
            credentials {
                username = mavenUploadUsername.orNull ?: ''
                password = mavenUploadPassword.orNull ?: ''
            }
        }
    }
}

tasks.register('verifyMavenCoordinates') {
	group = 'verification'
	description = 'Verifies the generated POM uses OreSpawn\'s mod-specific Maven namespace.'
	dependsOn tasks.named('generatePomFileForMavenJavaPublication')
	doLast {
		File pomFile = layout.buildDirectory.file(
				'publications/mavenJava/pom-default.xml').get().asFile
		if (!pomFile.isFile()) {
			throw new GradleException("Generated Maven POM does not exist: ${pomFile}")
		}
		def pom = new XmlSlurper(false, false).parse(pomFile)
		def actual = [pom.groupId.text(), pom.artifactId.text(), pom.version.text()]
		def expected = [expectedMavenGroup, expectedMavenArtifact, project.version.toString()]
		if (project.group.toString() != expectedMavenGroup || actual != expected) {
			throw new GradleException("Expected Maven coordinate ${expected.join(':')}, "
					+ "found ${actual.join(':')}")
		}
	}
}

tasks.register('validateMavenReleaseCredentials') {
    group = 'publishing'
    description = 'Prevents Maven publication from targeting a local or incomplete repository.'
    doLast {
        if (!providers.environmentVariable('MAVEN_UPLOAD_URL').isPresent()
                || !mavenUploadUsername.isPresent()
                || !mavenUploadPassword.isPresent()) {
            throw new GradleException(
                    'MAVEN_UPLOAD_URL, MAVEN_UPLOAD_USERNAME, and MAVEN_UPLOAD_PASSWORD are required')
        }
        String target = providers.environmentVariable('MAVEN_UPLOAD_URL').get()
        if (target.startsWith('file:')) {
            throw new GradleException('Maven release publication must use a remote repository')
        }
    }
}

tasks.withType(PublishToMavenRepository).configureEach {
	dependsOn tasks.named('validateMavenReleaseCredentials')
	dependsOn tasks.named('verifyMavenCoordinates')
    if (preparedReleaseDir.isPresent()) {
        dependsOn tasks.named('verifyPreparedReleaseArtifacts')
    } else {
        dependsOn tasks.named('verifyReleaseArtifacts')
    }
}

tasks.named('check') {
	dependsOn tasks.named('verifyMavenCoordinates')
	dependsOn tasks.named('verifyDocumentationParity')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
