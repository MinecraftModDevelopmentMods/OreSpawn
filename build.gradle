buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '3.+', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = mod_version
group = mod_group_id
archivesBaseName = "OreSpawn-${minecraft_version}"

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: project.mapping_channel, version: project.mapping_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--nogui'
        }

        surfaceIntegrationFresh {
            workingDirectory project.file("${buildDir}/surface-integration-run")
            property 'forge.logging.console.level', 'info'
            property 'surfaceprobe.integrationPhase', 'fresh'
            args '--nogui'
        }

        surfaceIntegrationReload {
            workingDirectory project.file("${buildDir}/surface-integration-run")
            property 'forge.logging.console.level', 'info'
            property 'surfaceprobe.integrationPhase', 'reload'
            args '--nogui'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// ForgeGradle 3 resolves its 1.12 mapped dependency during configuration. If
// `clean` deletes build/fg_cache in the same invocation, compileJava retains a
// path to a jar that no longer exists. Treat that directory as the target's
// dependency cache; all OreSpawn classes, resources, jars, reports, fixtures,
// worlds, and IDE output are still removed by clean.
clean.setDelete(fileTree(buildDir) {
    exclude 'fg_cache/**'
})

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    testCompile 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testCompile 'org.junit.jupiter:junit-jupiter-params:5.10.2'
    testRuntime 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntime 'org.junit.platform:junit-platform-launcher:1.10.2'
}

task sourcesJar(type: Jar, dependsOn: classes) {
    classifier = 'sources'
    from sourceSets.main.allSource
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    classifier = 'javadoc'
    from javadoc.destinationDir
}

artifacts {
    archives sourcesJar
    archives javadocJar
}

jar {
    manifest {
        attributes([
                'Specification-Title'       : 'OreSpawn',
                'Specification-Vendor'      : 'SkyBlade1978',
                'Specification-Version'     : '1',
                'Implementation-Title'      : project.name,
                'Implementation-Version'    : version,
                'Implementation-Vendor'     : 'SkyBlade1978',
                'Implementation-Timestamp'  : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'OreSpawn-API-Version'       : '1',
                // Forge 1.12 discovers mod access transformers only through
                // this manifest attribute. The development configuration
                // above is not consulted when a packaged jar is loaded.
                'FMLAT'                      : 'accesstransformer.cfg'
        ])
    }
    finalizedBy 'reobfJar'
}

task verifyPublishedJarRuntimeContract(dependsOn: 'reobfJar') {
    group = 'verification'
    description = 'Verifies the reobfuscated jar advertises and contains its Forge 1.12 access transformer.'
    doLast {
        java.util.jar.JarFile published = new java.util.jar.JarFile(jar.archivePath)
        try {
            String declared = published.manifest.mainAttributes.getValue('FMLAT')
            if (declared != 'accesstransformer.cfg') {
                throw new GradleException("Published jar has invalid FMLAT manifest entry: ${declared}")
            }
            java.util.jar.JarEntry transformer = published.getJarEntry('META-INF/accesstransformer.cfg')
            if (transformer == null) {
                throw new GradleException('Published jar is missing META-INF/accesstransformer.cfg')
            }
            String rules = published.getInputStream(transformer).getText('UTF-8')
            [
                    'public-f net.minecraft.world.WorldProvider field_76578_c',
                    'public-f net.minecraft.world.gen.ChunkGeneratorOverworld field_186001_t'
            ].each { String required ->
                if (!rules.readLines().any { String line -> line.trim().startsWith(required) }) {
                    throw new GradleException("Published access transformer is missing rule: ${required}")
                }
            }
        } finally {
            published.close()
        }
    }
}

check.dependsOn verifyPublishedJarRuntimeContract

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', minecraft_version
    inputs.property 'forge_version_range', forge_version_range
    inputs.property 'loader_version_range', loader_version_range
    inputs.property 'minecraft_version_range', minecraft_version_range

    filesMatching('mcmod.info') {
        expand([
                version: project.version,
                mcversion: minecraft_version
        ])
    }
    from('docs/AGENTS.md') {
        into ''
        rename { 'AGENTS.md' }
    }
    from('docs') {
        into 'META-INF/orespawn/docs'
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
            artifact sourcesJar
            artifact javadocJar
        }
    }
    repositories {
        maven { url "file:///${project.projectDir}/mcmodsrepo" }
    }
}

tasks.withType(JavaCompile) {
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '1000']
}

javadoc {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

test {
    useJUnitPlatform()
    // The parity test opens each published engine in its own URLClassLoader.
    // Keeping these jars out of Gradle configurations also keeps Forge's
    // ordinary Eclipse launch from discovering two Mineralogy mods.
    systemProperty 'orespawn.mineralogy110Oracle',
            file('../migration-fixtures/sources/artifacts/Mineralogy-1.10.2-3.3.8.26.jar').absolutePath
    systemProperty 'orespawn.mineralogy112Oracle',
            file('../migration-fixtures/sources/artifacts/Mineralogy-1.12.2-3.8.0.53.jar').absolutePath
}

// Runtime processes are not green merely because they exit with code zero.
// Forge 14 can log a fatal worldgen/callback error and still shut down cleanly.
def acceptedForge14LogNoise = [
        ~/Apache Maven library folder was not in the format expected/,
        ~/\[FML\]: Full: .*maven-artifact-/,
        ~/\[FML\]: Trimmed: .*maven-artifact/,
        ~/FML appears to be missing any signature data/,
        ~/Unable to read a class file correctly/,
        ~/There was a problem reading the entry (?:META-INF\/versions\/9\/)?module-info\.class .*probably a corrupt zip/
]

def assertRuntimeLogsClean = { File runDirectory, String context ->
    File crashDirectory = new File(runDirectory, 'crash-reports')
    if (crashDirectory.isDirectory()) {
        def crashes = fileTree(crashDirectory) { include '**/*' }.files.findAll { it.isFile() }
        if (!crashes.isEmpty()) {
            throw new GradleException("${context} produced crash report ${crashes.first()}")
        }
    }

    File logsDirectory = new File(runDirectory, 'logs')
    def failures = []
    def runtimeLogs = [] as Set
    if (logsDirectory.isDirectory()) {
        runtimeLogs.addAll(fileTree(logsDirectory) {
            include '**/*.log'
            include '**/*.txt'
        }.files)
    }
    runtimeLogs.addAll(fileTree(runDirectory) {
        include '*-console.txt'
    }.files)
    runtimeLogs.each { File log ->
        int lineNumber = 0
        log.eachLine('UTF-8') { String line ->
            lineNumber++
            boolean unexpectedSeverity = (line ==~ /.*\/(?:ERROR|FATAL)\].*/
                    || line ==~ /.*\s(?:ERROR|FATAL)\s.*/)
            boolean knownNoise = acceptedForge14LogNoise.any { line =~ it }
            boolean oreSpawnCascadingLoad = (line.contains('cascading worldgen lag')
                    && line.contains('OreSpawn loaded a new chunk'))
            boolean fatalText = (line.contains('Encountered an unexpected exception')
                    || line.contains('Exception stopping the server')
                    || line.contains('Migration audit failed')
                    || line.contains('java.lang.Error:')
                    || line.contains('IllegalAccessError')
                    || line.contains('NoSuchFieldError')
                    || line.contains('LinkageError')
                    || line.contains('NoSuchMethodError')
                    || line.contains('NoClassDefFoundError')
                    || line.contains('ExceptionInInitializerError')
                    || line.contains('Tried to assign a mutable BlockPos')
                    || oreSpawnCascadingLoad)
            if ((unexpectedSeverity && !knownNoise) || fatalText) {
                failures.add("${log.name}:${lineNumber}: ${line}")
            }
        }
    }
    if (!failures.isEmpty()) {
        throw new GradleException("${context} logged unexpected errors:\n"
                + failures.take(20).join('\n'))
    }
}

task runtimeLogScannerTest {
    group = 'verification'
    description = 'Proves runtime log validation accepts documented Forge noise and rejects real failures.'
    doLast {
        File probe = file("${buildDir}/runtime-log-scanner-test")
        delete probe
        File logs = new File(probe, 'logs'); logs.mkdirs()
        new File(logs, 'latest.log').setText(
                '[main/ERROR] [FML]: FML appears to be missing any signature data. This is not a good thing\n'
                + '[Server thread/INFO] [FML]: Done\n', 'UTF-8')
        assertRuntimeLogsClean(probe, 'scanner-accepted-noise-probe')
        new File(logs, 'latest.log').setText(
                '[Server thread/WARN]: Tried to assign a mutable BlockPos to tick data...\n', 'UTF-8')
        boolean rejected = false
        try { assertRuntimeLogsClean(probe, 'scanner-rejection-probe') }
        catch (GradleException expected) { rejected = true }
        if (!rejected) throw new GradleException('Runtime log scanner accepted a mutable BlockPos leak')
        new File(logs, 'latest.log').setText(
                '[Server thread/ERROR] [example]: Unexpected fixture failure\n', 'UTF-8')
        rejected = false
        try { assertRuntimeLogsClean(probe, 'scanner-error-severity-probe') }
        catch (GradleException expected) { rejected = true }
        if (!rejected) throw new GradleException('Runtime log scanner accepted an unexpected ERROR line')
        new File(probe, 'packaged-forge-fresh-console.txt').setText(
                '[Server thread/ERROR] [FML]: java.lang.IllegalAccessError: tried to access field net.minecraft.world.WorldProvider.field_76578_c\n',
                'UTF-8')
        rejected = false
        try { assertRuntimeLogsClean(probe, 'scanner-packaged-console-probe') }
        catch (GradleException expected) { rejected = true }
        if (!rejected) throw new GradleException('Runtime log scanner ignored a packaged-launch IllegalAccessError')
        delete probe
    }
}

check.dependsOn runtimeLogScannerTest

def surfaceIntegrationClasses = file("${buildDir}/surface-integration-fixture/classes")
task compileSurfaceIntegrationTestMod(type: JavaCompile, dependsOn: classes) {
    source fileTree('src/biomeIntegrationTest/java')
    classpath = files(sourceSets.main.output, sourceSets.main.compileClasspath)
    destinationDir = surfaceIntegrationClasses
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
}

task surfaceIntegrationTestModJar(type: Jar, dependsOn: compileSurfaceIntegrationTestMod) {
    archiveName = 'surfaceprobe.jar'
    destinationDir = file("${buildDir}/surface-integration-fixture")
    from surfaceIntegrationClasses
    from 'src/biomeIntegrationTest/resources'
}

// Keep the mapped development fixture separate from the copy transformed for
// a real packaged Forge runtime.
task packagedSurfaceIntegrationTestModJar(type: Jar, dependsOn: compileSurfaceIntegrationTestMod) {
    archiveName = 'surfaceprobe-packaged.jar'
    destinationDir = file("${buildDir}/surface-integration-fixture")
    from surfaceIntegrationClasses
    from 'src/biomeIntegrationTest/resources'
}

reobf {
    packagedSurfaceIntegrationTestModJar {}
}

def surfaceIntegrationRunDirectory = file("${buildDir}/surface-integration-run")
def surfaceIntegrationMainOutput = file("${buildDir}/surface-integration-fixture/orespawn-main")
task prepareSurfaceIntegrationTest(dependsOn: surfaceIntegrationTestModJar) {
    doLast {
        delete surfaceIntegrationRunDirectory
        delete surfaceIntegrationMainOutput
        surfaceIntegrationRunDirectory.mkdirs()
        copy {
            from sourceSets.main.output
            into surfaceIntegrationMainOutput
        }
        copy {
            from surfaceIntegrationTestModJar.archivePath
            into new File(surfaceIntegrationRunDirectory, 'mods')
        }
        new File(surfaceIntegrationRunDirectory, 'server.properties').setText('''\
level-name=surface-integration-world
level-seed=zsjpxah
level-type=default
online-mode=false
allow-nether=true
generate-structures=false
spawn-protection=0
max-tick-time=-1
''', 'UTF-8')
        new File(surfaceIntegrationRunDirectory, 'eula.txt').setText('eula=true\n', 'UTF-8')
    }
}

def legacyDevRuntime = fileTree(new File(gradle.gradleUserHomeDir,
        'caches/modules-2/files-2.1/net.minecraftforge/legacydev/0.2.3.1')) {
    include '**/legacydev-*-fatjar.jar'
}

// ForgeGradle 3 initially exposes mergetool's three-side compile stub on a
// completely clean 1.12 build. Its synthetic BUKKIT enum value is not valid in
// the Forge 14 runtime and makes FML's own channel registration fail. Keep the
// mapped runtime intact but restore Forge's native two-side Side class in a
// build-only copy used by integration processes. Nothing from this copy is
// packaged in OreSpawn's published artifacts.
def forge14MappedRuntime = {
    File runtime = sourceSets.main.runtimeClasspath.files.find { File candidate ->
        candidate.name.startsWith("forge-${minecraft_version}-${forge_version}_mapped_") &&
                candidate.name.endsWith('.jar')
    }
    if (runtime == null) {
        throw new GradleException('Could not locate the mapped Forge 14 runtime')
    }
    runtime
}

def forge14UniversalRuntime = {
    File runtime = new File(gradle.gradleUserHomeDir,
            "caches/forge_gradle/maven_downloader/net/minecraftforge/forge/" +
            "${minecraft_version}-${forge_version}/" +
            "forge-${minecraft_version}-${forge_version}-universal.jar")
    if (!runtime.isFile()) {
        throw new GradleException("Forge 14 universal runtime is missing: ${runtime}")
    }
    runtime
}

task forge14RuntimeJar(type: Jar, dependsOn: classes) {
    archiveName = 'forge14-runtime.jar'
    destinationDir = file("${buildDir}/forge14-runtime")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ zipTree(forge14MappedRuntime()) }) {
        exclude 'net/minecraftforge/fml/relauncher/Side.class'
    }
    from({ zipTree(forge14UniversalRuntime()) }) {
        include 'net/minecraftforge/fml/relauncher/Side.class'
    }
}

def useForge14Runtime = { JavaExec process ->
    process.dependsOn forge14RuntimeJar
    process.doFirst {
        File generated = forge14MappedRuntime()
        def runtime = sourceSets.main.runtimeClasspath.files.findAll { File candidate ->
            candidate != generated
        }
        process.classpath = files(forge14RuntimeJar.archivePath, runtime, legacyDevRuntime)
    }
}

// ForgeGradle's ordinary client/server tasks expose the same synthetic
// three-side compile jar as the integration tasks. Route every development
// launch through the corrected runtime copy so command-line and Eclipse
// testing exercise Forge's native CLIENT/SERVER Side enum.
tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.all { JavaExec process ->
    useForge14Runtime(process)
}

def createSurfaceProcess = { String phase, Object dependency ->
    task("surfaceIntegration${phase}Process", type: JavaExec,
            dependsOn: [dependency, 'createSrgToMcp']) {
        group = 'verification'
        main = 'net.minecraftforge.legacydev.MainServer'
        classpath = files(sourceSets.main.runtimeClasspath, legacyDevRuntime)
        workingDir surfaceIntegrationRunDirectory
        environment 'mainClass', 'net.minecraft.launchwrapper.Launch'
        environment 'MCP_TO_SRG', file("${buildDir}/createSrgToMcp/output.srg").absolutePath
        environment 'MOD_CLASSES', surfaceIntegrationMainOutput.absolutePath
        environment 'tweakClass', 'net.minecraftforge.fml.common.launcher.FMLServerTweaker'
        systemProperty 'forge.logging.console.level', 'info'
        systemProperty 'surfaceprobe.integrationPhase', phase.toLowerCase()
        args '--nogui'
    }
}

def surfaceIntegrationFreshProcess = createSurfaceProcess('Fresh', prepareSurfaceIntegrationTest)
useForge14Runtime(surfaceIntegrationFreshProcess)
surfaceIntegrationFreshProcess.doLast {
    File marker = new File(surfaceIntegrationRunDirectory,
            'surface-integration-world/surfaceprobe-integration.properties')
    if (!marker.isFile()) {
        throw new GradleException("Fresh surface integration completion marker is missing: ${marker}")
    }
    assertRuntimeLogsClean(surfaceIntegrationRunDirectory, 'surface integration fresh phase')
}
def surfaceIntegrationReloadProcess = createSurfaceProcess('Reload', surfaceIntegrationFreshProcess)
useForge14Runtime(surfaceIntegrationReloadProcess)
surfaceIntegrationReloadProcess.doLast {
    assertRuntimeLogsClean(surfaceIntegrationRunDirectory, 'surface integration reload phase')
}

task surfaceIntegrationTest(dependsOn: surfaceIntegrationReloadProcess) {
    group = 'verification'
    doLast {
        File marker = new File(surfaceIntegrationRunDirectory,
                'surface-integration-world/surfaceprobe-integration.properties')
        Properties result = new Properties()
        marker.withInputStream { result.load(it) }
        if (result.getProperty('reload_verified') != 'true') {
            throw new GradleException("Surface integration reload was not verified: ${marker}")
        }
        logger.lifecycle('Provider surfaces and exact-biome geology verified: {} dimensions, {} columns each, fresh + reload',
                result.getProperty('dimensions'), result.getProperty('columns_per_dimension'))
    }
}

check.dependsOn surfaceIntegrationTest

// Release qualification must also exercise the reobfuscated jar through
// Forge's real packaged-mod discovery. Supply the official 1.12.2 dedicated
// server jar and an exact Forge 14 library root; no development output or
// mapped Forge jar is placed on this process's classpath.
def packagedForgeRunDirectory = file("${buildDir}/packaged-forge-runtime-run")
def packagedMinecraftServer = {
    if (!project.hasProperty('packagedMinecraftServerJar')) {
        throw new GradleException('packagedMinecraftServerJar is required for packagedForgeRuntimeTest')
    }
    File server = file(project.property('packagedMinecraftServerJar'))
    if (!server.isFile()) {
        throw new GradleException("Minecraft 1.12.2 server jar is missing: ${server}")
    }
    server
}
def packagedForgeLibraries = {
    if (!project.hasProperty('packagedForgeLibrariesRoot')) {
        throw new GradleException('packagedForgeLibrariesRoot is required for packagedForgeRuntimeTest')
    }
    File libraries = file(project.property('packagedForgeLibrariesRoot'))
    if (!libraries.isDirectory()) {
        throw new GradleException("Forge 14 library root is missing: ${libraries}")
    }
    libraries
}
def packagedForgeRuntimeLayout = {
    File forge = forge14UniversalRuntime()
    File server = packagedMinecraftServer()
    File libraries = packagedForgeLibraries()
    java.util.jar.JarFile runtime = new java.util.jar.JarFile(forge)
    String declared
    try {
        declared = runtime.manifest.mainAttributes.getValue('Class-Path')
    } finally {
        runtime.close()
    }
    if (declared == null || declared.trim().isEmpty()) {
        throw new GradleException("Forge 14 runtime has no Class-Path manifest entry: ${forge}")
    }
    def dependencies = declared.trim().split(/\s+/).findAll { String entry ->
        entry != "minecraft_server.${minecraft_version}.jar"
    }.collect { String entry ->
        String relative = entry.startsWith('libraries/') ? entry.substring('libraries/'.length()) : entry
        File dependency = new File(libraries, relative)
        if (!dependency.isFile()) {
            throw new GradleException("Forge 14 packaged-runtime dependency is missing: ${dependency}")
        }
        [source: dependency, relative: relative]
    }
    [forge: forge, server: server, dependencies: dependencies]
}

task preparePackagedForgeRuntimeTest(dependsOn: [verifyPublishedJarRuntimeContract,
                                                 'reobfPackagedSurfaceIntegrationTestModJar']) {
    group = 'verification'
    doLast {
        delete packagedForgeRunDirectory
        def runtime = packagedForgeRuntimeLayout()
        copy { from runtime.forge; into packagedForgeRunDirectory }
        copy {
            from runtime.server
            into packagedForgeRunDirectory
            rename { "minecraft_server.${minecraft_version}.jar" }
        }
        runtime.dependencies.each { Map dependency ->
            File destination = new File(packagedForgeRunDirectory,
                    "libraries/${dependency.relative}").parentFile
            copy { from dependency.source; into destination }
        }
        File mods = new File(packagedForgeRunDirectory, 'mods')
        mods.mkdirs()
        copy { from jar.archivePath; into mods }
        copy { from packagedSurfaceIntegrationTestModJar.archivePath; into mods }
        new File(packagedForgeRunDirectory, 'server.properties').setText('''\
level-name=surface-integration-world
level-seed=zsjpxah
level-type=default
online-mode=false
allow-nether=true
generate-structures=false
spawn-protection=0
max-tick-time=-1
''', 'UTF-8')
        new File(packagedForgeRunDirectory, 'eula.txt').setText('eula=true\n', 'UTF-8')
    }
}

def createPackagedForgeProcess = { String phase, Object dependency ->
    ByteArrayOutputStream console = new ByteArrayOutputStream()
    File consoleFile = new File(packagedForgeRunDirectory,
            "packaged-forge-${phase.toLowerCase()}-console.txt")
    task("packagedForgeRuntime${phase}Process", type: Exec, dependsOn: dependency) {
        group = 'verification'
        workingDir packagedForgeRunDirectory
        doFirst {
            console.reset()
            File javaExecutable = new File(System.getProperty('java.home'),
                    "bin/java${System.properties['os.name'].toLowerCase().contains('windows') ? '.exe' : ''}")
            File forge = new File(packagedForgeRunDirectory, forge14UniversalRuntime().name)
            commandLine javaExecutable,
                    '-Dforge.logging.console.level=info',
                    "-Dsurfaceprobe.integrationPhase=${phase.toLowerCase()}",
                    '-jar', forge, 'nogui'
            standardOutput = console
            errorOutput = console
        }
        doLast {
            consoleFile.setText(console.toString('UTF-8'), 'UTF-8')
        }
    }
}

def packagedForgeFreshProcess = createPackagedForgeProcess('Fresh', preparePackagedForgeRuntimeTest)
packagedForgeFreshProcess.doLast {
    File marker = new File(packagedForgeRunDirectory,
            'surface-integration-world/surfaceprobe-integration.properties')
    if (!marker.isFile()) {
        throw new GradleException("Packaged Forge fresh marker is missing: ${marker}")
    }
    assertRuntimeLogsClean(packagedForgeRunDirectory, 'packaged Forge fresh phase')
}
def packagedForgeReloadProcess = createPackagedForgeProcess('Reload', packagedForgeFreshProcess)
packagedForgeReloadProcess.doLast {
    assertRuntimeLogsClean(packagedForgeRunDirectory, 'packaged Forge reload phase')
}

task packagedForgeRuntimeTest(dependsOn: packagedForgeReloadProcess) {
    group = 'verification'
    description = 'Creates and reloads a world using the reobfuscated OreSpawn jar under the real Forge 14 launcher.'
    doLast {
        File marker = new File(packagedForgeRunDirectory,
                'surface-integration-world/surfaceprobe-integration.properties')
        Properties result = new Properties()
        marker.withInputStream { result.load(it) }
        if (result.getProperty('reload_verified') != 'true') {
            throw new GradleException("Packaged Forge reload was not verified: ${marker}")
        }
        logger.lifecycle('Packaged Forge jar created and reloaded {} dimensions with {} audited columns each',
                result.getProperty('dimensions'), result.getProperty('columns_per_dimension'))
    }
}

// The packaged launcher needs two machine-local inputs that cannot be checked
// into the repository. When callers supply them, make the real-runtime gate a
// mandatory part of check; otherwise the focused jar-contract verification
// still protects the manifest and embedded access-transformer contract.
if (project.hasProperty('packagedMinecraftServerJar')
        && project.hasProperty('packagedForgeLibrariesRoot')) {
    check.dependsOn packagedForgeRuntimeTest
}

def migrationIntegrationClasses = file("${buildDir}/migration-integration-fixture/classes")
task compileMigrationIntegrationTestMod(type: JavaCompile, dependsOn: classes) {
    source fileTree('src/migrationIntegrationTest/java')
    classpath = files(sourceSets.main.output, sourceSets.main.compileClasspath)
    destinationDir = migrationIntegrationClasses
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
}

task migrationIntegrationTestModJar(type: Jar, dependsOn: compileMigrationIntegrationTestMod) {
    archiveName = 'migrationprobe.jar'
    destinationDir = file("${buildDir}/migration-integration-fixture")
    from migrationIntegrationClasses
    from 'src/migrationIntegrationTest/resources'
}

if (project.hasProperty('migrationRunDir')) {
    def migrationRunDirectory = file(project.property('migrationRunDir'))
    def migrationMainOutput = file("${buildDir}/migration-integration-fixture/orespawn-main")
    task prepareMigrationIntegrationRun(dependsOn: migrationIntegrationTestModJar) {
        doLast {
            delete migrationMainOutput
            migrationMainOutput.mkdirs()
            copy { from sourceSets.main.output; into migrationMainOutput }
            copy { from migrationIntegrationTestModJar.archivePath; into new File(migrationRunDirectory, 'mods') }
            new File(migrationRunDirectory, 'eula.txt').setText('eula=true\n', 'UTF-8')
        }
    }
    task migrationIntegrationProcess(type: JavaExec,
            dependsOn: [prepareMigrationIntegrationRun, 'createSrgToMcp']) {
        group = 'verification'
        main = 'net.minecraftforge.legacydev.MainServer'
        classpath = files(sourceSets.main.runtimeClasspath, legacyDevRuntime)
        workingDir migrationRunDirectory
        environment 'mainClass', 'net.minecraft.launchwrapper.Launch'
        environment 'MCP_TO_SRG', file("${buildDir}/createSrgToMcp/output.srg").absolutePath
        environment 'MOD_CLASSES', migrationMainOutput.absolutePath
        environment 'tweakClass', 'net.minecraftforge.fml.common.launcher.FMLServerTweaker'
        systemProperty 'forge.logging.console.level', 'info'
        systemProperty 'orespawn.migrationFamily', project.findProperty('migrationFamily') ?: 'unspecified'
        systemProperty 'orespawn.migrationPhase', project.findProperty('migrationPhase') ?: 'fresh'
        if ((project.findProperty('migrationAllowMissingMappings') ?: 'false') == 'true') {
            systemProperty 'fml.queryResult', 'confirm'
        }
        args '--nogui'
		doLast {
			def phase = project.findProperty('migrationPhase') ?: 'fresh'
			def marker = new File(migrationRunDirectory,
					'world/orespawn4-migration-probe.properties')
			if (!marker.isFile()) {
				throw new GradleException("Migration probe did not produce ${marker}")
			}
			def values = new Properties()
			marker.withInputStream { values.load(it) }
			if (values.getProperty("${phase}_complete") != 'true') {
				throw new GradleException("Migration ${phase} phase did not complete: ${marker}")
			}
			def latest = new File(migrationRunDirectory, 'logs/latest.log')
			assertRuntimeLogsClean(migrationRunDirectory, "migration ${phase} phase")
			if (latest.isFile()
					&& (project.findProperty('migrationAllowMissingMappings') ?: 'false') == 'true') {
				def protectedMissing = latest.text =~ /(?m)^(?:Missing (?:basemetals|orespawn):|\s+(?:basemetals|mmdlib|orespawn):)/
				if (protectedMissing.find()) {
					throw new GradleException("Protected Base Metals/OreSpawn mapping is missing: ${protectedMissing.group()}")
				}
			}
		}
    }
    useForge14Runtime(migrationIntegrationProcess)
}

// Two sealed existing-world upgrades exercise the distinct Mineralogy configs
// that can reach Forge 1.12: a carried 1.10 file and the native 1.12 file.
def legacyMineralogyArchive = file("${rootDir}/../migration-fixtures/sources/worlds/os3-331-default-source.zip")
def legacyMineralogyJar = file("${rootDir}/../migration-fixtures/sources/artifacts/Mineralogy-1.12.2-3.8.0.53.jar")
def legacyMineralogyGates = []
[
        '110': [version: '3.3.8.26', config: '''\
world-gen {
    I:GEOME_SIZE=144
    B:REALISTIC_COAL_LAYERS=true
    S:ROCK_LAYER_NOISE=41.5
    I:ROCK_LAYER_THICKNESS=11
}
'''],
        '112': [version: '3.8.0.53', config: '''\
world-gen {
    B:PLACE_MINERALOGY_ROCK=false
    I:GEOME_SIZE=128
    S:ROCK_LAYER_NOISE=37.25
    I:ROCK_LAYER_THICKNESS=9
}
''']
].each { String lineage, Map fixture ->
    String label = lineage == '110' ? '110' : '112'
    File runDirectory = file("${buildDir}/legacy-mineralogy-${lineage}-run")
    File mainOutput = file("${buildDir}/legacy-mineralogy-${lineage}-fixture/orespawn-main")
    def prepareTask = task("prepareLegacyMineralogy${label}Run",
            dependsOn: migrationIntegrationTestModJar) {
        doLast {
            if (!legacyMineralogyArchive.isFile() || !legacyMineralogyJar.isFile()) {
                throw new GradleException('Sealed legacy Mineralogy fixtures are missing')
            }
            delete runDirectory
            delete mainOutput
            copy { from zipTree(legacyMineralogyArchive); into runDirectory }
            mainOutput.mkdirs()
            copy { from sourceSets.main.output; into mainOutput }
            File mods = new File(runDirectory, 'mods'); mods.mkdirs()
            copy { from migrationIntegrationTestModJar.archivePath; from legacyMineralogyJar; into mods }
            File config = new File(runDirectory, 'config/mineralogy.cfg')
            config.parentFile.mkdirs(); config.setText(fixture.config as String, 'UTF-8')
            new File(runDirectory, 'eula.txt').setText('eula=true\n', 'UTF-8')
            project.javaexec {
                main = 'zone.moddev.mc.orespawn.migrationtest.LegacyMineralogyMetadataFixture'
                classpath = files(migrationIntegrationClasses, sourceSets.main.runtimeClasspath)
                args new File(runDirectory, 'world').absolutePath, fixture.version
            }
        }
    }

    def createLegacyMineralogyProcess = { String phase, Object dependency ->
        def process = task("legacyMineralogy${label}${phase.capitalize()}", type: JavaExec,
                dependsOn: [dependency, 'createSrgToMcp']) {
            group = 'verification'
            main = 'net.minecraftforge.legacydev.MainServer'
            classpath = files(sourceSets.main.runtimeClasspath, legacyDevRuntime)
            workingDir runDirectory
            environment 'mainClass', 'net.minecraft.launchwrapper.Launch'
            environment 'MCP_TO_SRG', file("${buildDir}/createSrgToMcp/output.srg").absolutePath
            environment 'MOD_CLASSES', mainOutput.absolutePath
            environment 'tweakClass', 'net.minecraftforge.fml.common.launcher.FMLServerTweaker'
            systemProperty 'forge.logging.console.level', 'info'
            systemProperty 'orespawn.migrationFamily', "legacy-mineralogy-${lineage}"
            systemProperty 'orespawn.migrationPhase', phase
            args '--nogui'
            doLast {
                File marker = new File(runDirectory, 'world/orespawn4-migration-probe.properties')
                if (!marker.isFile()) {
                    throw new GradleException("Legacy Mineralogy ${lineage} ${phase} marker is missing")
                }
                Properties values = new Properties(); marker.withInputStream { values.load(it) }
                if (values.getProperty("${phase}_complete") != 'true') {
                    throw new GradleException("Legacy Mineralogy ${lineage} ${phase} did not complete")
                }
                assertRuntimeLogsClean(runDirectory, "legacy Mineralogy ${lineage} ${phase} phase")
            }
        }
        useForge14Runtime(process)
        process
    }

    def freshTask = createLegacyMineralogyProcess('fresh', prepareTask)
    def reloadTask = createLegacyMineralogyProcess('reload', freshTask)
    def gate = task("legacyMineralogy${label}MigrationTest", dependsOn: reloadTask) {
        group = 'verification'
        description = "Proves Mineralogy ${lineage} settings remain exact across an OreSpawn 4 upgrade and reload."
    }
    legacyMineralogyGates.add(gate)
}

check.dependsOn legacyMineralogyGates

