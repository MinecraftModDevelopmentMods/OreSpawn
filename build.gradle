plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "OreSpawn-${minecraft_version}"
}

// Mojang ships Java 21 to end users in 1.20.5+, so OreSpawn targets Java 21.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    withJavadocJar()
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://github.com/ParchmentMC/Parchment/wiki/Getting-Started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // Official mappings are used at runtime in Forge 52, so no reobfuscation
    // task is needed.
    reobf = false

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id

            mods {
                orespawn {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
            if (providers.gradleProperty('orespawnBenchmarkMode').isPresent()) {
                property 'orespawn.worldgenBenchmarkMode', providers.gradleProperty('orespawnBenchmarkMode').get()
                property 'orespawn.worldgenBenchmarkRadius',
                        providers.gradleProperty('orespawnBenchmarkRadius').getOrElse('8')
                property 'orespawn.worldgenBenchmarkRepetitions',
                        providers.gradleProperty('orespawnBenchmarkRepetitions').getOrElse('5')
                property 'orespawn.worldgenBenchmarkVanillaOres',
                        providers.gradleProperty('orespawnBenchmarkVanillaOres').getOrElse('false')
                property 'orespawn.worldgenBenchmarkOreAudit',
                        providers.gradleProperty('orespawnBenchmarkOreAudit').getOrElse('false')
                property 'orespawn.worldgenBenchmarkFluidAudit',
                        providers.gradleProperty('orespawnBenchmarkFluidAudit').getOrElse('false')
                if (providers.gradleProperty('orespawnBenchmarkBiomeAudit').isPresent()) {
                    property 'orespawn.worldgenBenchmarkBiomeAudit',
                            providers.gradleProperty('orespawnBenchmarkBiomeAudit').get()
                }
                if (providers.gradleProperty('orespawnBenchmarkBlockAudit').isPresent()) {
                    property 'orespawn.worldgenBenchmarkBlockAudit',
                            providers.gradleProperty('orespawnBenchmarkBlockAudit').get()
                }
                property 'orespawn.worldgenBenchmarkCenterX',
                        providers.gradleProperty('orespawnBenchmarkCenterX').getOrElse('1024')
                property 'orespawn.worldgenBenchmarkCenterZ',
                        providers.gradleProperty('orespawnBenchmarkCenterZ').getOrElse('1024')
                property 'orespawn.worldgenBenchmarkCenterStep',
                        providers.gradleProperty('orespawnBenchmarkCenterStep').getOrElse('64')
                property 'orespawn.worldgenBenchmarkDimension',
                        providers.gradleProperty('orespawnBenchmarkDimension').getOrElse('overworld')
                if (providers.gradleProperty('orespawnBenchmarkBiomeType').isPresent()) {
                    property 'orespawn.worldgenBenchmarkBiomeType',
                            providers.gradleProperty('orespawnBenchmarkBiomeType').get()
                }
                property 'orespawn.worldgenBenchmarkStopServer', 'true'
                if (providers.gradleProperty('worldgenJfrFile').isPresent()) {
                    jvmArg "-XX:StartFlightRecording=filename=${providers.gradleProperty('worldgenJfrFile').get()},settings=profile,dumponexit=true"
                }
            }
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
            if (providers.gradleProperty('orespawnBenchmarkMode').isPresent()) {
                property 'orespawn.worldgenBenchmarkMode', providers.gradleProperty('orespawnBenchmarkMode').get()
                property 'orespawn.worldgenBenchmarkRadius',
                        providers.gradleProperty('orespawnBenchmarkRadius').getOrElse('4')
                property 'orespawn.worldgenBenchmarkRepetitions',
                        providers.gradleProperty('orespawnBenchmarkRepetitions').getOrElse('3')
                property 'orespawn.worldgenBenchmarkVanillaOres',
                        providers.gradleProperty('orespawnBenchmarkVanillaOres').getOrElse('false')
                property 'orespawn.worldgenBenchmarkOreAudit',
                        providers.gradleProperty('orespawnBenchmarkOreAudit').getOrElse('false')
                property 'orespawn.worldgenBenchmarkFluidAudit',
                        providers.gradleProperty('orespawnBenchmarkFluidAudit').getOrElse('false')
                if (providers.gradleProperty('orespawnBenchmarkBiomeAudit').isPresent()) {
                    property 'orespawn.worldgenBenchmarkBiomeAudit',
                            providers.gradleProperty('orespawnBenchmarkBiomeAudit').get()
                }
                if (providers.gradleProperty('orespawnBenchmarkBlockAudit').isPresent()) {
                    property 'orespawn.worldgenBenchmarkBlockAudit',
                            providers.gradleProperty('orespawnBenchmarkBlockAudit').get()
                }
                property 'orespawn.worldgenBenchmarkCenterX',
                        providers.gradleProperty('orespawnBenchmarkCenterX').getOrElse('256')
                property 'orespawn.worldgenBenchmarkCenterZ',
                        providers.gradleProperty('orespawnBenchmarkCenterZ').getOrElse('256')
                property 'orespawn.worldgenBenchmarkCenterStep',
                        providers.gradleProperty('orespawnBenchmarkCenterStep').getOrElse('64')
                property 'orespawn.worldgenBenchmarkDimension',
                        providers.gradleProperty('orespawnBenchmarkDimension').getOrElse('overworld')
                if (providers.gradleProperty('orespawnBenchmarkBiomeType').isPresent()) {
                    property 'orespawn.worldgenBenchmarkBiomeType',
                            providers.gradleProperty('orespawnBenchmarkBiomeType').get()
                }
                property 'orespawn.worldgenBenchmarkStopServer', 'true'
                if (providers.gradleProperty('worldgenJfrFile').isPresent()) {
                    jvmArg "-XX:StartFlightRecording=filename=${providers.gradleProperty('worldgenJfrFile').get()},settings=profile,dumponexit=true"
                }
            }
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }

        ['Fresh', 'Reload'].each { String phase ->
            create("surfaceIntegration${phase}") {
                parent runs.server
                workingDirectory layout.buildDirectory.dir('surface-integration-run').get().asFile
                property 'forge.logging.console.level', 'info'
                property 'surfaceprobe.integrationPhase', phase.toLowerCase(Locale.ROOT)
                args '--nogui'
            }
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you

    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so:
    // flatDir {
    //     dir 'libs'
    // }
}

dependencies {
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'

    // Real mod deobf dependency examples - these get remapped to your current mappings
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}:${jei_version}:api") // Adds JEI API as a compile dependency
    // runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}:${jei_version}") // Adds the full JEI mod as a runtime dependency
    // implementation fg.deobf("com.tterrag.registrate:Registrate:MC${mc_version}-${registrate_version}") // Adds registrate as a dependency

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : 'OreSpawn',
                'Specification-Vendor'    : 'SkyBlade1978',
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : 'SkyBlade1978',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'OreSpawn-API-Version'  : '1'
        ])
    }

}

tasks.named('processResources', ProcessResources).configure {
    from('docs/AGENTS.md') {
        into ''
        rename { 'AGENTS.md' }
    }
    from('docs') {
        into 'META-INF/orespawn/docs'
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
            artifact sourcesJar
            artifact javadocJar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// Forge 52 expects classes and resources in a single module output directory.
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

tasks.named('javadoc', Javadoc).configure {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

def surfaceIntegrationClasses = layout.buildDirectory.dir('surface-integration-fixture/classes')
def compileSurfaceIntegrationTestMod = tasks.register('compileSurfaceIntegrationTestMod', JavaCompile) {
    dependsOn tasks.named('classes')
    source fileTree('src/biomeIntegrationTest/java')
    classpath = files(sourceSets.main.output, sourceSets.main.compileClasspath)
    destinationDirectory.set(surfaceIntegrationClasses)
    javaCompiler.set(javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
    })
    options.release = 21
    options.encoding = 'UTF-8'
}

def surfaceIntegrationTestModJar = tasks.register('surfaceIntegrationTestModJar', Jar) {
    dependsOn compileSurfaceIntegrationTestMod
    archiveFileName = 'surfaceprobe.jar'
    destinationDirectory = layout.buildDirectory.dir('surface-integration-fixture')
    from surfaceIntegrationClasses
    from 'src/biomeIntegrationTest/resources'
}

def surfaceIntegrationRunDirectory = layout.buildDirectory.dir('surface-integration-run')
def prepareSurfaceIntegrationTest = tasks.register('prepareSurfaceIntegrationTest') {
    dependsOn surfaceIntegrationTestModJar
    doLast {
        File runDirectory = surfaceIntegrationRunDirectory.get().asFile
        delete runDirectory
        runDirectory.mkdirs()
        copy {
            from surfaceIntegrationTestModJar.flatMap { it.archiveFile }
            into surfaceIntegrationRunDirectory.map { it.dir('mods') }
        }
        new File(runDirectory, 'server.properties').setText('''\
level-name=surface-integration-world
level-seed=0
level-type=minecraft:normal
online-mode=false
allow-nether=true
generate-structures=false
spawn-protection=0
max-tick-time=-1
''', 'UTF-8')
        new File(runDirectory, 'eula.txt').setText('eula=true\n', 'UTF-8')
    }
}

tasks.configureEach {
    if (name == 'runSurfaceIntegrationFresh') {
        dependsOn prepareSurfaceIntegrationTest
    } else if (name == 'runSurfaceIntegrationReload') {
        dependsOn 'runSurfaceIntegrationFresh'
    }
}

def surfaceIntegrationTest = tasks.register('surfaceIntegrationTest') {
    group = 'verification'
    description = 'Verifies provider surfaces and dynamic-biome geology across fresh and reloaded normal terrain.'
    dependsOn 'runSurfaceIntegrationReload'
    doLast {
        File marker = surfaceIntegrationRunDirectory.get().file(
                'surface-integration-world/surfaceprobe-integration.properties').asFile
        if (!marker.isFile()) {
            throw new GradleException("Surface integration completion marker is missing: ${marker}")
        }
        Properties result = new Properties()
        marker.withInputStream { result.load(it) }
        if (result.getProperty('reload_verified') != 'true') {
            throw new GradleException("Surface integration reload was not verified: ${marker}")
        }
        logger.lifecycle('Provider surfaces and dynamic-biome geology verified: {} dimensions, {} columns each, fresh + reload',
                result.getProperty('dimensions'), result.getProperty('columns_per_dimension'))
    }
}

tasks.named('check') {
    dependsOn surfaceIntegrationTest
}

// Keep every Eclipse launch input on one physical Gradle cache. Mixing Buildship's
// cache with a command-line cache duplicates named Java modules such as FML and Mixin.
def syncEclipseRunClasspaths = tasks.register('syncEclipseRunClasspaths') {
    group = 'IDE'
    description = 'Aligns Eclipse project, Buildship, and Forge run classpaths with the active Gradle home.'

    doLast {
        File classpathDir = layout.buildDirectory.dir('classpath').get().asFile
        Set<File> classpathFiles = fileTree(classpathDir) {
            include '*_minecraftClasspath.txt'
        }.files
        // ForgeGradle 6 on Forge 52 places the run dependencies directly on
        // the Eclipse project classpath. Older ForgeGradle versions emitted
        // separate *_minecraftClasspath.txt files, so retain support for them
        // when present without requiring them for 1.21.1 launches.

        File buildshipPreferences = file('.settings/org.eclipse.buildship.core.prefs')
        Properties buildship = new Properties()
        if (buildshipPreferences.isFile()) {
            buildshipPreferences.withInputStream { buildship.load(it) }
        }
        String configuredGradleHome = buildship.getProperty('connection.gradle.user.home', '').trim()
        File eclipseProjectClasspath = file('.classpath')
        File eclipseGradleHome = gradle.gradleUserHomeDir.canonicalFile
        if (!configuredGradleHome || file(configuredGradleHome).canonicalFile != eclipseGradleHome) {
            buildship.setProperty('eclipse.preferences.version', '1')
            buildship.setProperty('connection.gradle.user.home', eclipseGradleHome.absolutePath)
            buildshipPreferences.parentFile.mkdirs()
            buildshipPreferences.withOutputStream {
                buildship.store(it,
                        'Generated by syncEclipseRunClasspaths; keep Eclipse and command-line caches aligned.')
            }
        }
        File eclipseCache = new File(eclipseGradleHome, 'caches').canonicalFile
        File eclipseClasspathDir = file('.settings/orespawn-run-classpaths')
        eclipseClasspathDir.mkdirs()

        Closure<String> mapCacheReferences = { String value ->
            value.replaceAll(/(?i)[A-Z]:[\\\/]\S*?[\\\/]caches(?=[\\\/])/) { String cacheRoot ->
                cacheRoot.contains('/')
                        ? eclipseCache.absolutePath.replace('\\', '/')
                        : eclipseCache.absolutePath
            }
        }

        Map<File, File> stableClasspaths = [:]
        classpathFiles.each { File classpathFile ->
            List<String> original = classpathFile.readLines('UTF-8')
            List<String> synced = original.collect { String entry ->
                String mapped = mapCacheReferences(entry)
                String portable = mapped.replace('\\', '/')
                int marker = portable.indexOf('/caches/')
                if (marker < 0) {
                    return mapped
                }

                File target = file(mapped).canonicalFile
                if (!target.isFile()) {
                    throw new GradleException("Missing Eclipse run dependency in configured Gradle cache: ${target}")
                }
                return target.absolutePath
            }

            File stableClasspath = new File(eclipseClasspathDir, classpathFile.name)
            stableClasspath.setText(synced.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
            stableClasspaths.put(classpathFile.canonicalFile, stableClasspath.canonicalFile)
        }

        int changedProjectClasspath = 0
        int changedResourceExclusions = 0
        if (eclipseProjectClasspath.isFile()) {
            String original = eclipseProjectClasspath.getText('UTF-8')
            def parsedClasspath = new XmlParser(false, false).parseText(original)
            parsedClasspath.classpathentry.each { entry ->
                ['path', 'sourcepath'].each { String attribute ->
                    String value = entry.attribute(attribute)
                    if (!value) {
                        return
                    }
                    String mapped = mapCacheReferences(value)
                    if (mapped == value) {
                        return
                    }
                    File mappedTarget = file(mapped).canonicalFile
                    if (mappedTarget.exists()) {
                        entry.attributes().put(attribute, mappedTarget.absolutePath)
                        changedProjectClasspath = 1
                    } else {
                        // Test-only libraries may have been resolved by command-line Gradle
                        // but not yet by Buildship. They are not part of the Forge launch
                        // module path, so retaining the existing valid path is safe.
                        File existingTarget = file(value).canonicalFile
                        if (!existingTarget.exists()) {
                            throw new GradleException("Missing Eclipse project dependency in both Gradle caches: ${mappedTarget}")
                        }
                    }
                }
            }
            parsedClasspath.classpathentry.findAll { entry ->
                entry.attribute('kind') == 'src' && entry.attribute('path') == 'src/main/resources'
            }.each { entry ->
                List<String> exclusions = (entry.attribute('excluding') ?: '')
                        .split(/\|/)
                        .findAll { !it.isEmpty() }
                ['META-INF/mods.toml', 'pack.mcmeta'].each { String metadataFile ->
                    if (exclusions.remove(metadataFile)) {
                        changedResourceExclusions = 1
                    }
                }
                if (exclusions.isEmpty()) {
                    entry.attributes().remove('excluding')
                } else {
                    entry.attributes().put('excluding', exclusions.join('|'))
                }
            }
            if (changedProjectClasspath || changedResourceExclusions) {
                eclipseProjectClasspath.setText(groovy.xml.XmlUtil.serialize(parsedClasspath), 'UTF-8')
            }

            parsedClasspath.classpathentry.each { entry ->
                ['path', 'sourcepath'].each { String attribute ->
                    String value = entry.attribute(attribute)
                    if (value && value.replace('\\', '/').contains('/caches/')) {
                        File target = file(value).canonicalFile
                        if (!target.exists()) {
                            throw new GradleException("Missing Eclipse project dependency in configured Gradle cache: ${target}")
                        }
                    }
                }
            }
        }

        File eclipseLaunchDir = file('.eclipse/configurations')
        int changedPrepareLaunches = 0
        if (eclipseLaunchDir.isDirectory()) {
            boolean windows = System.getProperty('os.name', '').toLowerCase().contains('windows')
            File gradleWrapper = file(windows ? 'gradlew.bat' : 'gradlew').canonicalFile
            String launcher = windows
                    ? (System.getenv('ComSpec') ?: new File(System.getenv('SystemRoot') ?: 'C:\\Windows',
                            'System32\\cmd.exe').absolutePath)
                    : '/bin/sh'
            String arguments = windows
                    ? "/d /s /c \"\\\"${gradleWrapper.absolutePath}\\\" copyEclipseResources --console plain\""
                    : "-c \"'${gradleWrapper.absolutePath.replace("'", "'\\''")}' copyEclipseResources --console plain\""

            fileTree(eclipseLaunchDir) {
                include '*prepareRun*.launch'
            }.files.each { File launchFile ->
                StringWriter output = new StringWriter()
                def xml = new groovy.xml.MarkupBuilder(output)
                xml.mkp.xmlDeclaration(version: '1.0', encoding: 'UTF-8', standalone: 'no')
                xml.launchConfiguration(type: 'org.eclipse.ui.externaltools.ProgramLaunchConfigurationType') {
                    booleanAttribute(key: 'org.eclipse.debug.ui.ATTR_LAUNCH_IN_BACKGROUND', value: 'true')
                    booleanAttribute(key: 'org.eclipse.ui.externaltools.ATTR_CAPTURE_OUTPUT', value: 'true')
                    stringAttribute(key: 'org.eclipse.ui.externaltools.ATTR_LOCATION', value: launcher)
                    booleanAttribute(key: 'org.eclipse.ui.externaltools.ATTR_SHOW_CONSOLE', value: 'true')
                    stringAttribute(key: 'org.eclipse.ui.externaltools.ATTR_TOOL_ARGUMENTS', value: arguments)
                    stringAttribute(key: 'org.eclipse.ui.externaltools.ATTR_WORKING_DIRECTORY',
                            value: projectDir.canonicalPath)
                    mapAttribute(key: 'org.eclipse.debug.core.environmentVariables') {
                        mapEntry(key: 'GRADLE_USER_HOME', value: eclipseGradleHome.absolutePath)
                        mapEntry(key: 'JAVA_HOME', value: System.getProperty('java.home'))
                    }
                }
                String replacement = output.toString() + System.lineSeparator()
                if (launchFile.getText('UTF-8') != replacement) {
                    launchFile.setText(replacement, 'UTF-8')
                    changedPrepareLaunches++
                }
            }
        }

        int changedLaunches = 0
        int changedTestExclusions = 0
        if (eclipseLaunchDir.isDirectory()) {
            File eclipseClasses = file('bin/main').canonicalFile
            String modClasses = "${mod_id}%%${eclipseClasses.absolutePath}"
            fileTree(eclipseLaunchDir) {
                include '*Slim.launch'
            }.files.each { File launchFile ->
                String original = launchFile.getText('UTF-8')
                String synced = mapCacheReferences(original)
                stableClasspaths.each { File generated, File stable ->
                    synced = synced
                            .replace(generated.absolutePath, stable.absolutePath)
                            .replace(generated.absolutePath.replace('\\', '/'), stable.absolutePath.replace('\\', '/'))
                }
                synced = synced.replaceFirst(
                        /<mapEntry key="MOD_CLASSES" value="[^"]*"\/>/) {
                    "<mapEntry key=\"MOD_CLASSES\" value=\"${modClasses}\"/>"
                }
                String excludeTestKey = 'org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE'
                String excludeTestAttribute =
                        "<booleanAttribute key=\"${excludeTestKey}\" value=\"true\"/>"
                String beforeTestExclusion = synced
                if (synced.contains("key=\"${excludeTestKey}\"")) {
                    synced = synced.replaceFirst(
                            /<booleanAttribute key="org\.eclipse\.jdt\.launching\.ATTR_EXCLUDE_TEST_CODE" value="[^"]*"\/>/,
                            excludeTestAttribute)
                } else {
                    int launchHeaderEnd = synced.indexOf('\n', synced.indexOf('<launchConfiguration'))
                    if (launchHeaderEnd < 0) {
                        throw new GradleException("Malformed Eclipse Java launch configuration: ${launchFile}")
                    }
                    String lineSeparator = synced.contains('\r\n') ? '\r\n' : '\n'
                    synced = "${synced.substring(0, launchHeaderEnd + 1)}" +
                            "  ${excludeTestAttribute}${lineSeparator}" +
                            synced.substring(launchHeaderEnd + 1)
                }
                if (beforeTestExclusion != synced) {
                    changedTestExclusions++
                }
                if (original != synced) {
                    launchFile.setText(synced, 'UTF-8')
                    changedLaunches++
                }
            }
        }

        // ForgeGradle's launch group lets Java start even if its Buildship
        // preparation step changed caches or failed. Publish the synchronized
        // Java launch directly; Eclipse already copies resources into bin/main.
        int changedLaunchGroups = 0
        fileTree(projectDir) {
            include 'run*.launch'
        }.files.each { File launchFile ->
            String runName = launchFile.name.substring(0, launchFile.name.length() - '.launch'.length())
            File slimLaunch = new File(eclipseLaunchDir, "${project.name} - ${runName}Slim.launch")
            if (!slimLaunch.isFile()) {
                return
            }
            String replacement = slimLaunch.getText('UTF-8')
            if (launchFile.getText('UTF-8') != replacement) {
                launchFile.setText(replacement, 'UTF-8')
                changedLaunchGroups++
            }
        }
        logger.lifecycle("Eclipse runtime paths aligned with ${eclipseCache} (${stableClasspaths.size()} Forge classpaths, ${changedProjectClasspath} project classpath, ${changedResourceExclusions} metadata exclusion, ${changedPrepareLaunches} prepare launches, ${changedLaunches} slim launches, ${changedTestExclusions} test exclusions, ${changedLaunchGroups} direct project launches updated)")
    }
}

tasks.configureEach {
    if (name in ['copyEclipseResources', 'genEclipseRuns', 'eclipse',
            'prepareRunClient', 'prepareRunServer', 'prepareRunData', 'prepareRunGameTestServer']) {
        finalizedBy syncEclipseRunClasspaths
    }
}
