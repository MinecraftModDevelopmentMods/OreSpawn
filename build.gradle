            throw new GradleException("Client integration completion marker is missing: ${marker}")
        }
        Properties result = new Properties(); marker.withInputStream { result.load(it) }
        if (result.getProperty('reload_rendered') != 'true'
                || result.getProperty('world_settings_opened') != 'true'
                || result.getProperty('long_editor_roundtrip') != 'true'
                || Integer.parseInt(result.getProperty('editor_routes', '0')) < 5) {
            throw new GradleException("Client integration result is incomplete: ${marker}")
        }
        assertRuntimeLogsClean(clientIntegrationRunDirectory, 'client integration fresh/reload phases')
    }
}

