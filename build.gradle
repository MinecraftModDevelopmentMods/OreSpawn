def fixtureRoot = file("${rootDir}/ci-fixtures")
def mineralogy5OracleJar = new File(fixtureRoot,
        'artifacts/Mineralogy-1.13.2-5.0.1.jar')
def mineralogy5OracleSha256 =
        '92A446EDA31B2ACF12BD2A4ED5CD58DC1E08C96A6B055D3C43E4BBCC9770F6B6'

tasks.register('verifyLegacyFixtures') {
    group = 'verification'
    description = 'Verifies the sealed Mineralogy 1.13.2 oracle used only by isolated tests.'
    inputs.file mineralogy5OracleJar
    doLast {
        if (!mineralogy5OracleJar.isFile()) {
            throw new GradleException("Missing mandatory Mineralogy oracle: ${mineralogy5OracleJar}")
        }
        MessageDigest digest = MessageDigest.getInstance('SHA-256')
        mineralogy5OracleJar.withInputStream { input ->
            byte[] buffer = new byte[8192]
            for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
                if (read > 0) digest.update(buffer, 0, read)
            }
        }
        String actual = digest.digest().encodeHex().toString().toUpperCase()
        if (actual != mineralogy5OracleSha256) {
            throw new GradleException("Mineralogy oracle checksum mismatch: ${actual}")
        }
    }
}

