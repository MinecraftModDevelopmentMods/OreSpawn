import org.apache.tools.ant.filters.FixCrLfFilter


plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.renamer' version '1.1.5'
    id 'net.minecraftforge.accesstransformers' version '2.0.0'
    id 'net.minecraftforge.gradle' version '7.0.34'
}

group = project.mod_group
version = project.mod_version
base.archivesName = project.mod_artifact

// The final version component names the Minecraft target and loader. Reject a
// mismatch here before a jar can accidentally be labelled for another game.
def versionParts = project.mod_version.toString().tokenize('.')
if (versionParts.size() != 4 || !versionParts.every { it ==~ /\d+/ }) {
    throw new GradleException("mod_version must use Major.Minor.Bug.Target numeric form: ${project.mod_version}")
}

def minecraftVersionParts = project.minecraft_version.toString().tokenize('.')
if (minecraftVersionParts.size() < 2 || minecraftVersionParts.size() > 3
        || !minecraftVersionParts.every { it ==~ /\d+/ }) {
    throw new GradleException("minecraft_version must use major.minor or major.minor.patch numeric form: "
            + project.minecraft_version)
}
def minecraftPatch = minecraftVersionParts.size() == 3 ? minecraftVersionParts[2] : '0'
def expectedTargetVersion = "${minecraftVersionParts[0]}" \
        + "${minecraftVersionParts[1].padLeft(2, '0')}" \
        + "${minecraftPatch.padLeft(2, '0')}" \
        + project.loader_code
if (versionParts[3] != expectedTargetVersion) {
    throw new GradleException("mod_version target ${versionParts[3]} does not match "
            + "Minecraft ${project.minecraft_version} ${project.loader_name} target ${expectedTargetVersion}")
}

ext.functional_version = versionParts[0..2].join('.')
ext.display_version = project.mod_version
ext.release_tag = project.mod_version
def expectedMavenGroup = 'zone.moddev.mc.orespawn'
def expectedMavenArtifact = 'OreSpawn'
def expectedMavenCoordinate = "${expectedMavenGroup}:${expectedMavenArtifact}:${project.version}"

// Gradle runs on a modern JDK, but Forge 1.10 consumers need Java 8 classes.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(8)
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(8)
    }
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '1000'])
}

tasks.named('compileTestJava', JavaCompile) {
    options.compilerArgs.add('-proc:none')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    workingDir = project.projectDir
}

tasks.withType(Javadoc).configureEach {
    failOnError = false
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addBooleanOption('notimestamp', true)
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// Canonical text and zip ordering make release jars comparable by hash on
// Windows and Linux, including the guides bundled into the mod.
def archiveTextSuffixes = [
        '.cfg', '.css', '.html', '.info', '.java', '.js', '.json', '.lang',
        '.mcmeta', '.md', '.properties', '.txt', '.xml'
]
def archiveTextPatterns = archiveTextSuffixes.collect { "**/*${it}".toString() }
archiveTextPatterns.addAll(['**/element-list', '**/package-list'])
def normalizeArchiveLineEndings = { details ->
    details.filter(FixCrLfFilter,
            eol: FixCrLfFilter.CrLf.newInstance('lf'),
            eof: FixCrLfFilter.AddAsisRemove.newInstance('asis'))
}

minecraft {
    mappings channel: project.mapping_channel, version: project.mapping_version
    accessTransformer = 'META-INF/accesstransformer.cfg'

    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('run')
            systemProperty 'forge.logging.console.level', 'debug'
        }
        register('client')
        register('server') {
            args 'nogui'
        }
    }
}

// Forge 1.10 expects each development mod to expose classes and resources from
// one classpath root. ForgeGradle 7 splits those outputs, so build a separate
// merged launch root without contaminating either canonical source-set output.
def forge10DevelopmentOutput = layout.buildDirectory.dir('forge10-development/main')
def syncForge10DevelopmentResources = tasks.register('syncForge10DevelopmentResources', Sync) {
    group = 'ide'
    description = 'Merges processed resources into the Forge 1.10 development launch root.'
    dependsOn tasks.named('classes')
    from tasks.named('compileJava', JavaCompile).flatMap { it.destinationDirectory }
    from sourceSets.main.output.resourcesDir
    into forge10DevelopmentOutput
}
tasks.configureEach {
    if (name == 'runClient' || name == 'runServer') {
        dependsOn syncForge10DevelopmentResources
        doFirst {
            Set<File> splitMainOutputs = [
                    tasks.named('compileJava', JavaCompile).get().destinationDirectory.get().asFile,
                    sourceSets.main.output.resourcesDir
            ] as Set<File>
            classpath = files(forge10DevelopmentOutput, classpath.filter {
                !splitMainOutputs.contains(it)
            })
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven

    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }

    mavenCentral()
    maven {
        name = 'MinecraftLibraries'
        url = 'https://libraries.minecraft.net/'
    }
}

// Keep ordinary dependencies here. The sealed Mineralogy oracle belongs to
// the verification script, where its test-only scope is checked.
dependencies {
    implementation minecraft.dependency(
            "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")
    compileOnly 'org.lwjgl.lwjgl:lwjgl_util:2.9.4-nightly-20150209'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

def trackedDocumentationFiles = {
    fileTree('docs') { include '**/*' }.files.findAll { it.isFile() }
            .sort { project.relativePath(it) }
}
def documentationRelativePath = { File source ->
    file('docs').toPath().relativize(source.toPath()).toString().replace('\\', '/')
}

tasks.register('verifyDocumentationParity') {
    group = 'verification'
    description = 'Verifies every tracked guide has an identical processed production resource.'
    dependsOn tasks.named('processResources')
    doLast {
        List<File> tracked = trackedDocumentationFiles()
        if (tracked.size() != 21) {
            throw new GradleException("Expected 21 tracked documentation files, found ${tracked.size()}")
        }
        tracked.each { File source ->
            String relative = documentationRelativePath(source)
            File processed = layout.buildDirectory.file(
                    "resources/main/META-INF/orespawn/docs/${relative}").get().asFile
            if (!processed.isFile() || !java.util.Arrays.equals(source.bytes, processed.bytes)) {
                throw new GradleException("Processed documentation differs for ${relative}")
            }
        }
    }
}

// Bundle the player guides and resolve mcmod.info's version placeholders.
// The parity task checks every guide against its processed copy.
tasks.named('processResources', ProcessResources) {
    filteringCharset = 'UTF-8'
    inputs.property('version', project.version)
    inputs.property('mcversion', project.minecraft_version)

    filesMatching('mcmod.info') {
        expand version: project.version, mcversion: project.minecraft_version
    }
    from('docs/AGENTS.md') {
        into ''
        rename { 'AGENTS.md' }
    }
    from('docs') {
        into 'META-INF/orespawn/docs'
    }
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
}

// Scripts have their own local variables. Share only the project values they
// actually need; release identity remains checked in the audit tasks.
ext.oreSpawnBuild = [
        mavenGroup: expectedMavenGroup,
        mavenArtifact: expectedMavenArtifact,
        mavenCoordinate: expectedMavenCoordinate,
        archiveTextSuffixes: archiveTextSuffixes,
        developmentOutput: forge10DevelopmentOutput,
        trackedDocumentationFiles: trackedDocumentationFiles,
        documentationRelativePath: documentationRelativePath
].asImmutable()

// The development jar is mapped; the release script creates the reobfuscated
// jar that a player installs. Keep these source and documentation jars stable.
tasks.named('jar', Jar) {
    archiveClassifier = 'deobf'
    destinationDirectory = layout.buildDirectory.dir('libs-dev')
    manifest {
        attributes([
                'Specification-Title'       : base.archivesName.get(),
                'Specification-Vendor'      : project.mod_vendor,
                'Specification-Version'     : '1',
                'Implementation-Title'      : base.archivesName.get(),
                'Implementation-Version'    : project.version,
                'Implementation-Vendor'     : project.mod_vendor,
                'OreSpawn-API-Version'      : '1',
                'FMLAT'                     : 'accesstransformer.cfg',
                'Maven-Artifact'             : expectedMavenCoordinate,
                'Built-On-Java'              : '8',
                'Built-On'                   : "${project.minecraft_version}-${project.forge_version}"
        ])
    }
}

tasks.named('sourcesJar', Jar) {
    filteringCharset = 'UTF-8'
    includeEmptyDirs = false
    archiveClassifier = 'sources'
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
    manifest {
        attributes([
                'Maven-Artifact'        : "${project.group}:${base.archivesName.get()}:${project.version}:sources",
                'Implementation-Title'  : 'OreSpawn-sources',
                'Implementation-Version': project.version
        ])
    }
}

tasks.named('javadocJar', Jar) {
    filteringCharset = 'UTF-8'
    archiveClassifier = 'javadoc'
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
    manifest {
        attributes([
                'Maven-Artifact'        : "${project.group}:${base.archivesName.get()}:${project.version}:javadoc",
                'Implementation-Title'  : 'OreSpawn-javadoc',
                'Implementation-Version': project.version
        ])
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
// Apply in dependency order: fixtures and run helpers first, then their gates,
// release artifacts, publishing, and finally Eclipse integration.
apply from: 'gradle/verification/support.gradle'
apply from: 'gradle/verification/legacy-and-migration.gradle'
apply from: 'gradle/verification/client-and-benchmark.gradle'
apply from: 'gradle/release/artifacts.gradle'
apply from: 'gradle/release/publishing.gradle'
apply from: 'gradle/ide/eclipse.gradle'
