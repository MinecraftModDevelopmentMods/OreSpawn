tasks.register('verifyReleaseConfiguration') {
    group = 'verification'
    description = 'Validates the target-qualified release, API, schemas, reports, and publishing identity.'

    doLast {
        if (project.mod_version != '4.0.8.112021') {
            throw new GradleException("Unexpected OreSpawn release version: ${project.mod_version}")
        }
        if (project.minecraft_version != '1.12.2'
                || project.forge_version != '14.23.5.2859'
                || project.mapping_channel != 'stable'
                || project.mapping_version != '39-1.12') {
            throw new GradleException('Unexpected Minecraft, Forge, or mappings target')
        }
        if (project.loader_name != 'forge' || project.loader_code != '1'
                || project.java_version != '8' || project.gradle_java_version != '17') {
            throw new GradleException('Unexpected dispatcher target metadata')
        }
        if (project.group.toString() != 'zone.moddev.mc'
                || base.archivesName.get() != 'OreSpawn'
                || project.curseforge_project_id != '245586') {
            throw new GradleException('Unexpected Maven or CurseForge publication identity')
        }

        [
                'src/main/java/zone/moddev/mc/orespawn/OreSpawn.java',
                'src/main/java/com/mcmoddev/orespawn/compat/LegacyOs3Bridge.java',
                'src/main/java/zone/moddev/mc/orespawn/worldgen/LegacyMineralogyProfileMigration.java',
                'src/main/java/zone/moddev/mc/orespawn/worldgen/LegacyOs3ProfileMigration.java',
                'README.md', 'CHANGELOG.txt'
        ].each { path ->
            if (!file(path).getText('UTF-8').contains('4.0.8.112021')) {
                throw new GradleException("Authoritative release location does not contain 4.0.8.112021: ${path}")
            }
        }
        if (!file('docs/API.md').getText('UTF-8').contains('orespawn@[4.0.6,5.0.0)')) {
            throw new GradleException('Consumer compatibility floor must remain [4.0.6,5.0.0)')
        }
        if (!file('src/main/java/zone/moddev/mc/orespawn/api/OreSpawnApi.java')
                .getText('UTF-8').contains('API_VERSION = 1')) {
            throw new GradleException('OreSpawn API major must remain 1')
        }
        if (!file('src/main/java/zone/moddev/mc/orespawn/worldgen/GeomeConfig.java')
                .getText('UTF-8').contains('SCHEMA_VERSION = 6')
                || !file('src/main/java/zone/moddev/mc/orespawn/worldgen/WorldGeologyProfile.java')
                .getText('UTF-8').contains('SCHEMA_VERSION = 5')) {
            throw new GradleException('Global/world schema versions must remain 6/5')
        }
        def providerSchema = new JsonSlurper().parse(file('docs/schemas/orespawn-provider.schema.json'))
        if (!(providerSchema.properties.schema_version.enum as List).contains(4)) {
            throw new GradleException('Provider schema must continue to support schema version 4')
        }
    }
}

tasks.register('verifyReleaseArtifacts') {
    group = 'verification'
    description = 'Audits the exact three distributable jars and their release-critical contents.'
    dependsOn tasks.named('verifyReleaseConfiguration')
    dependsOn tasks.named('assemble')

    doLast {
        File libs = layout.buildDirectory.dir('libs').get().asFile
        List<File> jars = (libs.listFiles() ?: [] as File[])
                .findAll { it.name.endsWith('.jar') }
                .sort { it.name }
        List<String> actual = jars.collect { it.name }
        List<String> expected = expectedReleaseFiles.get().sort()
        if (actual != expected) {
            throw new GradleException("Expected exactly ${expected}, found ${actual}")
        }

        jars.each { candidate ->
            if (candidate.length() == 0L) {
                throw new GradleException("Empty release artifact: ${candidate.name}")
            }
            ZipFile candidateZip = new ZipFile(candidate)
            try {
                candidateZip.entries().findAll { entry ->
                    !entry.isDirectory()
                            && (archiveTextSuffixes.any { entry.name.endsWith(it) }
                            || entry.name.endsWith('/element-list')
                            || entry.name.endsWith('/package-list'))
                }.each { entry ->
                    boolean containsCarriageReturn = candidateZip.getInputStream(entry).withCloseable { input ->
                        input.bytes.any { value -> value == 13 }
                    }
                    if (containsCarriageReturn) {
                        throw new GradleException(
                                "${candidate.name}!/${entry.name} does not use canonical LF line endings")
                    }
                }
                ['src/test/', 'src/biomeIntegrationTest/', 'src/migrationIntegrationTest/',
                 'src/clientIntegrationTest/', 'src/os1AbiFixture/', 'src/os3AbiFixture/',
                 'agent-notes/', 'surfaceprobe', 'migrationprobe', 'clientprobe',
                 'org/junit/', 'org/mockito/', 'net/bytebuddy/'].each { forbidden ->
                    if (candidateZip.entries().any { it.name.contains(forbidden) }) {
                        throw new GradleException(
                                "${candidate.name} contains forbidden entry matching ${forbidden}")
                    }
                }
            } finally {
                candidateZip.close()
            }
        }

        File mainJar = new File(libs, expectedReleaseFiles.get()[0])
        ZipFile zip = new ZipFile(mainJar)
        try {
            List<String> names = zip.entries().collect { it.name }
            [
                    'mcmod.info',
                    'META-INF/accesstransformer.cfg',
                    'zone/moddev/mc/orespawn/api/OreSpawnApi.class',
                    'META-INF/orespawn/docs/VERSIONS.md',
                    'META-INF/orespawn/docs/schemas/orespawn-provider.schema.json',
                    'META-INF/orespawn/docs/schemas/orespawn-global.schema.json',
                    'META-INF/orespawn/docs/schemas/orespawn-world.schema.json',
                    'AGENTS.md'
            ].each { required ->
                if (!names.contains(required)) {
                    throw new GradleException("Release jar is missing ${required}")
                }
            }

            String metadata = zip.getInputStream(zip.getEntry('mcmod.info'))
                    .getText(StandardCharsets.UTF_8.name())
            def parsed = new JsonSlurper().parseText(metadata)
            def mod = parsed instanceof List ? parsed.first() : parsed
            if (mod.modid != 'orespawn' || mod.version != project.mod_version
                    || mod.mcversion != project.minecraft_version) {
                throw new GradleException('Packaged mcmod.info version or target is incorrect')
            }

            String packagedAccessTransformer = zip.getInputStream(
                    zip.getEntry('META-INF/accesstransformer.cfg'))
                    .getText(StandardCharsets.UTF_8.name())
            List<String> packagedAccessTransformerRules = packagedAccessTransformer.readLines()
                    .collect { it.replaceFirst(/\s*#.*/, '').trim() }
                    .findAll { !it.isEmpty() }
            List<String> expectedRuntimeAccessTransformerRules = [
                    'public-f net.minecraft.world.WorldProvider field_76578_c',
                    'public-f net.minecraft.world.gen.ChunkGeneratorOverworld field_186001_t'
            ]
            if (packagedAccessTransformerRules != expectedRuntimeAccessTransformerRules) {
                throw new GradleException('Packaged access transformer was not remapped to the runtime SRG rules')
            }

            def manifestEntry = zip.getEntry('META-INF/MANIFEST.MF')
            def manifest = manifestEntry == null ? null
                    : new Manifest(zip.getInputStream(manifestEntry)).mainAttributes
            if (manifest == null
                    || manifest.getValue('Implementation-Version') != project.mod_version
                    || manifest.getValue('OreSpawn-API-Version') != '1'
                    || manifest.getValue('FMLAT') != 'accesstransformer.cfg'
                    || manifest.getValue('Implementation-Timestamp') != null
                    || manifest.getValue('Timestamp') != null) {
                throw new GradleException('Release manifest identity/API/FMLAT is incorrect or volatile')
            }

            zip.entries().findAll { it.name.endsWith('.class') }.each { entry ->
                byte[] header = new byte[8]
                zip.getInputStream(entry).withCloseable { input ->
                    if (input.read(header) != header.length) {
                        throw new GradleException("Cannot inspect bytecode header for ${entry.name}")
                    }
                }
                int major = ((header[6] & 0xff) << 8) | (header[7] & 0xff)
                if (major != 52) {
                    throw new GradleException("${entry.name} uses Java class major ${major}, expected 52")
                }
            }
        } finally {
            zip.close()
        }

        File sources = new File(libs, expectedReleaseFiles.get()[1])
        new ZipFile(sources).withCloseable { sourceZip ->
            if (sourceZip.getEntry('zone/moddev/mc/orespawn/OreSpawn.java') == null) {
                throw new GradleException('Sources jar is missing OreSpawn.java')
            }
        }
        File javadocs = new File(libs, expectedReleaseFiles.get()[2])
        new ZipFile(javadocs).withCloseable { javadocZip ->
            if (javadocZip.getEntry('index.html') == null) {
                throw new GradleException('Javadoc jar is missing index.html')
            }
        }
    }
}

tasks.register('writeReleaseChecksums') {
    group = 'verification'
    description = 'Writes SHA-256 checksums for the audited release jars.'
    dependsOn tasks.named('verifyReleaseArtifacts')
    def outputFile = layout.buildDirectory.file('release/SHA256SUMS')
    inputs.files(providers.provider {
        expectedReleaseFiles.get().collect { name ->
            layout.buildDirectory.file("libs/${name}").get().asFile
        }
    })
    outputs.file(outputFile)

    doLast {
        File output = outputFile.get().asFile
        output.parentFile.mkdirs()
        File libs = layout.buildDirectory.dir('libs').get().asFile
        String contents = expectedReleaseFiles.get().sort().collect { name ->
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            new File(libs, name).withInputStream { input ->
                byte[] buffer = new byte[8192]
                for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
                    if (read > 0) digest.update(buffer, 0, read)
                }
            }
            "${digest.digest().encodeHex().toString().toUpperCase()}  ${name}"
        }.join('\n') + '\n'
        output.setText(contents, 'UTF-8')
    }
}

tasks.register('verifyPreparedReleaseArtifacts') {
    group = 'verification'
    description = 'Audits a previously built immutable release bundle before remote Maven publication.'

    doLast {
        if (!preparedReleaseDir.isPresent()) {
            throw new GradleException('preparedReleaseDir is required for prepared artifact publication')
        }
        File prepared = file(preparedReleaseDir.get())
        if (!prepared.isDirectory()) {
            throw new GradleException("Prepared release directory does not exist: ${prepared}")
        }
        List<String> expected = expectedReleaseFiles.get().sort()
        List<File> jars = (prepared.listFiles() ?: [] as File[])
                .findAll { it.name.endsWith('.jar') }
                .sort { it.name }
        if (jars.collect { it.name } != expected || jars.any { it.length() == 0L }) {
            throw new GradleException("Prepared release must contain exactly the non-empty jars ${expected}")
        }
        File checksums = new File(prepared, 'SHA256SUMS')
        File changelog = new File(prepared, 'CHANGELOG.txt')
        if (!checksums.isFile() || !changelog.isFile()) {
            throw new GradleException('Prepared release is missing SHA256SUMS or CHANGELOG.txt')
        }
        List<String> actualChecksums = jars.collect { candidate ->
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            candidate.withInputStream { input ->
                byte[] buffer = new byte[8192]
                for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
                    if (read > 0) digest.update(buffer, 0, read)
                }
            }
            "${digest.digest().encodeHex().toString().toUpperCase()}  ${candidate.name}"
        }.sort()
        List<String> declaredChecksums = checksums.readLines('UTF-8')
                .findAll { !it.trim().isEmpty() }
                .sort()
        if (actualChecksums != declaredChecksums) {
            throw new GradleException('Prepared release checksums do not match the immutable jars')
        }
    }
}

