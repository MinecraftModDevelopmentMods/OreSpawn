}

tasks.named('check') {
    dependsOn tasks.named('verifyLegacyOracleIsolation')
    dependsOn tasks.named('verifyJava21Toolchain')
    dependsOn tasks.named('verifyMavenizerCompatibilityFixture')
}

tasks.named('processResources', ProcessResources) {
    dependsOn prepareBundledDocumentation
    filteringCharset = 'UTF-8'
    inputs.property('version', project.version)
    inputs.property('minecraft_version', project.minecraft_version)
    inputs.property('forge_version_range', project.forge_version_range)
    inputs.property('loader_version_range', project.loader_version_range)
    inputs.property('minecraft_version_range', project.minecraft_version_range)
    filesMatching('META-INF/mods.toml') {
        expand([
                version: project.version,
                minecraft_version: project.minecraft_version,
                forge_version_range: project.forge_version_range,
                loader_version_range: project.loader_version_range,
                minecraft_version_range: project.minecraft_version_range
        ])
    }
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
}

def prepareEclipseResources = tasks.register('prepareEclipseResources') {
    group = 'ide'
    dependsOn tasks.named('processResources')
    doLast {
        project.copy {
            from(layout.buildDirectory.dir('resources/main'))
            into(layout.projectDirectory.dir('bin/main'))
        }
        // The older guide index is no longer shipped; remove its stale IDE copy.
        delete layout.projectDirectory.file('bin/main/META-INF/orespawn/docs/AGENTS.md')
    }
}


ext.oreSpawnBuild.prepareEclipseResources = prepareEclipseResources
