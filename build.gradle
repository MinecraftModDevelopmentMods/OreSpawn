buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '3.+', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = mod_version
group = mod_group_id
archivesBaseName = "OreSpawn-${minecraft_version}"

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: project.mapping_channel, version: project.mapping_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                orespawn { source sourceSets.main }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--nogui'
            mods {
                orespawn { source sourceSets.main }
            }
        }

        data {
            workingDirectory project.file('run-data')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                orespawn { source sourceSets.main }
            }
        }

        surfaceIntegrationFresh {
            workingDirectory project.file("${buildDir}/surface-integration-run")
            property 'forge.logging.console.level', 'info'
            property 'surfaceprobe.integrationPhase', 'fresh'
            args '--nogui'
            mods {
                orespawn { source sourceSets.main }
            }
        }

        surfaceIntegrationReload {
            workingDirectory project.file("${buildDir}/surface-integration-run")
            property 'forge.logging.console.level', 'info'
            property 'surfaceprobe.integrationPhase', 'reload'
            args '--nogui'
            mods {
                orespawn { source sourceSets.main }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

def configureForge31Run = { JavaExec runTask, String launchTarget ->
    runTask.main = 'net.minecraftforge.userdev.LaunchTesting'
    runTask.environment 'target', launchTarget
    runTask.environment 'MCP_MAPPINGS', "${mapping_channel}_${mapping_version}"
    runTask.environment 'MCP_VERSION', mcp_version
    runTask.environment 'FORGE_VERSION', forge_version
    runTask.environment 'FORGE_GROUP', 'net.minecraftforge'
    runTask.environment 'MC_VERSION', minecraft_version
    runTask.environment 'MOD_CLASSES', "${mod_id}%%${sourceSets.main.output.classesDirs.singleFile};" +
            "${mod_id}%%${sourceSets.main.output.resourcesDir}"
}

tasks.withType(JavaExec).all { JavaExec runTask ->
    Map<String, String> targets = [
            runClient: 'fmluserdevclient',
            runServer: 'fmluserdevserver',
            runData: 'fmluserdevdata',
            runSurfaceIntegrationFresh: 'fmluserdevserver',
            runSurfaceIntegrationReload: 'fmluserdevserver'
    ]
    String launchTarget = targets.get(runTask.name)
    if (launchTarget != null) {
        configureForge31Run(runTask, launchTarget)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    testCompile 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testCompile 'org.junit.jupiter:junit-jupiter-params:5.10.2'
    testRuntime 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntime 'org.junit.platform:junit-platform-launcher:1.10.2'
}

task sourcesJar(type: Jar, dependsOn: classes) {
    classifier = 'sources'
    from sourceSets.main.allSource
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    classifier = 'javadoc'
    from javadoc.destinationDir
}

artifacts {
    archives sourcesJar
    archives javadocJar
}

jar {
    manifest {
        attributes([
                'Specification-Title'       : 'OreSpawn',
                'Specification-Vendor'      : 'SkyBlade1978',
                'Specification-Version'     : '1',
                'Implementation-Title'      : project.name,
                'Implementation-Version'    : version,
                'Implementation-Vendor'     : 'SkyBlade1978',
                'Implementation-Timestamp'  : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'OreSpawn-API-Version'       : '1'
        ])
    }
    finalizedBy 'reobfJar'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', minecraft_version
    inputs.property 'forge_version_range', forge_version_range
    inputs.property 'loader_version_range', loader_version_range
    inputs.property 'minecraft_version_range', minecraft_version_range

    filesMatching('META-INF/mods.toml') {
        expand([
                version: project.version,
                minecraft_version: minecraft_version,
                forge_version_range: forge_version_range,
                loader_version_range: loader_version_range,
                minecraft_version_range: minecraft_version_range
        ])
    }
    from('docs/AGENTS.md') {
        into ''
        rename { 'AGENTS.md' }
    }
    from('docs') {
        into 'META-INF/orespawn/docs'
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
            artifact sourcesJar
            artifact javadocJar
        }
    }
    repositories {
        maven { url "file:///${project.projectDir}/mcmodsrepo" }
    }
}

tasks.withType(JavaCompile) {
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '1000']
}

javadoc {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

test {
    useJUnitPlatform()
}

def surfaceIntegrationClasses = file("${buildDir}/surface-integration-fixture/classes")
task compileSurfaceIntegrationTestMod(type: JavaCompile, dependsOn: classes) {
    source fileTree('src/biomeIntegrationTest/java')
    classpath = files(sourceSets.main.output, sourceSets.main.compileClasspath)
    destinationDir = surfaceIntegrationClasses
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
}

task surfaceIntegrationTestModJar(type: Jar, dependsOn: compileSurfaceIntegrationTestMod) {
    archiveName = 'surfaceprobe.jar'
    destinationDir = file("${buildDir}/surface-integration-fixture")
    from surfaceIntegrationClasses
    from 'src/biomeIntegrationTest/resources'
}

def surfaceIntegrationRunDirectory = file("${buildDir}/surface-integration-run")
task prepareSurfaceIntegrationTest(dependsOn: surfaceIntegrationTestModJar) {
    doLast {
        delete surfaceIntegrationRunDirectory
        surfaceIntegrationRunDirectory.mkdirs()
        copy {
            from surfaceIntegrationTestModJar.archivePath
            into new File(surfaceIntegrationRunDirectory, 'mods')
        }
        new File(surfaceIntegrationRunDirectory, 'server.properties').setText('''\
level-name=surface-integration-world
level-seed=zsjpxah
level-type=default
online-mode=false
allow-nether=true
generate-structures=false
spawn-protection=0
max-tick-time=-1
''', 'UTF-8')
        new File(surfaceIntegrationRunDirectory, 'eula.txt').setText('eula=true\n', 'UTF-8')
    }
}

tasks.matching { it.name == 'runSurfaceIntegrationFresh' }.all {
    dependsOn prepareSurfaceIntegrationTest
}

def createSurfaceProcess = { String phase, Object dependency ->
    task("surfaceIntegration${phase}Process", type: Exec, dependsOn: [dependency, "prepareRunSurfaceIntegration${phase}"]) {
        group = 'verification'
        doFirst {
            JavaExec runTask = tasks.getByName("runSurfaceIntegration${phase}") as JavaExec
            File classpathJar = file("${buildDir}/surface-integration-fixture/${phase.toLowerCase()}-classpath.jar")
            classpathJar.parentFile.mkdirs()
            java.util.jar.Manifest manifest = new java.util.jar.Manifest()
            manifest.mainAttributes.put(java.util.jar.Attributes.Name.MANIFEST_VERSION, '1.0')
            manifest.mainAttributes.put(java.util.jar.Attributes.Name.CLASS_PATH,
                    runTask.classpath.files.collect { it.toURI().toASCIIString() }.join(' '))
            classpathJar.withOutputStream { output ->
                new java.util.jar.JarOutputStream(output, manifest).close()
            }
            List<String> arguments = []
            arguments.addAll(runTask.allJvmArgs)
            int classpathFlag = arguments.lastIndexOf('-cp')
            if (classpathFlag < 0) {
                classpathFlag = arguments.lastIndexOf('-classpath')
            }
            if (classpathFlag >= 0 && classpathFlag + 1 < arguments.size()) {
                arguments.remove(classpathFlag + 1)
                arguments.remove(classpathFlag)
            }
            arguments.add('-cp')
            arguments.add(classpathJar.absolutePath)
            arguments.add(runTask.main ?: 'net.minecraftforge.userdev.LaunchTesting')
            arguments.addAll(runTask.args)
            workingDir runTask.workingDir
            environment runTask.environment
            File javaExecutable = new File(System.getProperty('java.home'), 'bin/java.exe')
            String command = 'call "' + javaExecutable.absolutePath + '" ' +
                    arguments.collect { '"' + it.toString().replace('"', '""') + '"' }.join(' ')
            commandLine 'cmd.exe', '/d', '/s', '/c', command
        }
    }
}

def surfaceIntegrationFreshProcess = createSurfaceProcess('Fresh', prepareSurfaceIntegrationTest)
surfaceIntegrationFreshProcess.doLast {
    File marker = new File(surfaceIntegrationRunDirectory,
            'surface-integration-world/surfaceprobe-integration.properties')
    if (!marker.isFile()) {
        throw new GradleException("Fresh surface integration completion marker is missing: ${marker}")
    }
}
def surfaceIntegrationReloadProcess = createSurfaceProcess('Reload', surfaceIntegrationFreshProcess)

task surfaceIntegrationTest(dependsOn: surfaceIntegrationReloadProcess) {
    group = 'verification'
    doLast {
        File marker = new File(surfaceIntegrationRunDirectory,
                'surface-integration-world/surfaceprobe-integration.properties')
        Properties result = new Properties()
        marker.withInputStream { result.load(it) }
        if (result.getProperty('reload_verified') != 'true') {
            throw new GradleException("Surface integration reload was not verified: ${marker}")
        }
        logger.lifecycle('Provider surfaces and exact-biome geology verified: {} dimensions, {} columns each, fresh + reload',
                result.getProperty('dimensions'), result.getProperty('columns_per_dimension'))
    }
}

check.dependsOn surfaceIntegrationTest

task syncForge31EclipseLaunches(dependsOn: compileSurfaceIntegrationTestMod) {
    group = 'ide'
    doLast {
        String mainClass = 'net.minecraftforge.userdev.LaunchTesting'
        String mainOutput = new File(projectDir, 'bin/main').absolutePath
        String fixtureOutput = surfaceIntegrationClasses.absolutePath
        String fixtureResources = new File(projectDir, 'src/biomeIntegrationTest/resources').absolutePath
        String fixtureModClasses = "${mod_id}%%${mainOutput};${mod_id}%%${mainOutput};" +
                "surfaceprobe%%${fixtureOutput};surfaceprobe%%${fixtureResources}"
        String environmentEntries =
                "    <mapEntry key=\"MCP_MAPPINGS\" value=\"${mapping_channel}_${mapping_version}\"/>\r\n" +
                "    <mapEntry key=\"MCP_VERSION\" value=\"${mcp_version}\"/>\r\n" +
                "    <mapEntry key=\"FORGE_VERSION\" value=\"${forge_version}\"/>\r\n" +
                "    <mapEntry key=\"FORGE_GROUP\" value=\"net.minecraftforge\"/>\r\n" +
                "    <mapEntry key=\"target\" value=\"fmluserdevserver\"/>\r\n" +
                "    <mapEntry key=\"MC_VERSION\" value=\"${minecraft_version}\"/>\r\n"
        ['Fresh', 'Reload'].each { String phase ->
            File launch = file("runSurfaceIntegration${phase}.launch")
            if (!launch.isFile()) {
                throw new GradleException("Missing generated Eclipse launch: ${launch}")
            }
            String text = launch.getText('UTF-8')
            text = text.replace(
                    '<stringAttribute key="org.eclipse.jdt.launching.MAIN_TYPE" value=""/>',
                    "<stringAttribute key=\"org.eclipse.jdt.launching.MAIN_TYPE\" value=\"${mainClass}\"/>")
            text = text.replaceFirst(
                    /<mapEntry key="MOD_CLASSES" value="[^"]*"\/>/,
                    java.util.regex.Matcher.quoteReplacement(
                            "<mapEntry key=\"MOD_CLASSES\" value=\"${fixtureModClasses}\"/>"))
            if (!text.contains('key="target"')) {
                text = text.replace('    <mapEntry key="MOD_CLASSES"',
                        environmentEntries + '    <mapEntry key="MOD_CLASSES"')
            }
            launch.setText(text, 'UTF-8')
        }
    }
}

tasks.matching { it.name == 'genEclipseRuns' }.all {
    finalizedBy syncForge31EclipseLaunches
}
