buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.2-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

eclipse {
    classpath {
        // ForgeGradle 2.2 launches use the whole Eclipse project classpath.
        // Keep ordinary client/server runs production-only; the integration
        // fixtures have dedicated Gradle-backed Eclipse launchers below.
        sourceSets = [sourceSets.main]
        file.whenMerged { classpath ->
            classpath.entries.removeAll { entry ->
                String path = entry.path == null ? '' : entry.path.toString()
                path == 'src/test/java' || ['/junit-', '/opentest4j/', '/org.apiguardian/'].any {
                    path.contains(it)
                }
            }
        }
    }
}

version = mod_version
group = mod_group_id
archivesBaseName = "OreSpawn-${minecraft_version}"
sourceCompatibility = targetCompatibility = '1.8'

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    version = "${minecraft_version}-${forge_version}"
    mappings = mapping_version
    runDir = 'run'
    makeObfSourceJar = false
    accessTransformer file('src/main/resources/META-INF/accesstransformer.cfg')
    serverRunArgs += 'nogui'
}

repositories {
    mavenCentral()
}

dependencies {
    testCompile 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testCompile 'org.junit.jupiter:junit-jupiter-params:5.10.2'
    testRuntime 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntime 'org.junit.platform:junit-platform-launcher:1.10.2'
}

tasks.withType(JavaCompile) {
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '1000']
}

test {
    useJUnitPlatform()
}

def surfaceIntegrationClasses = file("${buildDir}/surface-integration-fixture/classes")
task compileSurfaceIntegrationTestMod(type: JavaCompile, dependsOn: classes) {
    source fileTree('src/biomeIntegrationTest/java')
    classpath = files(sourceSets.main.output, sourceSets.main.compileClasspath)
    destinationDir = surfaceIntegrationClasses
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
}

task surfaceIntegrationTestModJar(type: Jar, dependsOn: compileSurfaceIntegrationTestMod) {
    archiveName = 'surfaceprobe.jar'
    destinationDir = file("${buildDir}/surface-integration-fixture")
    from surfaceIntegrationClasses
    from 'src/biomeIntegrationTest/resources'
}

def surfaceIntegrationRunDirectory = file("${buildDir}/surface-integration-run")
task prepareSurfaceIntegrationTest(dependsOn: surfaceIntegrationTestModJar) {
    doLast {
        delete surfaceIntegrationRunDirectory
        surfaceIntegrationRunDirectory.mkdirs()
        copy {
            from surfaceIntegrationTestModJar.archivePath
            into new File(surfaceIntegrationRunDirectory, 'mods')
        }
        new File(surfaceIntegrationRunDirectory, 'server.properties').setText('''\
level-name=surface-integration-world
level-seed=zsjpxah
level-type=default
online-mode=false
allow-nether=true
generate-structures=false
spawn-protection=0
max-tick-time=-1
''', 'UTF-8')
        new File(surfaceIntegrationRunDirectory, 'eula.txt').setText('eula=true\n', 'UTF-8')
    }
}

def createSurfaceProcess = { String phase, Object dependency ->
    task("surfaceIntegration${phase}Process", type: JavaExec, dependsOn: dependency) {
        group = 'verification'
        dependsOn { runServer.taskDependencies.getDependencies(runServer) }
        main = runServer.main
        args runServer.args
        workingDir surfaceIntegrationRunDirectory
        systemProperty 'surfaceprobe.integrationPhase', phase.toLowerCase()
        doFirst {
            // ForgeGradle 2 materializes GradleStartServer during makeStart, so
            // copy the development classpath only after that dependency runs.
            classpath = runServer.classpath
        }
    }
}

def surfaceIntegrationFreshProcess = createSurfaceProcess('Fresh', prepareSurfaceIntegrationTest)
surfaceIntegrationFreshProcess.doLast {
    File marker = new File(surfaceIntegrationRunDirectory,
            'surface-integration-world/surfaceprobe-integration.properties')
    if (!marker.isFile()) {
        throw new GradleException("Fresh surface integration completion marker is missing: ${marker}")
    }
}
def surfaceIntegrationReloadProcess = createSurfaceProcess('Reload', surfaceIntegrationFreshProcess)

task surfaceIntegrationTest(dependsOn: surfaceIntegrationReloadProcess) {
    group = 'verification'
    doLast {
        File marker = new File(surfaceIntegrationRunDirectory,
                'surface-integration-world/surfaceprobe-integration.properties')
        Properties result = new Properties()
        marker.withInputStream { result.load(it) }
        if (result.getProperty('reload_verified') != 'true') {
            throw new GradleException("Surface integration reload was not verified: ${marker}")
        }
        logger.lifecycle('Provider surfaces and exact-biome geology verified: {} dimensions, {} columns each, fresh + reload',
                result.getProperty('dimensions'), result.getProperty('columns_per_dimension'))
    }
}

check.dependsOn surfaceIntegrationTest

def migrationIntegrationClasses = file("${buildDir}/migration-integration-fixture/classes")
task compileMigrationIntegrationTestMod(type: JavaCompile, dependsOn: classes) {
    source fileTree('src/migrationIntegrationTest/java')
    classpath = files(sourceSets.main.output, sourceSets.main.compileClasspath)
    destinationDir = migrationIntegrationClasses
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
}

task migrationIntegrationTestModJar(type: Jar, dependsOn: compileMigrationIntegrationTestMod) {
    archiveName = 'migrationprobe.jar'
    destinationDir = file("${buildDir}/migration-integration-fixture")
    from migrationIntegrationClasses
    from 'src/migrationIntegrationTest/resources'
}

if (project.hasProperty('migrationRunDir')) {
    def migrationRunDirectory = file(project.property('migrationRunDir'))
    task prepareMigrationIntegrationRun(dependsOn: migrationIntegrationTestModJar) {
        doLast {
            copy { from migrationIntegrationTestModJar.archivePath; into new File(migrationRunDirectory, 'mods') }
            new File(migrationRunDirectory, 'eula.txt').setText('eula=true\n', 'UTF-8')
            File serverProperties = new File(migrationRunDirectory, 'server.properties')
            Properties values = new Properties()
            if (serverProperties.isFile()) serverProperties.withInputStream { values.load(it) }
            values.setProperty('spawn-animals', 'false')
            values.setProperty('spawn-monsters', 'false')
            serverProperties.withOutputStream { values.store(it, 'OreSpawn migration qualification') }
        }
    }
    task migrationIntegrationProcess(type: JavaExec, dependsOn: prepareMigrationIntegrationRun) {
        group = 'verification'
        dependsOn { runServer.taskDependencies.getDependencies(runServer) }
        main = runServer.main
        args runServer.args
        workingDir migrationRunDirectory
        systemProperty 'orespawn.migrationFamily', project.findProperty('migrationFamily') ?: 'unspecified'
        systemProperty 'orespawn.migrationPhase', project.findProperty('migrationPhase') ?: 'fresh'
        doFirst { classpath = runServer.classpath }
        doLast {
            String phase = project.findProperty('migrationPhase') ?: 'fresh'
            File marker = new File(migrationRunDirectory, 'world/orespawn4-migration-probe.properties')
            if (!marker.isFile()) throw new GradleException("Migration probe did not produce ${marker}")
            Properties values = new Properties(); marker.withInputStream { values.load(it) }
            if (values.getProperty("${phase}_complete") != 'true') {
                throw new GradleException("Migration ${phase} phase did not complete: ${marker}")
            }
            File latest = new File(migrationRunDirectory, 'logs/latest.log')
            if (latest.isFile() && (latest.text.contains('Migration audit failed')
                    || latest.text.contains('Encountered an unexpected exception'))) {
                throw new GradleException("Migration ${phase} phase logged a server failure: ${latest}")
            }
        }
    }
}

def legacyFixtureArtifacts = file("${rootDir}/../migration-fixtures/sources/artifacts")
def os1AbiFixtureClasses = file("${buildDir}/legacy-abi/os1/classes")
def os3AbiFixtureClasses = file("${buildDir}/legacy-abi/os3/classes")

task compileOs1AbiFixture(type: JavaCompile) {
    source fileTree('src/os1AbiFixture/java')
    classpath = files(sourceSets.main.compileClasspath,
            new File(legacyFixtureArtifacts, 'OreSpawn_1.10.2-1.1.0.jar'))
    destinationDir = os1AbiFixtureClasses
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
}

task os1AbiFixtureJar(type: Jar, dependsOn: compileOs1AbiFixture) {
    archiveName = 'os1abiprobe.jar'
    destinationDir = file("${buildDir}/legacy-abi/os1")
    from os1AbiFixtureClasses
    from 'src/os1AbiFixture/resources'
}

task compileOs3AbiFixture(type: JavaCompile) {
    source fileTree('src/os3AbiFixture/java')
    classpath = files(sourceSets.main.compileClasspath,
            new File(legacyFixtureArtifacts, 'OreSpawn-1.10.2-3.2.2.104.jar'))
    destinationDir = os3AbiFixtureClasses
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
}

task os3AbiFixtureJar(type: Jar, dependsOn: compileOs3AbiFixture) {
    archiveName = 'os3abiprobe.jar'
    destinationDir = file("${buildDir}/legacy-abi/os3")
    from os3AbiFixtureClasses
    from 'src/os3AbiFixture/resources'
}

def configureLegacyAbiProcess = { String generation, Task fixtureJar, String markerName ->
    File runDirectory = file("${buildDir}/legacy-abi/${generation}/run")
    Task prepare = tasks.create("prepare${generation.capitalize()}AbiRun", Copy) {
        dependsOn fixtureJar
        into new File(runDirectory, 'mods')
        from fixtureJar.archivePath
        doFirst { project.delete(runDirectory) }
        doLast {
            new File(runDirectory, 'eula.txt').setText('eula=true\n', 'UTF-8')
            new File(runDirectory, 'server.properties').setText(
                    'eula=true\nonline-mode=false\nlevel-name=world\nlevel-seed=zsjpxah\n' +
                    'spawn-animals=false\nspawn-monsters=false\n', 'UTF-8')
        }
    }
    tasks.create("${generation}AbiIntegrationProcess", JavaExec) {
        group = 'verification'
        dependsOn prepare
        dependsOn { runServer.taskDependencies.getDependencies(runServer) }
        main = runServer.main
        args runServer.args
        workingDir runDirectory
        doFirst { classpath = runServer.classpath }
        doLast {
            File marker = new File(runDirectory, "world/${markerName}")
            if (!marker.isFile() || !marker.text.contains('registered=true')) {
                throw new GradleException("${generation.toUpperCase()} binary ABI probe did not complete: ${marker}")
            }
            File latest = new File(runDirectory, 'logs/latest.log')
            if (latest.isFile() && latest.text.contains('Encountered an unexpected exception')) {
                throw new GradleException("${generation.toUpperCase()} binary ABI probe logged a server failure")
            }
        }
    }
}

configureLegacyAbiProcess('os1', os1AbiFixtureJar, 'os1-abi-probe.properties')
configureLegacyAbiProcess('os3', os3AbiFixtureJar, 'os3-abi-probe.properties')

task legacyAbiIntegrationTest {
    group = 'verification'
    dependsOn os1AbiIntegrationProcess, os3AbiIntegrationProcess
}

def clientIntegrationClasses = file("${buildDir}/client-integration-fixture/classes")
task compileClientIntegrationTestMod(type: JavaCompile, dependsOn: classes) {
    source fileTree('src/clientIntegrationTest/java')
    classpath = files(sourceSets.main.output, sourceSets.main.compileClasspath)
    destinationDir = clientIntegrationClasses
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
}

task clientIntegrationTestModJar(type: Jar, dependsOn: compileClientIntegrationTestMod) {
    archiveName = 'clientprobe.jar'
    destinationDir = file("${buildDir}/client-integration-fixture")
    from clientIntegrationClasses
    from 'src/clientIntegrationTest/resources'
}

def clientIntegrationRunDirectory = file("${buildDir}/client-integration-run")
task prepareClientIntegrationTest(dependsOn: clientIntegrationTestModJar) {
    doLast {
        delete clientIntegrationRunDirectory
        clientIntegrationRunDirectory.mkdirs()
        copy {
            from clientIntegrationTestModJar.archivePath
            into new File(clientIntegrationRunDirectory, 'mods')
        }
        new File(clientIntegrationRunDirectory, 'options.txt').setText(
                'fullscreen:false\nforceUnicodeFont:false\nguiScale:2\n' +
                'renderDistance:4\nshowSubtitles:false\n', 'UTF-8')
    }
}

task clientIntegrationProcess(type: JavaExec, dependsOn: prepareClientIntegrationTest) {
    group = 'verification'
    dependsOn { runClient.taskDependencies.getDependencies(runClient) }
    main = runClient.main
    args runClient.args
    workingDir clientIntegrationRunDirectory
    systemProperty 'clientprobe.enabled', 'true'
    doFirst { classpath = runClient.classpath }
    doLast {
        File marker = new File(clientIntegrationRunDirectory, 'client-smoke-pass.properties')
        if (!marker.isFile()) {
            throw new GradleException("Client integration completion marker is missing: ${marker}")
        }
        Properties result = new Properties(); marker.withInputStream { result.load(it) }
        if (result.getProperty('reload_rendered') != 'true'
                || result.getProperty('world_settings_opened') != 'true'
                || Integer.parseInt(result.getProperty('editor_routes', '0')) < 5) {
            throw new GradleException("Client integration result is incomplete: ${marker}")
        }
        File latest = new File(clientIntegrationRunDirectory, 'logs/fml-client-latest.log')
        if (latest.isFile() && (latest.text.contains('Encountered an unexpected exception')
                || latest.text.contains('Reported exception thrown!'))) {
            throw new GradleException("Client integration logged a runtime failure: ${latest}")
        }
    }
}

task syncForge12EclipseIntegrationLaunches {
    group = 'ide'
    doLast {
        def writeGradleLaunch = { String fileName, String displayName, String arguments ->
            File launch = file(fileName)
            String escapedArguments = arguments
                    .replace('&', '&amp;')
                    .replace('"', '&quot;')
            launch.setText("""<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"no\"?>
<launchConfiguration type=\"org.eclipse.ui.externaltools.ProgramLaunchConfigurationType\">
<stringAttribute key=\"org.eclipse.debug.core.ATTR_REFRESH_SCOPE\" value=\"${'$'}{workspace}\"/>
<stringAttribute key=\"org.eclipse.ui.externaltools.ATTR_LOCATION\" value=\"${'$'}{project_loc}\\gradlew.bat\"/>
<stringAttribute key=\"org.eclipse.ui.externaltools.ATTR_TOOL_ARGUMENTS\" value=\"${escapedArguments}\"/>
<stringAttribute key=\"org.eclipse.ui.externaltools.ATTR_WORKING_DIRECTORY\" value=\"${'$'}{project_loc}\"/>
<stringAttribute key=\"org.eclipse.ui.externaltools.ATTR_LAUNCH_CONFIGURATION_BUILD_SCOPE\" value=\"${'$'}{project}\"/>
<stringAttribute key=\"org.eclipse.ui.externaltools.ATTR_NAME\" value=\"${displayName}\"/>
</launchConfiguration>
""", 'UTF-8')
        }

        writeGradleLaunch('OreSpawn_Surface_FreshReload.launch',
                'OreSpawn surface fresh/reload gate',
                'surfaceIntegrationTest --offline --no-daemon')
        writeGradleLaunch('OreSpawn_Migration_Fresh.launch',
                'OreSpawn migration fresh gate',
                'migrationIntegrationProcess --offline --no-daemon ' +
                '-PmigrationRunDir=build/eclipse-migration-run ' +
                '-PmigrationFamily=eclipse-manual -PmigrationPhase=fresh')
        writeGradleLaunch('OreSpawn_Migration_Reload.launch',
                'OreSpawn migration reload gate',
                'migrationIntegrationProcess --offline --no-daemon ' +
                '-PmigrationRunDir=build/eclipse-migration-run ' +
                '-PmigrationFamily=eclipse-manual -PmigrationPhase=reload')
        writeGradleLaunch('OreSpawn_Client_FreshReload.launch',
                'OreSpawn client world and editor fresh/reload gate',
                'clientIntegrationProcess --offline --no-daemon')
    }
}

tasks.matching { it.name == 'eclipse' }.all {
    finalizedBy syncForge12EclipseIntegrationLaunches
}

if (project.hasProperty('benchmarkRunDir')) {
    def benchmarkRunDirectory = file(project.property('benchmarkRunDir'))
    task prepareWorldgenBenchmark {
        doLast {
            delete benchmarkRunDirectory
            benchmarkRunDirectory.mkdirs()
            new File(benchmarkRunDirectory, 'eula.txt').setText('eula=true\n', 'UTF-8')
            new File(benchmarkRunDirectory, 'server.properties').setText(
                    'online-mode=false\nlevel-name=world\nlevel-type=default\n' +
                    "level-seed=${project.findProperty('benchmarkSeed') ?: '-4965128775892001975'}\n" +
                    'generate-structures=false\nspawn-animals=false\nspawn-monsters=false\n' +
                    'max-tick-time=-1\n', 'UTF-8')
        }
    }
    task benchmarkIntegrationProcess(type: JavaExec, dependsOn: prepareWorldgenBenchmark) {
        group = 'verification'
        dependsOn { runServer.taskDependencies.getDependencies(runServer) }
        main = runServer.main
        args runServer.args
        workingDir benchmarkRunDirectory
        systemProperty 'orespawn.worldgenBenchmarkMode', project.findProperty('benchmarkMode') ?: 'sky'
        systemProperty 'orespawn.worldgenBenchmarkRadius', project.findProperty('benchmarkRadius') ?: '4'
        systemProperty 'orespawn.worldgenBenchmarkRepetitions', project.findProperty('benchmarkRepetitions') ?: '3'
        systemProperty 'orespawn.worldgenBenchmarkCenterX', project.findProperty('benchmarkCenterX') ?: '256'
        systemProperty 'orespawn.worldgenBenchmarkCenterZ', project.findProperty('benchmarkCenterZ') ?: '256'
        systemProperty 'orespawn.worldgenBenchmarkCenterStep', project.findProperty('benchmarkCenterStep') ?: '64'
        systemProperty 'orespawn.worldgenBenchmarkStopServer', 'true'
        systemProperty 'orespawn.worldgenBenchmarkVanillaOres',
                project.findProperty('benchmarkVanillaOres') ?: 'false'
        systemProperty 'orespawn.worldgenBenchmarkOreAudit',
                project.findProperty('benchmarkOreAudit') ?: 'false'
        if (project.hasProperty('benchmarkBlockAudit')) {
            systemProperty 'orespawn.worldgenBenchmarkBlockAudit', project.property('benchmarkBlockAudit')
        }
        doFirst { classpath = runServer.classpath }
        doLast {
            File latest = new File(benchmarkRunDirectory, 'logs/fml-server-latest.log')
            String mode = project.findProperty('benchmarkMode') ?: 'sky'
            if (!latest.isFile() || !latest.text.contains("ORESPAWN_BENCHMARK summary mode=${mode}")) {
                throw new GradleException("Missing ${mode} worldgen benchmark summary: ${latest}")
            }
            if (latest.text.contains('Encountered an unexpected exception')
                    || latest.text.contains('Tried to assign a mutable BlockPos')) {
                throw new GradleException("Worldgen benchmark logged a runtime failure: ${latest}")
            }
        }
    }
}

task sourcesJar(type: Jar, dependsOn: classes) {
    classifier = 'sources'
    from sourceSets.main.allSource
}

task apiJar(type: Jar, dependsOn: classes) {
    classifier = 'api'
    from sourceSets.main.output
    include 'zone/moddev/mc/orespawn/api/**'
    include 'com/mcmoddev/orespawn/api/**'
    include 'com/mojang/serialization/**'
    include 'cyano/orespawn/**'
}

task deobfJar(type: Jar, dependsOn: classes) {
    classifier = 'deobf'
    from sourceSets.main.output
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    classifier = 'javadoc'
    from javadoc.destinationDir
}

artifacts {
    archives apiJar
    archives deobfJar
    archives sourcesJar
    archives javadocJar
}

jar {
    manifest {
        attributes([
                'Specification-Title'      : 'OreSpawn',
                'Specification-Vendor'     : 'SkyBlade1978',
                'Specification-Version'    : '1',
                'Implementation-Title'     : project.name,
                'Implementation-Version'   : version,
                'Implementation-Vendor'    : 'SkyBlade1978',
                'Implementation-Timestamp' : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'OreSpawn-API-Version'      : '1',
                'FMLAT'                     : 'accesstransformer.cfg'
        ])
    }
    finalizedBy 'reobfJar'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand version: project.version, mcversion: project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
    from('docs/AGENTS.md') {
        into ''
        rename { 'AGENTS.md' }
    }
    from('docs') {
        into 'META-INF/orespawn/docs'
    }
}

javadoc {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
            artifact apiJar
            artifact deobfJar
            artifact sourcesJar
            artifact javadocJar
        }
    }
    repositories {
        maven { url "file:///${project.projectDir}/mcmodsrepo" }
    }
}
