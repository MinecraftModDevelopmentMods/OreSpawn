plugins {
    id 'eclipse'
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "OreSpawn-${minecraft_version}-neoforge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    withJavadocJar()
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

def configureBenchmark = { run, String radius, String repetitions, String center ->
    if (!providers.gradleProperty('orespawnBenchmarkMode').isPresent()) {
        return
    }
    run.systemProperty 'orespawn.worldgenBenchmarkMode',
            providers.gradleProperty('orespawnBenchmarkMode').get()
    run.systemProperty 'orespawn.worldgenBenchmarkRadius',
            providers.gradleProperty('orespawnBenchmarkRadius').getOrElse(radius)
    run.systemProperty 'orespawn.worldgenBenchmarkRepetitions',
            providers.gradleProperty('orespawnBenchmarkRepetitions').getOrElse(repetitions)
    run.systemProperty 'orespawn.worldgenBenchmarkVanillaOres',
            providers.gradleProperty('orespawnBenchmarkVanillaOres').getOrElse('false')
    run.systemProperty 'orespawn.worldgenBenchmarkOreAudit',
            providers.gradleProperty('orespawnBenchmarkOreAudit').getOrElse('false')
    run.systemProperty 'orespawn.worldgenBenchmarkFluidAudit',
            providers.gradleProperty('orespawnBenchmarkFluidAudit').getOrElse('false')
    if (providers.gradleProperty('orespawnBenchmarkBiomeAudit').isPresent()) {
        run.systemProperty 'orespawn.worldgenBenchmarkBiomeAudit',
                providers.gradleProperty('orespawnBenchmarkBiomeAudit').get()
    }
    if (providers.gradleProperty('orespawnBenchmarkBlockAudit').isPresent()) {
        run.systemProperty 'orespawn.worldgenBenchmarkBlockAudit',
                providers.gradleProperty('orespawnBenchmarkBlockAudit').get()
    }
    run.systemProperty 'orespawn.worldgenBenchmarkCenterX',
            providers.gradleProperty('orespawnBenchmarkCenterX').getOrElse(center)
    run.systemProperty 'orespawn.worldgenBenchmarkCenterZ',
            providers.gradleProperty('orespawnBenchmarkCenterZ').getOrElse(center)
    run.systemProperty 'orespawn.worldgenBenchmarkCenterStep',
            providers.gradleProperty('orespawnBenchmarkCenterStep').getOrElse('64')
    run.systemProperty 'orespawn.worldgenBenchmarkDimension',
            providers.gradleProperty('orespawnBenchmarkDimension').getOrElse('overworld')
    if (providers.gradleProperty('orespawnBenchmarkBiomeType').isPresent()) {
        run.systemProperty 'orespawn.worldgenBenchmarkBiomeType',
                providers.gradleProperty('orespawnBenchmarkBiomeType').get()
    }
    run.systemProperty 'orespawn.worldgenBenchmarkStopServer', 'true'
    if (providers.gradleProperty('worldgenJfrFile').isPresent()) {
        run.jvmArgument "-XX:StartFlightRecording=filename=${providers.gradleProperty('worldgenJfrFile').get()},settings=profile,dumponexit=true"
    }
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run')
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        argument '--nogui'
        configureBenchmark(delegate, '8', '5', '1024')
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        configureBenchmark(delegate, '4', '3', '256')
    }

    data {
        workingDirectory project.layout.projectDirectory.dir('run-data')
        arguments.addAll '--mod', mod_id, '--all', '--output',
                file('src/generated/resources/').absolutePath, '--existing',
                file('src/main/resources/').absolutePath
    }

    ['Fresh', 'Reload'].each { String phase ->
        register("biomeIntegration${phase}") {
            runType 'server'
            workingDirectory layout.buildDirectory.dir('biome-integration-run')
            systemProperty 'forge.logging.console.level', 'info'
            systemProperty 'cakeworld.biomeIntegrationPhase', phase.toLowerCase(Locale.ROOT)
            argument '--nogui'
            modSource project.sourceSets.main
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.named('processResources', ProcessResources).configure {
    from('docs/AGENTS.md') {
        into ''
        rename { 'AGENTS.md' }
    }
    from('docs') {
        into 'META-INF/orespawn/docs'
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'      : 'OreSpawn',
                'Specification-Vendor'     : 'SkyBlade1978',
                'Specification-Version'    : '1',
                'Implementation-Title'     : project.name,
                'Implementation-Version'   : project.jar.archiveVersion,
                'Implementation-Vendor'    : 'SkyBlade1978',
                'Implementation-Timestamp' : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'OreSpawn-API-Version'     : '1',
                'OreSpawn-Loader'          : 'neoforge'
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifactId = "OreSpawn-${minecraft_version}-neoforge"
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('javadoc', Javadoc).configure {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

def biomeIntegrationClasses = layout.buildDirectory.dir('biome-integration-fixture/classes')
def compileBiomeIntegrationTestMod = tasks.register('compileBiomeIntegrationTestMod', JavaCompile) {
    dependsOn tasks.named('classes')
    source fileTree('src/biomeIntegrationTest/java')
    classpath = files(sourceSets.main.output, sourceSets.main.compileClasspath)
    destinationDirectory.set(biomeIntegrationClasses)
    javaCompiler.set(javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
    })
    options.release = 21
    options.encoding = 'UTF-8'
}

def biomeIntegrationTestModJar = tasks.register('biomeIntegrationTestModJar', Jar) {
    dependsOn compileBiomeIntegrationTestMod
    archiveFileName = 'cakeworldprobe.jar'
    destinationDirectory = layout.buildDirectory.dir('biome-integration-fixture')
    from biomeIntegrationClasses
    from 'src/biomeIntegrationTest/resources'
}

def biomeIntegrationRunDirectory = layout.buildDirectory.dir('biome-integration-run')
def prepareBiomeIntegrationTest = tasks.register('prepareBiomeIntegrationTest') {
    dependsOn biomeIntegrationTestModJar
    doLast {
        File runDirectory = biomeIntegrationRunDirectory.get().asFile
        delete runDirectory
        runDirectory.mkdirs()
        copy {
            from biomeIntegrationTestModJar.flatMap { it.archiveFile }
            into biomeIntegrationRunDirectory.map { it.dir('mods') }
        }
        new File(runDirectory, 'server.properties').setText('''\
level-name=biome-integration-world
level-seed=-4965128775892001975
level-type=minecraft:normal
online-mode=false
allow-nether=true
generate-structures=false
spawn-protection=0
max-tick-time=-1
''', 'UTF-8')
    }
}

tasks.configureEach {
    if (name == 'runBiomeIntegrationFresh') {
        dependsOn prepareBiomeIntegrationTest
    } else if (name == 'runBiomeIntegrationReload') {
        dependsOn 'runBiomeIntegrationFresh'
    }
}

def biomeIntegrationTest = tasks.register('biomeIntegrationTest') {
    group = 'verification'
    description = 'Verifies a provider-owned custom biome in fresh and reloaded normal terrain.'
    dependsOn 'runBiomeIntegrationReload'
    doLast {
        File marker = biomeIntegrationRunDirectory.get().file(
                'biome-integration-world/cakeworld-biome-integration.properties').asFile
        if (!marker.isFile()) {
            throw new GradleException("Biome integration completion marker is missing: ${marker}")
        }
        Properties result = new Properties()
        marker.withInputStream { result.load(it) }
        if (result.getProperty('reload_verified') != 'true') {
            throw new GradleException("Biome integration reload was not verified: ${marker}")
        }
        File eulaFile = biomeIntegrationRunDirectory.get().file('eula.txt').asFile
        if (eulaFile.exists()) {
            throw new GradleException("Biome integration test unexpectedly created an EULA file: ${eulaFile}")
        }
        logger.lifecycle('Custom-biome integration verified: {} chunks, {} top blocks, {} filler blocks, fresh + reload',
                result.getProperty('matching_chunks'), result.getProperty('pink_surface'),
                result.getProperty('white_filler'))
    }
}

tasks.named('check') {
    dependsOn biomeIntegrationTest
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

eclipse {
    project {
        natures 'org.eclipse.buildship.core.gradleprojectnature'
        buildCommand 'org.eclipse.buildship.core.gradleprojectbuilder'
    }
    classpath {
        file {
            whenMerged { classpath ->
                def libraryPaths = new LinkedHashSet<String>()
                classpath.entries = classpath.entries.findAll { entry ->
                    !(entry instanceof org.gradle.plugins.ide.eclipse.model.Library)
                            || libraryPaths.add(entry.path)
                }
            }
        }
    }
}

tasks.named('eclipse').configure {
    doLast {
        String requestedGradleHome = System.getenv('GRADLE_USER_HOME')
        if (requestedGradleHome == null || requestedGradleHome.trim().isEmpty()) {
            return
        }

        File preferencesFile = file('.settings/org.eclipse.buildship.core.prefs')
        Properties preferences = new Properties()
        if (preferencesFile.isFile()) {
            preferencesFile.withInputStream { preferences.load(it) }
        }
        String gradleHome = file(requestedGradleHome).canonicalPath
        preferences.setProperty('eclipse.preferences.version', '1')
        preferences.setProperty('connection.gradle.distribution', 'GRADLE_DISTRIBUTION(WRAPPER)')
        preferences.setProperty('override.workspace.settings', 'true')
        preferences.setProperty('gradle.user.home', gradleHome)
        preferences.setProperty('connection.gradle.user.home', gradleHome)
        preferences.setProperty('java.home', System.getProperty('java.home'))
        preferencesFile.parentFile.mkdirs()
        preferencesFile.withOutputStream {
            preferences.store(it, 'Generated by the OreSpawn Eclipse task to keep NeoGradle launch modules on one cache.')
        }
    }
}
