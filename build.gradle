tasks.register('verifyReleaseConfiguration') {
    group = 'verification'
    doLast {
        if (project.mod_version != '4.0.15.2601022'
                || project.mod_group_id != expectedMavenGroup
                || project.minecraft_version != '26.1.2'
                || project.neo_version != '26.1.2.94') {
            throw new GradleException('Unexpected OreSpawn NeoForge 26.1.2 release identity')
        }
        if (project.loader_name != 'neoforge' || project.loader_code != '2'
                || project.java_version != '25' || project.gradle_java_version != '25'
                || project.java_toolchain_version != '25.0.3+9') {
            throw new GradleException('Unexpected dispatcher or Java target metadata')
        }
        List<String> expectedPublicArtifacts = [
                'OreSpawn-4.0.15.2601022.jar',
                'OreSpawn-4.0.15.2601022-sources.jar',
                'OreSpawn-4.0.15.2601022-javadoc.jar'
        ]
        if (base.archivesName.get() != expectedMavenArtifact
                || expectedReleaseFiles.get().collect { it.toString() } != expectedPublicArtifacts) {
            throw new GradleException('Public artifacts must use the version-only OreSpawn filename contract')
        }
        String ciWorkflow = file('.github/workflows/ci.yml').getText('UTF-8')
        expectedPublicArtifacts.each { artifactName ->
            if (!ciWorkflow.contains("build/libs/${artifactName}")) {
                throw new GradleException("CI does not upload expected public artifact ${artifactName}")
            }
        }
        [
                'src/main/java/zone/moddev/mc/orespawn/worldgen/LegacyConfigMigrator.java',
                'src/main/java/zone/moddev/mc/orespawn/worldgen/LegacyMineralogyProfileMigration.java',
                'README.md', 'CHANGELOG.txt'
        ].each { path ->
            if (!file(path).getText('UTF-8').contains(project.mod_version)) {
                throw new GradleException("Release identity missing from ${path}")
            }
        }
        if (!file('docs/API.md').getText('UTF-8').contains('versionRange="[4.0.6,5.0.0)"')) {
            throw new GradleException('Consumer compatibility floor must remain [4.0.6,5.0.0)')
        }
    }
}

def trackedDocumentationDirectory = file('docs')
def documentationFiles = {
    fileTree(trackedDocumentationDirectory).files.findAll { it.isFile() }.collect {
        trackedDocumentationDirectory.canonicalFile.toPath().relativize(it.canonicalFile.toPath())
                .toString().replace('\\', '/') }.sort()
}
def assertDocumentationTree = { File root, List<String> expected, String label ->
    List<String> actual = root.isDirectory() ? fileTree(root).files.findAll { it.isFile() }
            .collect { root.canonicalFile.toPath().relativize(it.canonicalFile.toPath())
                    .toString().replace('\\', '/') }.sort() : []
    if (actual != expected) {
        throw new GradleException("${label} documentation set ${actual} does not match tracked ${expected}")
    }
    expected.each { relative ->
        if (!java.util.Arrays.equals(new File(trackedDocumentationDirectory, relative).bytes,
                new File(root, relative).bytes)) {
            throw new GradleException("${label}/${relative} differs from tracked documentation")
        }
    }
}

def prepareEclipseResources = tasks.register('prepareEclipseResources', Sync) {
    dependsOn tasks.named('processResources')
    from layout.buildDirectory.dir('resources/main')
    into file('bin/main')
}

def verifyDocumentationParity = tasks.register('verifyDocumentationParity') {
    group = 'verification'
    dependsOn prepareBundledDocumentation
    dependsOn tasks.named('processResources')
    dependsOn prepareEclipseResources
    dependsOn releaseJar
    doLast {
        List<String> expected = documentationFiles()
        if (expected.size() != 21 || !expected.contains('VERSIONS.md')) {
            throw new GradleException("Expected exactly 21 tracked guide files including VERSIONS.md, found ${expected}")
        }
        assertDocumentationTree(bundledDocumentationDirectory.asFile, expected, 'generated resources')
        assertDocumentationTree(new File(layout.buildDirectory.dir('resources/main').get().asFile,
                'META-INF/orespawn/docs'), expected, 'processed resources')
        assertDocumentationTree(file('bin/main/META-INF/orespawn/docs'), expected, 'Eclipse bin/main')
        new ZipFile(releaseJar.get().archiveFile.get().asFile).withCloseable { zip ->
            expected.each { relative ->
                def entry = zip.getEntry("META-INF/orespawn/docs/${relative}")
                if (entry == null || !java.util.Arrays.equals(
                        new File(trackedDocumentationDirectory, relative).bytes,
                        zip.getInputStream(entry).withCloseable { it.bytes })) {
                    throw new GradleException("Release jar documentation differs at ${relative}")
                }
            }
        }
    }
}

tasks.register('verifyReleaseArtifacts') {
    group = 'verification'
    dependsOn tasks.named('verifyReleaseConfiguration')
    dependsOn verifyDocumentationParity
    dependsOn tasks.named('assemble')
    dependsOn tasks.named('verifyLegacyOracleIsolation')
    doLast {
        File libs = layout.buildDirectory.dir('libs').get().asFile
        List<File> jars = (libs.listFiles() ?: [] as File[])
                .findAll { it.name.endsWith('.jar') }.sort { it.name }
        List<String> expected = expectedReleaseFiles.get().collect { it.toString() }.sort()
        if (jars.collect { it.name } != expected) {
            throw new GradleException("Expected exactly ${expected}, found ${jars*.name}")
        }
        jars.each { candidate ->
            if (candidate.length() == 0L) throw new GradleException("Empty artifact ${candidate}")
            new ZipFile(candidate).withCloseable { zip ->
                zip.entries().findAll { entry ->
                    !entry.isDirectory() && (archiveTextSuffixes.any { entry.name.endsWith(it) }
                            || entry.name.endsWith('/element-list')
                            || entry.name.endsWith('/package-list'))
                }.each { entry ->
                    boolean cr = zip.getInputStream(entry).withCloseable {
                        input -> input.bytes.any { value -> value == 13 }
                    }
                    if (cr) throw new GradleException("${candidate.name}!/${entry.name} is not LF-normalized")
                }
                [
                        'src/test/', 'src/biomeIntegrationTest/', 'src/clientIntegrationTest/',
                        'src/benchmarkIntegrationTest/', 'agent-notes/', 'surfaceprobe',
                        'clientprobe', 'benchmarkprobe', 'ci-fixtures/', 'net/minecraftforge/',
                        'META-INF/mods.toml', 'org/junit/', 'org/mockito/', 'net/bytebuddy/',
                        'Mineralogy-1.18.2-5.4.0.jar'
                ].each { forbidden ->
                    if (zip.entries().any { it.name.contains(forbidden) }) {
                        throw new GradleException("${candidate.name} contains forbidden ${forbidden}")
                    }
                }
            }
        }

        File mainJar = new File(libs, expectedReleaseFiles.get()[0])
        new ZipFile(mainJar).withCloseable { zip ->
            List<String> names = zip.entries().collect { it.name }
            [
                    'META-INF/neoforge.mods.toml',
                    'META-INF/accesstransformer.cfg',
                    'zone/moddev/mc/orespawn/api/OreSpawnApi.class',
                    'META-INF/orespawn/docs/VERSIONS.md',
                    'META-INF/orespawn/docs/schemas/orespawn-provider.schema.json',
                    'AGENTS.md'
            ].each { required ->
                if (!names.contains(required)) throw new GradleException("Release jar is missing ${required}")
            }
            String metadata = zip.getInputStream(zip.getEntry('META-INF/neoforge.mods.toml'))
                    .getText(StandardCharsets.UTF_8.name())
            if (!metadata.contains('modId="orespawn"')
                    || !metadata.contains("version=\"${project.version}\"")
                    || !metadata.contains('versionRange="[26.1.2.94,26.1.3)"')) {
                throw new GradleException('Packaged NeoForge metadata is incorrect')
            }
            String transformer = zip.getInputStream(zip.getEntry('META-INF/accesstransformer.cfg'))
                    .getText(StandardCharsets.UTF_8.name())
            List<String> actualRules = transformer.readLines()
                    .collect { it.replaceFirst(/\s*#.*/, '').trim() }.findAll { !it.isEmpty() }
            List<String> expectedRules = [
                    'public-f net.minecraft.world.level.chunk.ChunkGenerator biomeSource',
                    'public-f net.minecraft.world.level.levelgen.NoiseBasedChunkGenerator globalFluidPicker',
                    'public-f net.minecraft.world.level.biome.Biome generationSettings',
                    'public-f net.minecraft.world.level.levelgen.feature.configurations.SpringConfiguration validBlocks',
                    'public net.minecraft.client.gui.screens.worldselection.CreateWorldScreen tabManager',
                    'public net.minecraft.client.gui.screens.worldselection.CreateWorldScreen tabNavigationBar'
            ]
            if (actualRules != expectedRules) {
                throw new GradleException("Unexpected packaged official-named access transformer: ${actualRules}")
            }
            def manifestEntry = zip.getEntry('META-INF/MANIFEST.MF')
            def manifest = manifestEntry == null ? null :
                    new Manifest(zip.getInputStream(manifestEntry)).mainAttributes
            if (manifest == null
                    || manifest.getValue('Implementation-Version') != project.mod_version
                    || manifest.getValue('OreSpawn-API-Version') != '1'
                    || manifest.getValue('OreSpawn-Loader') != 'neoforge'
                    || manifest.getValue('Maven-Artifact') != expectedMavenCoordinate
                    || manifest.getValue('Implementation-Timestamp') != null) {
                throw new GradleException('Release manifest is incorrect or volatile')
            }
            zip.entries().findAll { it.name.endsWith('.class') }.each { entry ->
                byte[] header = zip.getInputStream(entry).withCloseable { it.readNBytes(8) }
                int major = ((header[6] & 0xff) << 8) | (header[7] & 0xff)
                if (major != 69) throw new GradleException("${entry.name} uses class major ${major}, expected 69")
            }
        }
        new ZipFile(new File(libs, expectedReleaseFiles.get()[1])).withCloseable { zip ->
            if (zip.getEntry('zone/moddev/mc/orespawn/OreSpawn.java') == null) {
                throw new GradleException('Sources jar is missing OreSpawn.java')
            }
        }
        new ZipFile(new File(libs, expectedReleaseFiles.get()[2])).withCloseable { zip ->
            if (zip.getEntry('index.html') == null
                    || zip.getEntry('zone/moddev/mc/orespawn/api/OreSpawnApi.html') == null) {
                throw new GradleException('Javadoc jar is missing its index or public OreSpawn API page')
            }
        }
    }
}

tasks.register('writeReleaseChecksums') {
    group = 'verification'
    dependsOn tasks.named('verifyReleaseArtifacts')
    def outputFile = layout.buildDirectory.file('release/SHA256SUMS')
    outputs.file outputFile
    doLast {
        File output = outputFile.get().asFile
        output.parentFile.mkdirs()
        File libs = layout.buildDirectory.dir('libs').get().asFile
        String contents = expectedReleaseFiles.get().sort().collect { name ->
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            new File(libs, name).withInputStream { input ->
                byte[] buffer = new byte[8192]
                for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
                    if (read > 0) digest.update(buffer, 0, read)
                }
            }
            "${digest.digest().encodeHex().toString().toUpperCase()}  ${name}"
        }.join('\n') + '\n'
        output.setText(contents, 'UTF-8')
    }
}

tasks.register('verifyPreparedReleaseArtifacts') {
    group = 'verification'
    doLast {
        if (!preparedReleaseDir.isPresent()) throw new GradleException('preparedReleaseDir is required')
        File prepared = file(preparedReleaseDir.get())
        List<String> expected = expectedReleaseFiles.get().collect { it.toString() }.sort()
        List<File> jars = (prepared.listFiles() ?: [] as File[])
                .findAll { it.name.endsWith('.jar') }.sort { it.name }
        if (jars.collect { it.name } != expected || jars.any { it.length() == 0L }) {
            throw new GradleException("Prepared release jars ${jars*.name} do not match ${expected}")
        }
        File checksums = new File(prepared, 'SHA256SUMS')
        if (!checksums.isFile() || !new File(prepared, 'CHANGELOG.txt').isFile()) {
            throw new GradleException('Prepared release is missing checksums or changelog')
        }
    }
}

def mavenUploadUrl = providers.environmentVariable('MAVEN_UPLOAD_URL')
        .orElse('https://invalid.invalid/missing-maven-upload-url')
def mavenUploadUsername = providers.environmentVariable('MAVEN_UPLOAD_USERNAME')
def mavenUploadPassword = providers.environmentVariable('MAVEN_UPLOAD_PASSWORD')
publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = expectedMavenGroup
            artifactId = expectedMavenArtifact
            version = project.version.toString()
            if (preparedReleaseDir.isPresent()) {
                File prepared = file(preparedReleaseDir.get())
                artifact(new File(prepared, expectedReleaseFiles.get()[0]))
                artifact(new File(prepared, expectedReleaseFiles.get()[1])) { classifier = 'sources' }
                artifact(new File(prepared, expectedReleaseFiles.get()[2])) { classifier = 'javadoc' }
            } else {
                from components.java
            }
            pom {
                name = 'MMD OreSpawn'
                description = project.mod_description
                url = 'https://github.com/MinecraftModDevelopmentMods/OreSpawn'
                licenses {
                    license {
                        name = 'GNU Lesser General Public License, Version 2.1'
                        url = 'https://www.gnu.org/licenses/old-licenses/lgpl-2.1.txt'
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'release'
            url = uri(mavenUploadUrl.get())
            credentials {
                username = mavenUploadUsername.orNull ?: ''
                password = mavenUploadPassword.orNull ?: ''
            }
        }
    }
}

tasks.register('verifyMavenCoordinates') {
    group = 'verification'
    dependsOn tasks.named('generatePomFileForMavenJavaPublication')
    doLast {
        File pomFile = layout.buildDirectory.file(
                'publications/mavenJava/pom-default.xml').get().asFile
        def pom = new XmlSlurper(false, false).parse(pomFile)
        def actual = [pom.groupId.text(), pom.artifactId.text(), pom.version.text()]
        def expected = [expectedMavenGroup, expectedMavenArtifact, project.version.toString()]
        if (project.group.toString() != expectedMavenGroup || actual != expected) {
            throw new GradleException("Expected Maven coordinate ${expected.join(':')}, found ${actual.join(':')}")
        }
    }
}

tasks.register('validateMavenReleaseCredentials') {
    group = 'publishing'
    doLast {
        if (!providers.environmentVariable('MAVEN_UPLOAD_URL').isPresent()
                || !mavenUploadUsername.isPresent() || !mavenUploadPassword.isPresent()) {
            throw new GradleException(
                    'MAVEN_UPLOAD_URL, MAVEN_UPLOAD_USERNAME, and MAVEN_UPLOAD_PASSWORD are required')
        }
        if (providers.environmentVariable('MAVEN_UPLOAD_URL').get().startsWith('file:')) {
            throw new GradleException('Release publication must use a remote repository')
        }
    }
}
tasks.withType(PublishToMavenRepository).configureEach {
    dependsOn tasks.named('validateMavenReleaseCredentials')
    dependsOn tasks.named('verifyMavenCoordinates')
    dependsOn preparedReleaseDir.isPresent()
            ? tasks.named('verifyPreparedReleaseArtifacts')
            : tasks.named('verifyReleaseArtifacts')
}

tasks.register('verifyCommandPortability') {
    group = 'verification'
    description = 'Rejects shell-specific wrappers in generic Gradle task execution.'
    doLast {
        List<File> commandSources = [file('build.gradle')]
        commandSources.addAll(fileTree('.github/workflows') { include '*.yml', '*.yaml' }.files)
        commandSources.each { File source ->
            String text = source.getText('UTF-8')
            if (text =~ /(?i)(?:commandLine|executable)\s*[^\n]*(?:cmd(?:\.exe)?\s+\/c|powershell(?:\.exe)?\s+-command|(?:bash|sh)\s+-c)/) {
                throw new GradleException("Shell-specific command wrapper in ${source}")
            }
        }
    }
}

tasks.register('verifyColdNeoForgeBootstrapContract') {
    group = 'verification'
    description = 'Verifies that CI qualifies NeoGradle from an isolated Java 25 cache without Forge tooling.'
    doLast {
        String workflow = file('.github/workflows/ci.yml').getText('UTF-8')
        [
                'Cold NeoForge bootstrap',
                'orespawn-neoforge-cold-cache',
                '--no-build-cache',
                '--offline',
                "java-version: '25.0.3+9.0.LTS'"
        ].each { required ->
            if (!workflow.contains(required)) {
                throw new GradleException("Cold NeoForge bootstrap is missing ${required}")
            }
        }
        ['MinecraftMavenizer', 'mavenizer', 'java-version: \'21',
                'java-version: \'8', 'net.minecraftforge.gradle'].each { forbidden ->
            if (workflow.contains(forbidden)) {
                throw new GradleException("Cold NeoForge bootstrap contains Forge-only tooling: ${forbidden}")
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyCommandPortability')
    dependsOn tasks.named('verifyMavenCoordinates')
    dependsOn tasks.named('verifyColdNeoForgeBootstrapContract')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

eclipse {
    project {
        natures 'org.eclipse.buildship.core.gradleprojectnature'
        buildCommand 'org.eclipse.buildship.core.gradleprojectbuilder'
    }
    classpath {
        downloadSources = true
        downloadJavadoc = true
        defaultOutputDir = file('bin/default')
        file {
            whenMerged { classpath ->
                def libraryPaths = new LinkedHashSet<String>()
                classpath.entries = classpath.entries.findAll { entry ->
                    !(entry instanceof org.gradle.plugins.ide.eclipse.model.Library)
                            || libraryPaths.add(entry.path)
                }
                classpath.entries.findAll { entry ->
                    entry instanceof org.gradle.plugins.ide.eclipse.model.Output
                }.each { entry ->
                    entry.path = 'bin/default'
                }
                classpath.entries.removeAll { entry ->
                    entry instanceof org.gradle.plugins.ide.eclipse.model.SourceFolder
                            && ['src/main/resources', 'src/generated/resources'].contains(entry.path)
                }
                if (!classpath.entries.any { entry -> entry.path == 'build/resources/main' }) {
                    classpath.entries.add(new org.gradle.plugins.ide.eclipse.model.SourceFolder(
                            'build/resources/main', 'bin/main'))
                }
                classpath.entries.findAll { entry ->
                    entry instanceof org.gradle.plugins.ide.eclipse.model.SourceFolder
                }.each { entry ->
                    if (entry.path == 'build/resources/main' || entry.path == 'src/main/java') {
                        entry.output = 'bin/main'
                    } else if (entry.path.startsWith('src/test/')) {
                        entry.output = 'bin/test'
                    }
                }
            }
        }
    }
    synchronizationTasks 'prepareEclipseResources'
}

tasks.named('eclipse').configure {
    dependsOn prepareEclipseResources
    doLast {
        String requestedGradleHome = System.getenv('GRADLE_USER_HOME')
        if (requestedGradleHome == null || requestedGradleHome.trim().isEmpty()) {
            return
        }

        File preferencesFile = file('.settings/org.eclipse.buildship.core.prefs')
        Properties preferences = new Properties()
        if (preferencesFile.isFile()) {
            preferencesFile.withInputStream { preferences.load(it) }
        }
        String gradleHome = file(requestedGradleHome).canonicalPath
        preferences.setProperty('eclipse.preferences.version', '1')
        preferences.setProperty('connection.gradle.distribution', 'GRADLE_DISTRIBUTION(WRAPPER)')
        preferences.setProperty('override.workspace.settings', 'true')
        preferences.setProperty('gradle.user.home', gradleHome)
        preferences.setProperty('connection.gradle.user.home', gradleHome)
        preferences.setProperty('java.home', System.getProperty('java.home'))
        preferencesFile.parentFile.mkdirs()
        preferencesFile.withOutputStream {
            preferences.store(it, 'Generated by the OreSpawn Eclipse task to keep NeoGradle launch modules on one cache.')
        }
    }
}

tasks.register('verifyEclipseProductionClasspath') {
    group = 'verification'
    dependsOn tasks.named('eclipse')
    dependsOn tasks.named('verifyLegacyOracleIsolation')
    doLast {
        File prefs = file('.settings/org.eclipse.buildship.core.prefs')
        if (!prefs.isFile()) throw new GradleException('Missing Buildship preferences')
        Properties preferences = new Properties()
        prefs.withInputStream { preferences.load(it) }
        if (preferences.getProperty('override.workspace.settings') != 'true') {
            throw new GradleException('Eclipse Buildship workspace override is not active')
        }
        File eclipseClasspath = file('.classpath')
        if (!eclipseClasspath.isFile()) throw new GradleException('Eclipse .classpath was not generated')
        String classpathText = eclipseClasspath.getText('UTF-8')
        if (!classpathText.contains('path="build/resources/main"')
                || classpathText.contains('path="src/main/resources"')
                || classpathText.contains('path="src/generated/resources"')) {
            throw new GradleException('Eclipse must consume only Gradle-processed production resources')
        }
        def classpathXml = new XmlSlurper(false, false).parse(eclipseClasspath)
        String defaultOutput = classpathXml.classpathentry
                .find { it.@kind.text() == 'output' }.@path.text()
        Map<String, String> expectedSourceOutputs = [
                'src/main/java'        : 'bin/main',
                'build/resources/main' : 'bin/main',
                'src/test/java'        : 'bin/test',
                'src/test/resources'   : 'bin/test'
        ]
        List<String> invalidSourceOutputs = classpathXml.classpathentry
                .findAll { it.@kind.text() == 'src' }
                .collect { [it.@path.text(), it.@output.text()] }
                .findAll { pair ->
                    String expected = expectedSourceOutputs[pair[0]]
                    expected != null && pair[1] != expected
                }
                .collect { pair -> "${pair[0]} -> ${pair[1]}" }
        boolean nestedOutput = classpathXml.classpathentry
                .findAll { it.@kind.text() == 'src' && !it.@output.text().isEmpty() }
                .any { entry ->
                    String output = entry.@output.text()
                    output == defaultOutput || output.startsWith(defaultOutput + '/')
                }
        if (defaultOutput != 'bin/default' || !invalidSourceOutputs.isEmpty()
                || nestedOutput || classpathText.contains('output="build/sourceSets')) {
            throw new GradleException(
                    "Eclipse outputs must be disjoint bin/default, bin/main and bin/test " +
                    "directories; default=${defaultOutput}, invalid=${invalidSourceOutputs}")
        }
        ['META-INF/neoforge.mods.toml', 'META-INF/orespawn/docs/README.md',
                'META-INF/orespawn/docs/VERSIONS.md'].each { relative ->
            if (!new File('bin/main', relative).isFile()) {
                throw new GradleException("Eclipse output is missing ${relative}")
            }
        }
        File metadata = file('bin/main/META-INF/neoforge.mods.toml')
        String metadataText = metadata.getText('UTF-8')
        if (metadataText.contains('\${mod_version}')
                || !metadataText.contains("version=\"${project.version}\"")) {
            throw new GradleException('Eclipse output contains unexpanded NeoForge metadata')
        }
        List<String> forbidden = [
                'src/test', 'bin/test', 'build/classes/java/test',
                'biomeIntegrationTest', 'clientIntegrationTest', 'benchmarkIntegrationTest',
                'surfaceprobe', 'clientprobe', 'benchmarkprobe', 'junit-', 'opentest4j-',
                'Mineralogy-1.18.2-5.4.0.jar', 'net.minecraftforge', 'META-INF/mods.toml',
                'C:\\Users\\John'
        ]
        fileTree(project.projectDir) { include 'run*.launch' }.files.each { launch ->
            List<String> leaked = forbidden.findAll { launch.getText('UTF-8').contains(it) }
            if (!leaked.isEmpty()) {
                throw new GradleException("${launch.name} exposes test/Forge/local content: ${leaked}")
            }
        }
    }
}
