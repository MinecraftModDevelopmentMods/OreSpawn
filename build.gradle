buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '3.+', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = mod_version
group = mod_group_id
archivesBaseName = "OreSpawn-${minecraft_version}"

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: project.mapping_channel, version: project.mapping_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                orespawn { source sourceSets.main }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--nogui'
            mods {
                orespawn { source sourceSets.main }
            }
        }

        data {
            workingDirectory project.file('run-data')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                orespawn { source sourceSets.main }
            }
        }

        surfaceIntegrationFresh {
            workingDirectory project.file("${buildDir}/surface-integration-run")
            property 'forge.logging.console.level', 'info'
            property 'surfaceprobe.integrationPhase', 'fresh'
            args '--nogui'
            mods {
                orespawn { source sourceSets.main }
            }
        }

        surfaceIntegrationReload {
            workingDirectory project.file("${buildDir}/surface-integration-run")
            property 'forge.logging.console.level', 'info'
            property 'surfaceprobe.integrationPhase', 'reload'
            args '--nogui'
            mods {
                orespawn { source sourceSets.main }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

def configureForge31Run = { JavaExec runTask, String launchTarget ->
    runTask.main = 'net.minecraftforge.userdev.LaunchTesting'
    runTask.environment 'target', launchTarget
    runTask.environment 'MCP_MAPPINGS', "${mapping_channel}_${mapping_version}"
    runTask.environment 'MCP_VERSION', mcp_version
    runTask.environment 'FORGE_VERSION', forge_version
    runTask.environment 'FORGE_GROUP', 'net.minecraftforge'
    runTask.environment 'MC_VERSION', minecraft_version
    runTask.environment 'MOD_CLASSES', "${mod_id}%%${sourceSets.main.output.classesDirs.singleFile};" +
            "${mod_id}%%${sourceSets.main.output.resourcesDir}"
}

tasks.withType(JavaExec).all { JavaExec runTask ->
    Map<String, String> targets = [
            runClient: 'fmluserdevclient',
            runServer: 'fmluserdevserver',
            runData: 'fmluserdevdata',
            runSurfaceIntegrationFresh: 'fmluserdevserver',
            runSurfaceIntegrationReload: 'fmluserdevserver'
    ]
    String launchTarget = targets.get(runTask.name)
    if (launchTarget != null) {
        configureForge31Run(runTask, launchTarget)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    testCompile 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testCompile 'org.junit.jupiter:junit-jupiter-params:5.10.2'
    testRuntime 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntime 'org.junit.platform:junit-platform-launcher:1.10.2'
}

task sourcesJar(type: Jar, dependsOn: classes) {
    classifier = 'sources'
    from sourceSets.main.allSource
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    classifier = 'javadoc'
    from javadoc.destinationDir
}

artifacts {
    archives sourcesJar
    archives javadocJar
}

jar {
    manifest {
        attributes([
                'Specification-Title'       : 'OreSpawn',
                'Specification-Vendor'      : 'SkyBlade1978',
                'Specification-Version'     : '1',
                'Implementation-Title'      : project.name,
                'Implementation-Version'    : version,
                'Implementation-Vendor'     : 'SkyBlade1978',
                'Implementation-Timestamp'  : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'OreSpawn-API-Version'       : '1'
        ])
    }
    finalizedBy 'reobfJar'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', minecraft_version
    inputs.property 'forge_version_range', forge_version_range
    inputs.property 'loader_version_range', loader_version_range
    inputs.property 'minecraft_version_range', minecraft_version_range

    filesMatching('META-INF/mods.toml') {
        expand([
                version: project.version,
                minecraft_version: minecraft_version,
                forge_version_range: forge_version_range,
                loader_version_range: loader_version_range,
                minecraft_version_range: minecraft_version_range
        ])
    }
    from('docs/AGENTS.md') {
        into ''
        rename { 'AGENTS.md' }
    }
    from('docs') {
        into 'META-INF/orespawn/docs'
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
            artifact sourcesJar
            artifact javadocJar
        }
    }
    repositories {
        maven { url "file:///${project.projectDir}/mcmodsrepo" }
    }
}

tasks.withType(JavaCompile) {
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '1000']
}

javadoc {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

test {
    useJUnitPlatform()
    // Unit tests inspect target files relative to the checkout, but they do
    // not need Forge's rolling runtime files. A console-only test logger keeps
    // them from contending with Eclipse/client logs in this working directory.
    systemProperty 'log4j.configurationFile', file('src/test/resources/log4j2-test.xml').absolutePath
    // Loaded only through an isolated URLClassLoader by the parity test. This
    // is deliberately not a Gradle dependency and cannot leak into Eclipse or
    // a published OreSpawn jar.
    File mineralogy5Oracle = file('../../MinecraftMineralogy 115/MinecraftMineralogy/build/libs/Mineralogy-1.15.2-5.1.1.jar')
    if (mineralogy5Oracle.isFile()) {
        systemProperty 'orespawn.mineralogy5Oracle', mineralogy5Oracle.absolutePath
    }
}

// A Forge process is not green merely because it returns exit code zero. The
// loader can log a worldgen/linkage failure and still shut down normally.
def acceptedForge31LogNoise = [
        ~/FML appears to be missing any signature data/,
        ~/Found multiple arguments for option fml\.mcVersion/,
        ~/Found multiple arguments for option fml\.forgeVersion/,
        ~/\/FATAL\] \[net\.minecraftforge\.common\.ForgeConfig\/CORE\]: Forge config just got changed on the file system!$/,
        ~/\/FATAL\] \[net\.minecraftforge\.fml\.packs\.ModFileResourcePack\/\]: Failed to clean up tempdir /
]

def runtimeCrashSnapshot = { File runDirectory ->
    File crashDirectory = new File(runDirectory, 'crash-reports')
    if (!crashDirectory.isDirectory()) return [] as Set
    return fileTree(crashDirectory) { include '**/*' }.files
            .findAll { it.isFile() }.collect { it.absolutePath } as Set
}

def assertRuntimeLogsClean = { File runDirectory, String context, Set priorCrashes ->
    File crashDirectory = new File(runDirectory, 'crash-reports')
    if (crashDirectory.isDirectory()) {
        def crashes = fileTree(crashDirectory) { include '**/*' }.files
                .findAll { it.isFile() && !priorCrashes.contains(it.absolutePath) }
        if (!crashes.isEmpty()) {
            throw new GradleException("${context} produced crash report ${crashes.first()}")
        }
    }

    File logsDirectory = new File(runDirectory, 'logs')
    if (!logsDirectory.isDirectory()) return
    def failures = []
    [new File(logsDirectory, 'latest.log'), new File(logsDirectory, 'debug.log')]
            .findAll { it.isFile() }.each { File log ->
        int lineNumber = 0
        log.eachLine('UTF-8') { String line ->
            lineNumber++
            boolean unexpectedSeverity = line ==~ /.*\/(?:ERROR|FATAL)\].*/
            boolean knownNoise = acceptedForge31LogNoise.any { line =~ it }
            boolean fatalText = line.contains('Encountered an unexpected exception') ||
                    line.contains('Exception stopping the server') ||
                    line.contains('Migration audit failed') ||
                    line.contains('java.lang.Error:') ||
                    line.contains('NoSuchMethodError') ||
                    line.contains('NoClassDefFoundError') ||
                    line.contains('ExceptionInInitializerError') ||
                    line.contains('Tried to assign a mutable BlockPos') ||
                    line.contains('causing cascading worldgen lag')
            if ((unexpectedSeverity && !knownNoise) || fatalText) {
                failures.add("${log.name}:${lineNumber}: ${line}")
            }
        }
    }
    if (!failures.isEmpty()) {
        throw new GradleException("${context} logged unexpected errors:\n"
                + failures.take(20).join('\n'))
    }
}

task runtimeLogScannerTest {
    group = 'verification'
    description = 'Proves runtime log validation accepts documented Forge noise and rejects real failures.'
    doLast {
        File probe = file("${buildDir}/runtime-log-scanner-test")
        delete probe
        File logs = new File(probe, 'logs'); logs.mkdirs()
        new File(logs, 'latest.log').setText(
                '[main/ERROR] [FML]: FML appears to be missing any signature data\n'
                + '[Server thread/INFO] [FML]: Done\n', 'UTF-8')
        assertRuntimeLogsClean(probe, 'scanner-accepted-noise-probe', [] as Set)
        new File(logs, 'latest.log').setText(
                '[Server thread/WARN]: Tried to assign a mutable BlockPos to tick data...\n', 'UTF-8')
        boolean rejected = false
        try { assertRuntimeLogsClean(probe, 'scanner-mutable-position-probe', [] as Set) }
        catch (GradleException expected) { rejected = true }
        if (!rejected) throw new GradleException('Runtime log scanner accepted a mutable BlockPos leak')
        new File(logs, 'latest.log').setText(
                '[Server thread/DEBUG] [FML]: Minecraft loaded a new chunk while populating another, causing cascading worldgen lag.\n', 'UTF-8')
        rejected = false
        try { assertRuntimeLogsClean(probe, 'scanner-cascading-probe', [] as Set) }
        catch (GradleException expected) { rejected = true }
        if (!rejected) throw new GradleException('Runtime log scanner accepted cascading worldgen')
        new File(logs, 'latest.log').setText(
                '[Server thread/ERROR] [example]: Unexpected fixture failure\n', 'UTF-8')
        rejected = false
        try { assertRuntimeLogsClean(probe, 'scanner-severity-probe', [] as Set) }
        catch (GradleException expected) { rejected = true }
        if (!rejected) throw new GradleException('Runtime log scanner accepted an unexpected ERROR line')
        delete probe
    }
}

check.dependsOn runtimeLogScannerTest

task verifyMineralogyOracleIsolation {
    group = 'verification'
    description = 'Prevents published Mineralogy engines from leaking into Gradle configurations or ordinary Eclipse launches.'
    doLast {
        configurations.each { configuration ->
            if (configuration.canBeResolved &&
                    configuration.files.any { it.name ==~ /Mineralogy-.*\.jar/ }) {
                throw new GradleException("Mineralogy oracle leaked into Gradle configuration ${configuration.name}")
            }
        }
    }
}

check.dependsOn verifyMineralogyOracleIsolation

['runClient', 'runServer', 'runData'].each { String taskName ->
    tasks.matching { it.name == taskName }.all { JavaExec runTask ->
        doFirst {
            new File(runTask.workingDir, 'mods').mkdirs()
            runTask.ext.oreSpawnCrashSnapshot = runtimeCrashSnapshot(runTask.workingDir)
        }
        doLast {
            assertRuntimeLogsClean(runTask.workingDir, taskName,
                    runTask.ext.oreSpawnCrashSnapshot as Set)
        }
    }
}

def surfaceIntegrationClasses = file("${buildDir}/surface-integration-fixture/classes")
task compileSurfaceIntegrationTestMod(type: JavaCompile, dependsOn: classes) {
    source fileTree('src/biomeIntegrationTest/java')
    classpath = files(sourceSets.main.output, sourceSets.main.compileClasspath)
    destinationDir = surfaceIntegrationClasses
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
}

task surfaceIntegrationTestModJar(type: Jar, dependsOn: compileSurfaceIntegrationTestMod) {
    archiveName = 'surfaceprobe.jar'
    destinationDir = file("${buildDir}/surface-integration-fixture")
    from surfaceIntegrationClasses
    from 'src/biomeIntegrationTest/resources'
}

def surfaceIntegrationRunDirectory = file("${buildDir}/surface-integration-run")
task prepareSurfaceIntegrationTest(dependsOn: surfaceIntegrationTestModJar) {
    doLast {
        delete surfaceIntegrationRunDirectory
        surfaceIntegrationRunDirectory.mkdirs()
        copy {
            from surfaceIntegrationTestModJar.archivePath
            into new File(surfaceIntegrationRunDirectory, 'mods')
        }
        new File(surfaceIntegrationRunDirectory, 'server.properties').setText('''\
level-name=surface-integration-world
level-seed=zsjpxah
level-type=default
online-mode=false
allow-nether=true
generate-structures=false
spawn-protection=0
max-tick-time=-1
''', 'UTF-8')
        new File(surfaceIntegrationRunDirectory, 'eula.txt').setText('eula=true\n', 'UTF-8')
    }
}

tasks.matching { it.name == 'runSurfaceIntegrationFresh' }.all {
    dependsOn prepareSurfaceIntegrationTest
}

def createSurfaceProcess = { String phase, Object dependency ->
    task("surfaceIntegration${phase}Process", type: Exec, dependsOn: [dependency, "prepareRunSurfaceIntegration${phase}"]) {
        group = 'verification'
        doFirst {
            JavaExec runTask = tasks.getByName("runSurfaceIntegration${phase}") as JavaExec
            File classpathJar = file("${buildDir}/surface-integration-fixture/${phase.toLowerCase()}-classpath.jar")
            classpathJar.parentFile.mkdirs()
            java.util.jar.Manifest manifest = new java.util.jar.Manifest()
            manifest.mainAttributes.put(java.util.jar.Attributes.Name.MANIFEST_VERSION, '1.0')
            manifest.mainAttributes.put(java.util.jar.Attributes.Name.CLASS_PATH,
                    runTask.classpath.files.collect { it.toURI().toASCIIString() }.join(' '))
            classpathJar.withOutputStream { output ->
                new java.util.jar.JarOutputStream(output, manifest).close()
            }
            List<String> arguments = []
            arguments.addAll(runTask.allJvmArgs)
            int classpathFlag = arguments.lastIndexOf('-cp')
            if (classpathFlag < 0) {
                classpathFlag = arguments.lastIndexOf('-classpath')
            }
            if (classpathFlag >= 0 && classpathFlag + 1 < arguments.size()) {
                arguments.remove(classpathFlag + 1)
                arguments.remove(classpathFlag)
            }
            arguments.add('-cp')
            arguments.add(classpathJar.absolutePath)
            arguments.add(runTask.main ?: 'net.minecraftforge.userdev.LaunchTesting')
            arguments.addAll(runTask.args)
            workingDir runTask.workingDir
            environment runTask.environment
            File javaExecutable = new File(System.getProperty('java.home'), 'bin/java.exe')
            String command = 'call "' + javaExecutable.absolutePath + '" ' +
                    arguments.collect { '"' + it.toString().replace('"', '""') + '"' }.join(' ')
            commandLine 'cmd.exe', '/d', '/s', '/c', command
        }
    }
}

def surfaceIntegrationFreshProcess = createSurfaceProcess('Fresh', prepareSurfaceIntegrationTest)
surfaceIntegrationFreshProcess.doLast {
    File marker = new File(surfaceIntegrationRunDirectory,
            'surface-integration-world/surfaceprobe-integration.properties')
    if (!marker.isFile()) {
        throw new GradleException("Fresh surface integration completion marker is missing: ${marker}")
    }
    assertRuntimeLogsClean(surfaceIntegrationRunDirectory,
            'surface integration fresh phase', [] as Set)
}
def surfaceIntegrationReloadProcess = createSurfaceProcess('Reload', surfaceIntegrationFreshProcess)
surfaceIntegrationReloadProcess.doLast {
    assertRuntimeLogsClean(surfaceIntegrationRunDirectory,
            'surface integration reload phase', [] as Set)
}

task surfaceIntegrationTest(dependsOn: surfaceIntegrationReloadProcess) {
    group = 'verification'
    doLast {
        File marker = new File(surfaceIntegrationRunDirectory,
                'surface-integration-world/surfaceprobe-integration.properties')
        Properties result = new Properties()
        marker.withInputStream { result.load(it) }
        if (result.getProperty('reload_verified') != 'true') {
            throw new GradleException("Surface integration reload was not verified: ${marker}")
        }
        logger.lifecycle('Provider surfaces and exact-biome geology verified: {} dimensions, {} columns each, fresh + reload',
                result.getProperty('dimensions'), result.getProperty('columns_per_dimension'))
    }
}

check.dependsOn surfaceIntegrationTest

task syncForge31EclipseLaunches(dependsOn: compileSurfaceIntegrationTestMod) {
    group = 'ide'
    doLast {
        String mainClass = 'net.minecraftforge.userdev.LaunchTesting'
        String mainOutput = new File(projectDir, 'bin/main').absolutePath
        String fixtureOutput = surfaceIntegrationClasses.absolutePath
        String fixtureResources = new File(projectDir, 'src/biomeIntegrationTest/resources').absolutePath
        String fixtureModClasses = "${mod_id}%%${mainOutput};${mod_id}%%${mainOutput};" +
                "surfaceprobe%%${fixtureOutput};surfaceprobe%%${fixtureResources}"
        String environmentEntries =
                "    <mapEntry key=\"MCP_MAPPINGS\" value=\"${mapping_channel}_${mapping_version}\"/>\r\n" +
                "    <mapEntry key=\"MCP_VERSION\" value=\"${mcp_version}\"/>\r\n" +
                "    <mapEntry key=\"FORGE_VERSION\" value=\"${forge_version}\"/>\r\n" +
                "    <mapEntry key=\"FORGE_GROUP\" value=\"net.minecraftforge\"/>\r\n" +
                "    <mapEntry key=\"target\" value=\"fmluserdevserver\"/>\r\n" +
                "    <mapEntry key=\"MC_VERSION\" value=\"${minecraft_version}\"/>\r\n"
        ['Client', 'Server', 'Data'].each { String runName ->
            File launch = file("run${runName}.launch")
            if (!launch.isFile()) {
                throw new GradleException("Missing generated Eclipse launch: ${launch}")
            }
            String text = launch.getText('UTF-8')
            if (!text.contains('org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE')) {
                text = text.replace('</launchConfiguration>',
                        '    <booleanAttribute key="org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE" value="true"/>\r\n' +
                        '</launchConfiguration>')
            }
            launch.setText(text, 'UTF-8')
        }
        ['Fresh', 'Reload'].each { String phase ->
            File launch = file("runSurfaceIntegration${phase}.launch")
            if (!launch.isFile()) {
                throw new GradleException("Missing generated Eclipse launch: ${launch}")
            }
            String text = launch.getText('UTF-8')
            text = text.replace(
                    '<stringAttribute key="org.eclipse.jdt.launching.MAIN_TYPE" value=""/>',
                    "<stringAttribute key=\"org.eclipse.jdt.launching.MAIN_TYPE\" value=\"${mainClass}\"/>")
            text = text.replaceFirst(
                    /<mapEntry key="MOD_CLASSES" value="[^"]*"\/>/,
                    java.util.regex.Matcher.quoteReplacement(
                            "<mapEntry key=\"MOD_CLASSES\" value=\"${fixtureModClasses}\"/>"))
            if (!text.contains('key="target"')) {
                text = text.replace('    <mapEntry key="MOD_CLASSES"',
                        environmentEntries + '    <mapEntry key="MOD_CLASSES"')
            }
            launch.setText(text, 'UTF-8')
        }
    }
}

task verifyForge31EclipseLaunchIsolation {
    group = 'verification'
    doLast {
        ['runClient.launch', 'runServer.launch', 'runData.launch'].each { String launchName ->
            File launch = file(launchName)
            String launchText = launch.getText('UTF-8')
            if (launchText.contains('Mineralogy-') || launchText.contains('biomeIntegrationTest') ||
                    !launchText.contains('org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE')) {
                throw new GradleException("Ordinary Eclipse launch is not isolated from test oracles: ${launch}")
            }
        }
    }
}

syncForge31EclipseLaunches.finalizedBy verifyForge31EclipseLaunchIsolation

tasks.matching { it.name == 'genEclipseRuns' }.all {
    finalizedBy syncForge31EclipseLaunches
}
