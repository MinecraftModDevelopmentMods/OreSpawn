def configureLegacyAbiProcess = { String generation, Task fixtureJar, String markerName ->
    File runDirectory = file("${buildDir}/legacy-abi/${generation}/run")
    Task prepare = tasks.create("prepare${generation.capitalize()}AbiRun", Copy) {
        dependsOn fixtureJar
        into new File(runDirectory, 'mods')
        from fixtureJar.archiveFile
        doFirst { project.delete(runDirectory) }
        doLast {
            new File(runDirectory, 'eula.txt').setText('eula=true\n', 'UTF-8')
            new File(runDirectory, 'server.properties').setText(
                    'eula=true\nonline-mode=false\nlevel-name=world\nlevel-seed=zsjpxah\n' +
                    'spawn-animals=false\nspawn-monsters=false\n', 'UTF-8')
        }
    }
    tasks.create("${generation}AbiIntegrationProcess", JavaExec) {
        group = 'verification'
        dependsOn prepare
        workingDir runDirectory
        configureFromForgeRun(delegate, 'runServer')
        doLast {
            File marker = new File(runDirectory, "world/${markerName}")
            if (!marker.isFile() || !marker.text.contains('registered=true')) {
                throw new GradleException("${generation.toUpperCase()} binary ABI probe did not complete: ${marker}")
            }
            File latest = new File(runDirectory, 'logs/latest.log')
            if (latest.isFile() && latest.text.contains('Encountered an unexpected exception')) {
                throw new GradleException("${generation.toUpperCase()} binary ABI probe logged a server failure")
            }
        }
    }
}

