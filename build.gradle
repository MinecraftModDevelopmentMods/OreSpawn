task surfaceIntegrationTest(dependsOn: surfaceIntegrationReloadProcess) {
    group = 'verification'
    doLast {
        File marker = new File(surfaceIntegrationRunDirectory,
                'surface-integration-world/surfaceprobe-integration.properties')
        Properties result = new Properties()
        marker.withInputStream { result.load(it) }
        if (result.getProperty('reload_verified') != 'true') {
            throw new GradleException("Surface integration reload was not verified: ${marker}")
        }
        logger.lifecycle('Provider surfaces and exact-biome geology verified: {} dimensions, {} columns each, fresh + reload',
                result.getProperty('dimensions'), result.getProperty('columns_per_dimension'))
    }
}

