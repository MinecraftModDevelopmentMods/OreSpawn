eclipse {
    classpath {
        downloadSources = true
        downloadJavadoc = true
        defaultOutputDir = file('bin/default')
        file.whenMerged { classpath ->
            // ForgeGradle 7 models Forge 65's merged Gradle output as
            // build/sourceSets with main/test children. Eclipse rejects a
            // source output nested below the default output, so keep Gradle's
            // merged directories as inputs while compiling Eclipse sources to
            // the conventional disjoint bin outputs.
            classpath.entries.findAll { entry ->
                entry instanceof org.gradle.plugins.ide.eclipse.model.Output
            }.each { entry ->
                entry.path = 'bin/default'
            }
            classpath.entries.removeAll { entry ->
                entry instanceof org.gradle.plugins.ide.eclipse.model.SourceFolder
                        && ['src/main/resources', 'src/generated/resources'].contains(entry.path)
            }
            String resourcesPath = processedMainResourcesPath()
            if (!classpath.entries.any { entry -> entry.path == resourcesPath }) {
                classpath.entries.add(new org.gradle.plugins.ide.eclipse.model.SourceFolder(
                        resourcesPath, 'bin/main'))
            }
            classpath.entries.findAll { entry ->
                entry instanceof org.gradle.plugins.ide.eclipse.model.SourceFolder
            }.each { entry ->
                if (entry.path == resourcesPath || entry.path == 'src/main/java') {
                    entry.output = 'bin/main'
                } else if (entry.path.startsWith('src/test/')) {
                    entry.output = 'bin/test'
                }
            }
        }
    }
    synchronizationTasks 'isolateEclipseProductionRuns'
}
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
