def prepareBundledDocumentation = tasks.register('prepareBundledDocumentation', Sync) {
    group = 'build'
    description = 'Stages public documentation as a generated production resource tree.'
    from('docs')
    into(bundledDocumentationDirectory)
}

sourceSets.main.resources {
    // Eclipse rebuilds bin/main from declared resource source folders. Keeping
    // the generated documentation in the source set prevents a Buildship
    // refresh from silently removing the guide copied by processResources.
    srcDir 'src/generated/resources'
}
def processedMainResourcesDirectory = { sourceSets.main.output.resourcesDir }
def processedMainResourcesPath = {
    project.relativePath(processedMainResourcesDirectory()).replace('\\', '/')
}

// ForgeGradle's merged Eclipse output and Gradle 9 cannot safely share the
// JavaCompile and ProcessResources output directory. Compile into staging,
// then copy classes into the merged mod root after resources are ready.
def compiledMainClasses = layout.buildDirectory.dir('compiled-classes/main')
tasks.named('compileJava', JavaCompile).configure {
    destinationDirectory.set(compiledMainClasses)
}
def mergeMainClasses = tasks.register('mergeMainClasses') {
    dependsOn tasks.named('compileJava'), tasks.named('processResources')
    doLast {
        project.copy {
            from compiledMainClasses
            into sourceSets.main.output.resourcesDir
        }
    }
}
tasks.named('classes').configure { dependsOn mergeMainClasses }

def compiledTestClasses = layout.buildDirectory.dir('compiled-classes/test')
tasks.named('compileTestJava', JavaCompile).configure {
    destinationDirectory.set(compiledTestClasses)
}
def mergeTestClasses = tasks.register('mergeTestClasses') {
    dependsOn tasks.named('compileTestJava'), tasks.named('processTestResources')
    doLast {
        project.copy {
            from compiledTestClasses
            into sourceSets.test.output.resourcesDir
