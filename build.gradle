task syncForge25EclipseLaunches(dependsOn: compileSurfaceIntegrationTestMod) {
    group = 'ide'
    doLast {
        String mainClass = 'net.minecraftforge.userdev.LaunchTesting'
        String mainOutput = new File(projectDir, 'bin/main').absolutePath
		String ordinaryModClasses = "${mod_id}%%${mainOutput};${mod_id}%%${mainOutput}"
        String fixtureOutput = surfaceIntegrationClasses.absolutePath
        String fixtureResources = new File(projectDir, 'src/biomeIntegrationTest/resources').absolutePath
        String fixtureModClasses = "${mod_id}%%${mainOutput};${mod_id}%%${mainOutput};" +
                "surfaceprobe%%${fixtureOutput};surfaceprobe%%${fixtureResources}"
        def environmentEntries = { String launchTarget ->
                "    <mapEntry key=\"MCP_MAPPINGS\" value=\"${mapping_channel}_${mapping_version}\"/>\r\n" +
                "    <mapEntry key=\"MCP_VERSION\" value=\"${mcp_version}\"/>\r\n" +
                "    <mapEntry key=\"FORGE_VERSION\" value=\"${forge_version}\"/>\r\n" +
                "    <mapEntry key=\"FORGE_GROUP\" value=\"net.minecraftforge\"/>\r\n" +
                "    <mapEntry key=\"target\" value=\"${launchTarget}\"/>\r\n" +
                "    <mapEntry key=\"MC_VERSION\" value=\"${minecraft_version}\"/>\r\n"
		}
		['Client', 'Server', 'Data'].each { String runName ->
			File launch = file("run${runName}.launch")
			if (!launch.isFile()) {
				throw new GradleException("Missing generated Eclipse launch: ${launch}")
			}
			String text = launch.getText('UTF-8')
			if (text.contains('<mapAttribute key="org.eclipse.debug.core.environmentVariables"/>')) {
				String launchTarget = [Client: 'fmluserdevclient', Server: 'fmluserdevserver',
						Data: 'fmluserdevdata'][runName]
				text = text.replace(
						'<mapAttribute key="org.eclipse.debug.core.environmentVariables"/>',
						'<mapAttribute key="org.eclipse.debug.core.environmentVariables">\r\n' +
						environmentEntries(launchTarget) +
						"    <mapEntry key=\"MOD_CLASSES\" value=\"${ordinaryModClasses}\"/>\r\n" +
						'</mapAttribute>')
			}
			text = text.replace(
					'<stringAttribute key="org.eclipse.jdt.launching.MAIN_TYPE" value=""/>',
					"<stringAttribute key=\"org.eclipse.jdt.launching.MAIN_TYPE\" value=\"${mainClass}\"/>")
			text = text.replaceFirst(
					/<mapEntry key="MOD_CLASSES" value="[^"]*"\/>/,
					java.util.regex.Matcher.quoteReplacement(
							"<mapEntry key=\"MOD_CLASSES\" value=\"${ordinaryModClasses}\"/>"))
			if (!text.contains('key="target"')) {
				String launchTarget = [Client: 'fmluserdevclient', Server: 'fmluserdevserver',
						Data: 'fmluserdevdata'][runName]
				text = text.replace('    <mapEntry key="MOD_CLASSES"',
						environmentEntries(launchTarget) + '    <mapEntry key="MOD_CLASSES"')
			}
			if (!text.contains('org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE')) {
				text = text.replace('</launchConfiguration>',
						'    <booleanAttribute key="org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE" value="true"/>\r\n' +
						'</launchConfiguration>')
			}
			launch.setText(text, 'UTF-8')
		}
        ['Fresh', 'Reload'].each { String phase ->
            File launch = file("runSurfaceIntegration${phase}.launch")
            if (!launch.isFile()) {
                throw new GradleException("Missing generated Eclipse launch: ${launch}")
            }
            String text = launch.getText('UTF-8')
            text = text.replace(
                    '<stringAttribute key="org.eclipse.jdt.launching.MAIN_TYPE" value=""/>',
                    "<stringAttribute key=\"org.eclipse.jdt.launching.MAIN_TYPE\" value=\"${mainClass}\"/>")
            text = text.replaceFirst(
                    /<mapEntry key="MOD_CLASSES" value="[^"]*"\/>/,
                    java.util.regex.Matcher.quoteReplacement(
                            "<mapEntry key=\"MOD_CLASSES\" value=\"${fixtureModClasses}\"/>"))
            if (!text.contains('key="target"')) {
                text = text.replace('    <mapEntry key="MOD_CLASSES"',
                        environmentEntries('fmluserdevserver') + '    <mapEntry key="MOD_CLASSES"')
            }
            launch.setText(text, 'UTF-8')
        }
    }
}

