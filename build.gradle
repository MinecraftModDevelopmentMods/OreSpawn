def mavenizerSourcePatch = mavenizerToolsDirectory.file(
        'minecraft-mavenizer-0.5.21-orespawn-compat.patch')
def mavenizerLicense = mavenizerToolsDirectory.file('LICENSE-MAVENIZER.txt')
def mavenizerReadme = mavenizerToolsDirectory.file('README.md')
def mavenizerFixtureChecksums = [
        (mavenizerCompatibilityJar.asFile):
                '019032A4A26ECB473D403EF017054D5892CE59A9904E8831B452287CD756397E',
        (mavenizerRuleManifest.asFile):
                '7F669F225520D0382E76991A8A3E5E4020840F0FA975F7DCB86681D7E7C3F766',
        (mavenizerSourcePatch.asFile):
                '84FEA234619CC2D1931E609B22B6E5D96F59366F7D6C2783C3BEE0F726F3E876',
        (mavenizerLicense.asFile):
                '20C17D8B8C48A600800DFD14F95D5CB9FF47066A9641DDEAB48DC54AEC96E331',
        (mavenizerReadme.asFile):
                '45C527DD0EDF0E366F585D0E46F2E572CA8AD9CA9D798D03D27A92438FA6AF8E'
]

// ForgeGradle invokes Mavenizer during project configuration. Verify the
// executable and its exact target rules before any Mavenizer code can run.
[mavenizerCompatibilityJar.asFile, mavenizerRuleManifest.asFile].each { fixture ->
    if (!fixture.isFile()) {
        throw new GradleException("Missing Mavenizer compatibility fixture: ${fixture}")
    }
    String actual = sha256Of(fixture)
    String expected = mavenizerFixtureChecksums[fixture]
    if (actual != expected) {
        throw new GradleException("Mavenizer compatibility fixture checksum mismatch for " +
                "${fixture.name}: expected ${expected}, found ${actual}")
    }
}

fgtools.configure('mavenizer') {
    classpath.from(mavenizerCompatibilityJar)
    mainClass.set('net.minecraftforge.mcmaven.cli.Main')
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.ADOPTIUM
    })
}

group = project.mod_group
version = project.mod_version
base.archivesName = 'OreSpawn'

def versionParts = project.mod_version.toString().tokenize('.')
if (versionParts.size() != 4 || !versionParts.every { it ==~ /\d+/ }) {
    throw new GradleException("mod_version must use Major.Minor.Bug.Target numeric form: ${project.mod_version}")
}
def minecraftVersionParts = project.minecraft_version.toString().tokenize('.')
def minecraftPatch = minecraftVersionParts.size() == 3 ? minecraftVersionParts[2] : '0'
def expectedTargetVersion = "${minecraftVersionParts[0]}" +
        "${minecraftVersionParts[1].padLeft(2, '0')}" +
        "${minecraftPatch.padLeft(2, '0')}" + project.loader_code
if (versionParts[3] != expectedTargetVersion) {
    throw new GradleException("mod_version target ${versionParts[3]} does not match " +
            "Minecraft ${project.minecraft_version} ${project.loader_name} target ${expectedTargetVersion}")
}
ext.functional_version = versionParts[0..2].join('.')
ext.display_version = project.mod_version
ext.release_tag = project.mod_version
def expectedMavenGroup = 'zone.moddev.mc.orespawn'
def expectedMavenArtifact = 'OreSpawn'
def expectedMavenCoordinate = "${expectedMavenGroup}:${expectedMavenArtifact}:${project.version}"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
        vendor = JvmVendorSpec.ADOPTIUM
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
        vendor = JvmVendorSpec.ADOPTIUM
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '1000'])
}
tasks.named('compileTestJava', JavaCompile) { options.compilerArgs.add('-proc:none') }
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    workingDir = project.projectDir
}
tasks.withType(Javadoc).configureEach {
    failOnError = false
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addBooleanOption('notimestamp', true)
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def archiveTextSuffixes = [
        '.cfg', '.css', '.html', '.info', '.java', '.js', '.json', '.lang',
        '.mcmeta', '.md', '.properties', '.txt', '.xml'
]
def archiveTextPatterns = archiveTextSuffixes.collect { "**/*${it}".toString() }
archiveTextPatterns.addAll(['**/element-list', '**/package-list'])
def normalizeArchiveLineEndings = { details ->
    details.filter(FixCrLfFilter,
            eol: FixCrLfFilter.CrLf.newInstance('lf'),
            eof: FixCrLfFilter.AddAsisRemove.newInstance('asis'))
}

minecraft {
    mappings channel: project.mapping_channel, version: project.mapping_version
    // Forge 52 uses official runtime naming. ForgeGradle 7 therefore needs no
    // reobfuscation task (and no longer exposes the legacy reobf switch).
    accessTransformer = 'META-INF/accesstransformer.cfg'
    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('run')
            jvmArgs '--add-opens', 'java.base/java.lang.invoke=ALL-UNNAMED'
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }
        register('client')
        register('server') { args '--nogui' }
        register('gameTestServer') {
            workingDir.convention layout.buildDirectory.dir('gametest-benchmark-run')
        }
        register('data') {
            workingDir.convention layout.projectDirectory.dir('run-data')
            args '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
        register('surfaceIntegrationFresh') {
            mainClass = 'net.minecraftforge.bootstrap.ForgeBootstrap'
            workingDir.convention layout.buildDirectory.dir('surface-integration-run')
            jvmArgs '-Djava.net.preferIPv6Addresses=system'
            args '--launchTarget', 'forge_userdev_server', '--gameDir', '.', '--nogui'
            systemProperty 'surfaceprobe.integrationPhase', 'fresh'
            environment 'MCP_MAPPINGS', '{mcp_mappings}'
        }
        register('surfaceIntegrationReload') {
            mainClass = 'net.minecraftforge.bootstrap.ForgeBootstrap'
            workingDir.convention layout.buildDirectory.dir('surface-integration-run')
            jvmArgs '-Djava.net.preferIPv6Addresses=system'
            args '--launchTarget', 'forge_userdev_server', '--gameDir', '.', '--nogui'
            systemProperty 'surfaceprobe.integrationPhase', 'reload'
            environment 'MCP_MAPPINGS', '{mcp_mappings}'
        }
    }
}

def bundledDocumentationDirectory = layout.projectDirectory.dir(
        'src/generated/resources/META-INF/orespawn/docs')
def prepareBundledDocumentation = tasks.register('prepareBundledDocumentation', Sync) {
    group = 'build'
    description = 'Stages public documentation as a generated production resource tree.'
    from('docs')
    into(bundledDocumentationDirectory)
}

sourceSets.main.resources {
    // Eclipse rebuilds bin/main from declared resource source folders. Keeping
    // the generated documentation in the source set prevents a Buildship
    // refresh from silently removing the guide copied by processResources.
    srcDir 'src/generated/resources'
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    exclusiveContent {
        forRepository { maven { url = 'https://repo.spongepowered.org/repository/maven-public' } }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    mavenCentral()
    maven { url = 'https://libraries.minecraft.net/' }
}

