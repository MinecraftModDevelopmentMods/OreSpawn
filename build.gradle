import groovy.xml.XmlSlurper
import java.nio.charset.StandardCharsets
import java.security.MessageDigest
import java.util.jar.Manifest
import java.util.zip.ZipFile
import org.apache.tools.ant.filters.FixCrLfFilter

plugins {
    id 'eclipse'
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

// NeoGradle's staged results must not mix with another Minecraft checkout.
// Keep downloaded dependencies shared, but store execution results locally.
gradle.sharedServices.registrations.named('CachedExecutionService') {
    parameters.cacheDirectory.set(providers.gradleProperty(
            'net.neoforged.gradle.caching.cacheDirectory').orElse(
            layout.projectDirectory.dir('.gradle/neo-execution').asFile.absolutePath))
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'OreSpawn'
}

def versionParts = project.mod_version.toString().tokenize('.')
if (versionParts.size() != 4 || !versionParts.every { it ==~ /\d+/ }) {
    throw new GradleException("mod_version must use Major.Minor.Bug.Target numeric form: ${project.mod_version}")
}
def minecraftVersionParts = project.minecraft_version.toString().tokenize('.')
def minecraftPatch = minecraftVersionParts.size() == 3 ? minecraftVersionParts[2] : '0'
def expectedTargetVersion = "${minecraftVersionParts[0]}" +
        "${minecraftVersionParts[1].padLeft(2, '0')}" +
        "${minecraftPatch.padLeft(2, '0')}" + project.loader_code
if (versionParts[3] != expectedTargetVersion) {
    throw new GradleException("mod_version target ${versionParts[3]} does not match " +
            "Minecraft ${project.minecraft_version} ${project.loader_name} target ${expectedTargetVersion}")
}
ext.functional_version = versionParts[0..2].join('.')
ext.display_version = project.mod_version
ext.release_tag = project.mod_version
def expectedMavenGroup = 'zone.moddev.mc.orespawn'
def expectedMavenArtifact = 'OreSpawn'
def expectedMavenCoordinate = "${expectedMavenGroup}:${expectedMavenArtifact}:${project.version}"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
        vendor = JvmVendorSpec.ADOPTIUM
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def archiveTextSuffixes = [
        '.cfg', '.css', '.html', '.info', '.java', '.js', '.json', '.lang',
        '.mcmeta', '.md', '.properties', '.svg', '.toml', '.txt', '.xml'
]
def archiveTextPatterns = archiveTextSuffixes.collect { "**/*${it}".toString() }
archiveTextPatterns.addAll(['**/element-list', '**/package-list',
        '**/legal/LICENSE', '**/legal/ASSEMBLY_EXCEPTION', '**/legal/ADDITIONAL_LICENSE_INFO'])

// A normalization policy change must rebuild the archives too.
tasks.withType(Jar).configureEach {
    inputs.property('normalizedArchiveTextPatterns', archiveTextPatterns)
}

def normalizeArchiveLineEndings = { details ->
    details.filter(FixCrLfFilter,
            eol: FixCrLfFilter.CrLf.newInstance('lf'),
            eof: FixCrLfFilter.AddAsisRemove.newInstance('asis'))
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

def bundledDocumentationDirectory = layout.projectDirectory.dir(
        'src/generated/resources/META-INF/orespawn/docs')
def prepareBundledDocumentation = tasks.register('prepareBundledDocumentation', Sync) {
    group = 'build'
    description = 'Stages public documentation as a generated production resource tree.'
    from 'docs'
    into bundledDocumentationDirectory
}

minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

def configureBenchmark = { run, String radius, String repetitions, String center ->
    if (!providers.gradleProperty('orespawnBenchmarkMode').isPresent()) {
        return
    }
    run.systemProperty 'orespawn.worldgenBenchmarkMode',
            providers.gradleProperty('orespawnBenchmarkMode').get()
    run.systemProperty 'orespawn.worldgenBenchmarkRadius',
            providers.gradleProperty('orespawnBenchmarkRadius').getOrElse(radius)
    run.systemProperty 'orespawn.worldgenBenchmarkRepetitions',
            providers.gradleProperty('orespawnBenchmarkRepetitions').getOrElse(repetitions)
    run.systemProperty 'orespawn.worldgenBenchmarkVanillaOres',
            providers.gradleProperty('orespawnBenchmarkVanillaOres').getOrElse('false')
    run.systemProperty 'orespawn.worldgenBenchmarkOreAudit',
            providers.gradleProperty('orespawnBenchmarkOreAudit').getOrElse('false')
    run.systemProperty 'orespawn.worldgenBenchmarkFluidAudit',
            providers.gradleProperty('orespawnBenchmarkFluidAudit').getOrElse('false')
    if (providers.gradleProperty('orespawnBenchmarkBiomeAudit').isPresent()) {
        run.systemProperty 'orespawn.worldgenBenchmarkBiomeAudit',
                providers.gradleProperty('orespawnBenchmarkBiomeAudit').get()
    }
    if (providers.gradleProperty('orespawnBenchmarkBlockAudit').isPresent()) {
        run.systemProperty 'orespawn.worldgenBenchmarkBlockAudit',
                providers.gradleProperty('orespawnBenchmarkBlockAudit').get()
    }
    run.systemProperty 'orespawn.worldgenBenchmarkCenterX',
            providers.gradleProperty('orespawnBenchmarkCenterX').getOrElse(center)
    run.systemProperty 'orespawn.worldgenBenchmarkCenterZ',
            providers.gradleProperty('orespawnBenchmarkCenterZ').getOrElse(center)
    run.systemProperty 'orespawn.worldgenBenchmarkCenterStep',
            providers.gradleProperty('orespawnBenchmarkCenterStep').getOrElse('64')
    run.systemProperty 'orespawn.worldgenBenchmarkDimension',
            providers.gradleProperty('orespawnBenchmarkDimension').getOrElse('overworld')
    if (providers.gradleProperty('orespawnBenchmarkBiomeType').isPresent()) {
        run.systemProperty 'orespawn.worldgenBenchmarkBiomeType',
                providers.gradleProperty('orespawnBenchmarkBiomeType').get()
    }
    run.systemProperty 'orespawn.worldgenBenchmarkStopServer', 'true'
    if (providers.gradleProperty('worldgenJfrFile').isPresent()) {
        run.jvmArgument "-XX:StartFlightRecording=filename=${providers.gradleProperty('worldgenJfrFile').get()},settings=profile,dumponexit=true"
    }
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run')
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
    }

    // The UI probe gets its own game folder so normal development saves stay untouched.
    register('client41Integration') {
        runType 'client'
        workingDirectory layout.buildDirectory.dir('client-integration-run')
        systemProperty 'clientprobe.enabled', 'true'
        argument '--width'
        argument '854'
        argument '--height'
        argument '480'
        modSource project.sourceSets.main
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        argument '--nogui'
        configureBenchmark(delegate, '8', '5', '1024')
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces',
                providers.gradleProperty('orespawnBenchmarkMode').isPresent()
                        ? "${mod_id},minecraft" : mod_id
        configureBenchmark(delegate, '4', '3', '256')
    }

    data {
        workingDirectory project.layout.projectDirectory.dir('run-data')
        arguments.addAll '--mod', mod_id, '--all', '--output',
                file('src/generated/resources/').absolutePath, '--existing',
                file('src/main/resources/').absolutePath
    }

    ['Fresh', 'Reload'].each { String phase ->
        register("surfaceIntegration${phase}") {
            runType 'server'
            workingDirectory layout.buildDirectory.dir('surface-integration-run')
            systemProperty 'forge.logging.console.level', 'info'
            systemProperty 'surfaceprobe.integrationPhase', phase.toLowerCase(Locale.ROOT)
            argument '--nogui'
            modSource project.sourceSets.main
        }
    }

    ['One', 'Both'].each { String scenario ->
        ['Fresh', 'Reload', 'Missing', 'Restored'].each { String phase ->
            if (scenario == 'One' && phase != 'Fresh' && phase != 'Reload') return
            register("oreSource${scenario}${phase}") {
                runType 'server'
                workingDirectory layout.buildDirectory.dir("ore-source-${scenario.toLowerCase(Locale.ROOT)}-run")
                systemProperty 'forge.logging.console.level', 'info'
                systemProperty 'oresourceprobe.phase', phase.toLowerCase(Locale.ROOT)
                argument '--nogui'
                modSource project.sourceSets.main
            }
        }
    }

    ['Fresh', 'Reload'].each { String phase ->
        register("biomeOverride${phase}") {
            runType 'server'
            workingDirectory layout.buildDirectory.dir('biome-override-run')
            systemProperty 'forge.logging.console.level', 'info'
            systemProperty 'orespawn.biomeOverridePhase', phase.toLowerCase(Locale.ROOT)
            argument '--nogui'
            modSource project.sourceSets.main
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
}

def fixtureRoot = file("${rootDir}/ci-fixtures")
def mineralogy5OracleJar = new File(fixtureRoot,
        'artifacts/Mineralogy-1.18.2-5.4.0.jar')
def mineralogy5OracleSha256 =
        'CCA84E9270585478B08F54BA091AD56AB2CB390386C650ED78B2673DC57403EB'


// Helpers shared by the small build scripts live here; tasks stay with their owner.
ext.oreSpawnBuild = [
        mineralogy5OracleJar: mineralogy5OracleJar,
        mineralogy5OracleSha256: mineralogy5OracleSha256,
        expectedMavenGroup: expectedMavenGroup,
        expectedMavenArtifact: expectedMavenArtifact,
        expectedMavenCoordinate: expectedMavenCoordinate,
        archiveTextSuffixes: archiveTextSuffixes,
        archiveTextPatterns: archiveTextPatterns,
        normalizeArchiveLineEndings: normalizeArchiveLineEndings,
        bundledDocumentationDirectory: bundledDocumentationDirectory,
        prepareBundledDocumentation: prepareBundledDocumentation
]

apply from: 'gradle/verification/support.gradle'
dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn prepareBundledDocumentation
}

tasks.named('jar', Jar).configure {
    archiveClassifier = ''
    destinationDirectory = layout.buildDirectory.dir('libs')
    filteringCharset = 'UTF-8'
    includeEmptyDirs = false
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
    manifest {
        attributes([
                'Specification-Title'      : 'OreSpawn',
                'Specification-Vendor'     : project.mod_vendor,
                'Specification-Version'    : '1',
                'Implementation-Title'     : base.archivesName.get(),
                'Implementation-Version'   : project.version,
                'Implementation-Vendor'    : project.mod_vendor,
                'OreSpawn-API-Version'     : '1',
                'OreSpawn-Loader'          : 'neoforge',
                'FMLAT'                    : 'accesstransformer.cfg',
                'Maven-Artifact'           : expectedMavenCoordinate,
                'Built-On-Java'            : '21',
                'Built-On'                 : "${project.minecraft_version}-${project.neo_version}"
        ])
    }
}

tasks.named('sourcesJar', Jar).configure {
    dependsOn prepareBundledDocumentation
    filteringCharset = 'UTF-8'
    includeEmptyDirs = false
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
}
tasks.named('javadocJar', Jar).configure {
    filteringCharset = 'UTF-8'
    includeEmptyDirs = false
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
}

tasks.withType(JavaCompile).configureEach {
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
        vendor = JvmVendorSpec.ADOPTIUM
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    options.encoding = 'UTF-8'
}

tasks.named('javadoc', Javadoc).configure {
    failOnError = false
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addBooleanOption('notimestamp', true)
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    // Unit tests inspect target files relative to the checkout, but they do
    // not need NeoForge's rolling runtime files. A console-only logger keeps
    // them from contending with Eclipse/client logs in this working directory.
    systemProperty 'log4j.configurationFile', file('src/test/resources/log4j2-test.xml').absolutePath
    // Loaded only through an isolated URLClassLoader by the parity test. This
    // is deliberately not a Gradle dependency and cannot leak into Eclipse or
    // a published OreSpawn jar.
    dependsOn tasks.named('verifyLegacyFixtures')
    systemProperty 'orespawn.mineralogy5Oracle', mineralogy5OracleJar.absolutePath
}

tasks.named('compileTestJava', JavaCompile).configure {
    dependsOn tasks.named('verifyLegacyFixtures')
    options.compilerArgs.add('-proc:none')
}


apply from: 'gradle/verification/client-and-benchmark.gradle'
apply from: 'gradle/verification/ore-sources.gradle'
apply from: 'gradle/verification/biome-override.gradle'
apply from: 'gradle/verification/packaged-runtime.gradle'
apply from: 'gradle/verification/native-ores.gradle'
apply from: 'gradle/release/artifacts.gradle'
apply from: 'gradle/release/publishing.gradle'
apply from: 'gradle/ide/eclipse.gradle'
tasks.named('check') {
    dependsOn tasks.named('verifyCommandPortability')
    dependsOn tasks.named('verifyMavenCoordinates')
    dependsOn tasks.named('verifyColdNeoForgeBootstrapContract')
}
