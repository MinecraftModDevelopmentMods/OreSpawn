import groovy.json.JsonSlurper
import groovy.xml.XmlSlurper
import java.nio.charset.StandardCharsets
import java.security.MessageDigest
import java.util.jar.Manifest
import java.util.zip.ZipFile
import org.apache.tools.ant.filters.FixCrLfFilter

plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.renamer' version '1.1.5'
    id 'net.minecraftforge.accesstransformers' version '2.0.0'
    id 'net.minecraftforge.gradle' version '7.0.34'
}

group = project.mod_group
version = project.mod_version
base.archivesName = 'OreSpawn'

def versionParts = project.mod_version.toString().tokenize('.')
if (versionParts.size() != 4 || !versionParts.every { it ==~ /\d+/ }) {
    throw new GradleException("mod_version must use Major.Minor.Bug.Target numeric form: ${project.mod_version}")
}
def minecraftVersionParts = project.minecraft_version.toString().tokenize('.')
def minecraftPatch = minecraftVersionParts.size() == 3 ? minecraftVersionParts[2] : '0'
def expectedTargetVersion = "${minecraftVersionParts[0]}" +
        "${minecraftVersionParts[1].padLeft(2, '0')}" +
        "${minecraftPatch.padLeft(2, '0')}" + project.loader_code
if (versionParts[3] != expectedTargetVersion) {
    throw new GradleException("mod_version target ${versionParts[3]} does not match " +
            "Minecraft ${project.minecraft_version} ${project.loader_name} target ${expectedTargetVersion}")
}
ext.functional_version = versionParts[0..2].join('.')
ext.display_version = project.mod_version
ext.release_tag = project.mod_version
def expectedMavenGroup = 'zone.moddev.mc.orespawn'
def expectedMavenArtifact = 'OreSpawn'
def expectedMavenCoordinate = "${expectedMavenGroup}:${expectedMavenArtifact}:${project.version}"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
        vendor = JvmVendorSpec.ADOPTIUM
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(8)
        vendor = JvmVendorSpec.ADOPTIUM
    }
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '1000'])
}
tasks.named('compileTestJava', JavaCompile) { options.compilerArgs.add('-proc:none') }
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    workingDir = project.projectDir
}
tasks.withType(Javadoc).configureEach {
    failOnError = false
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addBooleanOption('notimestamp', true)
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def archiveTextSuffixes = [
        '.cfg', '.css', '.html', '.info', '.java', '.js', '.json', '.lang',
        '.mcmeta', '.md', '.properties', '.txt', '.xml'
]
def archiveTextPatterns = archiveTextSuffixes.collect { "**/*${it}".toString() }
archiveTextPatterns.addAll(['**/element-list', '**/package-list'])
def normalizeArchiveLineEndings = { details ->
    details.filter(FixCrLfFilter,
            eol: FixCrLfFilter.CrLf.newInstance('lf'),
            eof: FixCrLfFilter.AddAsisRemove.newInstance('asis'))
}

minecraft {
    mappings channel: project.mapping_channel, version: project.mapping_version
    accessTransformer = 'META-INF/accesstransformer.cfg'
    runs {
        configureEach {
            mainClass = 'net.minecraftforge.userdev.LaunchTesting'
            workingDir.convention layout.projectDirectory.dir('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            mods { orespawn { source sourceSets.main } }
        }
        register('client')
        register('oreSourcesClient') {
            workingDir.convention layout.projectDirectory.dir('run-ore-sources')
        }
        register('server') { args '--nogui' }
        register('data') {
            workingDir.convention layout.projectDirectory.dir('run-data')
            args '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
        register('surfaceIntegrationFresh') {
            workingDir.convention layout.buildDirectory.dir('surface-integration-run')
            systemProperty 'surfaceprobe.integrationPhase', 'fresh'
            args '--nogui'
        }
        register('surfaceIntegrationReload') {
            workingDir.convention layout.buildDirectory.dir('surface-integration-run')
            systemProperty 'surfaceprobe.integrationPhase', 'reload'
            args '--nogui'
        }
    }
}

def bundledDocumentationDirectory = layout.projectDirectory.dir(
        'src/generated/resources/META-INF/orespawn/docs')
def prepareBundledDocumentation = tasks.register('prepareBundledDocumentation', Sync) {
    group = 'build'
    description = 'Stages public documentation as a generated production resource tree.'
    from('docs')
    into(bundledDocumentationDirectory)
}

sourceSets.main.resources {
    // Eclipse rebuilds bin/main from declared resource source folders. Keeping
    // the generated documentation in the source set prevents a Buildship
    // refresh from silently removing the guide copied by processResources.
    srcDir 'src/generated/resources'
}

def forgeRunModClassesDirectory = file("${buildDir}/forge-run-mod-classes/main")
def prepareForgeRunModClasses = tasks.register('prepareForgeRunModClasses', Sync) {
    dependsOn tasks.named('classes')
    from sourceSets.main.output.classesDirs
    from sourceSets.main.output.resourcesDir
    into forgeRunModClassesDirectory
}

def configureForge31Run = { JavaExec runTask, String launchTarget ->
    runTask.dependsOn prepareForgeRunModClasses
    runTask.mainClass.set('net.minecraftforge.userdev.LaunchTesting')
    runTask.environment 'target', launchTarget
    runTask.environment 'MCP_MAPPINGS', "${mapping_channel}_${mapping_version}"
    runTask.environment 'MCP_VERSION', mcp_version
    runTask.environment 'FORGE_VERSION', forge_version
    runTask.environment 'FORGE_GROUP', 'net.minecraftforge'
    runTask.environment 'MC_VERSION', minecraft_version
    // Forge 31's exploded-directory locator resolves one physical output per
    // mod entry.  Give it a merged, build-owned classes/resources directory,
    // repeated for the target's legacy duplicate-entry discovery contract.
    runTask.environment 'MOD_CLASSES', "${mod_id}%%${forgeRunModClassesDirectory}${File.pathSeparator}" +
            "${mod_id}%%${forgeRunModClassesDirectory}"
}
tasks.withType(JavaExec).configureEach { JavaExec runTask ->
    Map<String, String> targets = [
            runClient: 'fmluserdevclient',
            runOreSourcesClient: 'fmluserdevclient',
            runServer: 'fmluserdevserver',
            runData: 'fmluserdevdata',
            runSurfaceIntegrationFresh: 'fmluserdevserver',
            runSurfaceIntegrationReload: 'fmluserdevserver'
    ]
    String launchTarget = targets.get(runTask.name)
    if (launchTarget != null) configureForge31Run(runTask, launchTarget)
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    exclusiveContent {
        forRepository { maven { url = 'https://repo.spongepowered.org/repository/maven-public' } }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    mavenCentral()
    maven { url = 'https://libraries.minecraft.net/' }
}

def fixtureRoot = file("${rootDir}/ci-fixtures")
def mineralogy5OracleJar = new File(fixtureRoot,
        'artifacts/Mineralogy-1.15.2-5.1.1.jar')
def mineralogy5OracleSha256 =
        'C22060D02578044BF1B9D571881EA76D3235543358C508696B67C88552BF0FA7'

tasks.register('verifyLegacyFixtures') {
    group = 'verification'
    description = 'Verifies the sealed Mineralogy 1.15.2 5.1.1 oracle used only by isolated tests.'
    inputs.file mineralogy5OracleJar
    doLast {
        if (!mineralogy5OracleJar.isFile()) {
            throw new GradleException("Missing mandatory Mineralogy oracle: ${mineralogy5OracleJar}")
        }
        MessageDigest digest = MessageDigest.getInstance('SHA-256')
        mineralogy5OracleJar.withInputStream { input ->
            byte[] buffer = new byte[8192]
            for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
                if (read > 0) digest.update(buffer, 0, read)
            }
        }
        String actual = digest.digest().encodeHex().toString().toUpperCase()
        if (actual != mineralogy5OracleSha256) {
            throw new GradleException("Mineralogy oracle checksum mismatch: ${actual}")
        }
    }
}

dependencies {
    implementation minecraft.dependency(
            "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

tasks.named('compileTestJava', JavaCompile) { dependsOn tasks.named('verifyLegacyFixtures') }
tasks.named('test', Test) {
    dependsOn tasks.named('verifyLegacyFixtures')
    systemProperty 'orespawn.mineralogy5Oracle', mineralogy5OracleJar.absolutePath
}

tasks.register('verifyLegacyOracleIsolation') {
    group = 'verification'
    description = 'Keeps the sealed Mineralogy oracle test-visible but production-invisible.'
    dependsOn tasks.named('verifyLegacyFixtures')
    doLast {
        configurations.findAll { it.canBeResolved }.each { configuration ->
            if (configuration.files.any { it.canonicalFile == mineralogy5OracleJar.canonicalFile }) {
                throw new GradleException("Mineralogy oracle leaked into ${configuration.name}")
            }
        }
    }
}

def java8Launcher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(8)
    vendor = JvmVendorSpec.ADOPTIUM
}
tasks.register('verifyJava8Toolchain') {
    group = 'verification'
    doLast {
        def metadata = java8Launcher.get().metadata
        if (project.java_toolchain_version != '8.0.502+7'
                || metadata.vendor.toString() != 'Eclipse Temurin'
                || metadata.javaRuntimeVersion != '1.8.0_502-b07') {
            throw new GradleException("Expected Temurin ${project.java_toolchain_version}, found " +
                    "${metadata.vendor} ${metadata.javaRuntimeVersion} at ${metadata.installationPath}")
        }
    }
}
tasks.named('check') {
    dependsOn tasks.named('verifyLegacyOracleIsolation')
    dependsOn tasks.named('verifyJava8Toolchain')
}

tasks.named('processResources', ProcessResources) {
    dependsOn prepareBundledDocumentation
    filteringCharset = 'UTF-8'
    inputs.property('version', project.version)
    inputs.property('minecraft_version', project.minecraft_version)
    inputs.property('forge_version_range', project.forge_version_range)
    inputs.property('loader_version_range', project.loader_version_range)
    inputs.property('minecraft_version_range', project.minecraft_version_range)
    filesMatching('META-INF/mods.toml') {
        expand([
                version: project.version,
                minecraft_version: project.minecraft_version,
                forge_version_range: project.forge_version_range,
                loader_version_range: project.loader_version_range,
                minecraft_version_range: project.minecraft_version_range
        ])
    }
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
}

def prepareEclipseResources = tasks.register('prepareEclipseResources') {
    group = 'ide'
    dependsOn tasks.named('processResources')
    doLast {
        // An older Eclipse import may still have the retired guide in bin/main.
        delete file('bin/main/META-INF/orespawn/docs/AGENTS.md')
        project.copy {
            from(layout.buildDirectory.dir('resources/main'))
            into(layout.projectDirectory.dir('bin/main'))
        }
    }
}

// A Forge process is not green merely because it returns exit code zero. The
// loader can log a worldgen/linkage failure and still shut down normally.

// Keep shared helpers small; each applied script owns one kind of work.
ext.oreSpawnBuild = [
        mavenGroup: expectedMavenGroup,
        mavenArtifact: expectedMavenArtifact,
        mavenCoordinate: expectedMavenCoordinate,
        archiveTextSuffixes: archiveTextSuffixes,
        archiveTextPatterns: archiveTextPatterns,
        normalizeArchiveLineEndings: normalizeArchiveLineEndings,
        java8Launcher: java8Launcher,
        bundledDocumentationDirectory: bundledDocumentationDirectory,
        prepareBundledDocumentation: prepareBundledDocumentation,
        prepareEclipseResources: prepareEclipseResources
]

apply from: 'gradle/verification/support.gradle'
apply from: 'gradle/verification/client-and-benchmark.gradle'
apply from: 'gradle/release/artifacts.gradle'
apply from: 'gradle/release/publishing.gradle'
apply from: 'gradle/ide/eclipse.gradle'
apply from: 'gradle/verification/packaged-forge.gradle'
apply from: 'gradle/verification/ore-sources.gradle'
apply from: 'gradle/verification/performance.gradle'
apply from: 'gradle/verification/native-ores.gradle'
