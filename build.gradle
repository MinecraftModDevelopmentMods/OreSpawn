def configureBenchmark = { run, String radius, String repetitions, String center,
        String stopServer ->
    if (!providers.gradleProperty('orespawnBenchmarkMode').isPresent()) {
        return
    }
    run.systemProperty 'orespawn.worldgenBenchmarkMode',
            providers.gradleProperty('orespawnBenchmarkMode').get()
    run.systemProperty 'orespawn.worldgenBenchmarkRadius',
            providers.gradleProperty('orespawnBenchmarkRadius').getOrElse(radius)
    run.systemProperty 'orespawn.worldgenBenchmarkRepetitions',
            providers.gradleProperty('orespawnBenchmarkRepetitions').getOrElse(repetitions)
    run.systemProperty 'orespawn.worldgenBenchmarkVanillaOres',
            providers.gradleProperty('orespawnBenchmarkVanillaOres').getOrElse('false')
    run.systemProperty 'orespawn.worldgenBenchmarkOreAudit',
            providers.gradleProperty('orespawnBenchmarkOreAudit').getOrElse('false')
    run.systemProperty 'orespawn.worldgenBenchmarkFluidAudit',
            providers.gradleProperty('orespawnBenchmarkFluidAudit').getOrElse('false')
    if (providers.gradleProperty('orespawnBenchmarkBiomeAudit').isPresent()) {
        run.systemProperty 'orespawn.worldgenBenchmarkBiomeAudit',
                providers.gradleProperty('orespawnBenchmarkBiomeAudit').get()
    }
    if (providers.gradleProperty('orespawnBenchmarkBlockAudit').isPresent()) {
        run.systemProperty 'orespawn.worldgenBenchmarkBlockAudit',
                providers.gradleProperty('orespawnBenchmarkBlockAudit').get()
    }
    run.systemProperty 'orespawn.worldgenBenchmarkCenterX',
            providers.gradleProperty('orespawnBenchmarkCenterX').getOrElse(center)
    run.systemProperty 'orespawn.worldgenBenchmarkCenterZ',
            providers.gradleProperty('orespawnBenchmarkCenterZ').getOrElse(center)
    run.systemProperty 'orespawn.worldgenBenchmarkCenterStep',
            providers.gradleProperty('orespawnBenchmarkCenterStep').getOrElse('64')
    run.systemProperty 'orespawn.worldgenBenchmarkDimension',
            providers.gradleProperty('orespawnBenchmarkDimension').getOrElse('overworld')
    if (providers.gradleProperty('orespawnBenchmarkBiomeType').isPresent()) {
        run.systemProperty 'orespawn.worldgenBenchmarkBiomeType',
                providers.gradleProperty('orespawnBenchmarkBiomeType').get()
    }
    run.systemProperty 'orespawn.worldgenBenchmarkStopServer',
            providers.gradleProperty('orespawnBenchmarkStopServer').getOrElse(stopServer)
    if (providers.gradleProperty('worldgenJfrFile').isPresent()) {
        run.jvmArgument "-XX:StartFlightRecording=filename=${providers.gradleProperty('worldgenJfrFile').get()},settings=profile,dumponexit=true"
    }
}

