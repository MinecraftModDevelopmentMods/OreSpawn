        File vanillaServer = new File(runtime, 'minecraft_server.1.13.2.jar')
        File libraries = new File(runtime, 'libraries')
        [launcher, vanillaServer, libraries].each {
            if (!it.exists()) throw new GradleException("Incomplete official server runtime: ${it}")
        }
        workingDir packagedSurfaceRunDirectory
        commandLine java8Launcher.get().executablePath.asFile.absolutePath,
                '-Xms512m', '-Xmx2g', '-Dsurfaceprobe.integrationPhase=fresh',
                '-jar', launcher.absolutePath, 'nogui'
    }
    doLast {
        File marker = new File(packagedSurfaceRunDirectory,
                'surface-integration-world/surfaceprobe-integration.properties')
        if (!marker.isFile()) throw new GradleException('Packaged fresh surface marker is missing')
        assertRuntimeLogsClean(packagedSurfaceRunDirectory,
                'packaged surface fresh', [] as Set)
    }
}
