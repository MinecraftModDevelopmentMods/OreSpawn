def requireRuntimeDirectory = { Provider<String> configuredPath, String propertyName ->
    if (!configuredPath.isPresent()) {
        throw new GradleException("Pass -P${propertyName}=<official Forge 65 runtime directory>")
    }
    File runtime = file(configuredPath.get())
    if (!runtime.isDirectory()) {
        throw new GradleException("${propertyName} does not name a directory: ${runtime}")
    }
    runtime
}

def stagePackagedServerLibraries = { File runtime, File runDirectory ->
    File sourceLibraries = new File(runtime, 'libraries')
    if (!sourceLibraries.isDirectory()) {
        throw new GradleException("Official server runtime has no libraries directory: ${sourceLibraries}")
    }
    File targetLibraries = new File(runDirectory, 'libraries')
    sourceLibraries.eachFileRecurse(groovy.io.FileType.FILES) { File source ->
        java.nio.file.Path relative = sourceLibraries.toPath().relativize(source.toPath())
        File target = targetLibraries.toPath().resolve(relative).toFile()
        target.parentFile.mkdirs()
        try {
            java.nio.file.Files.createLink(target.toPath(), source.toPath())
        } catch (IOException | UnsupportedOperationException | SecurityException ignored) {
            java.nio.file.Files.copy(source.toPath(), target.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

