def sha256Of = { File inputFile ->
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    inputFile.withInputStream { input ->
        byte[] buffer = new byte[8192]
        for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
            if (read > 0) digest.update(buffer, 0, read)
        }
    }
    digest.digest().encodeHex().toString().toUpperCase()
}

def mavenizerToolsDirectory = layout.projectDirectory.dir('ci-fixtures/tools')
def mavenizerCompatibilityJar = mavenizerToolsDirectory.file(
