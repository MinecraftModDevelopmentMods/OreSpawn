plugins {
    id 'eclipse'
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "OreSpawn-${minecraft_version}-neoforge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
    withJavadocJar()
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

def configureBenchmark = { run, String radius, String repetitions, String center,
        String stopServer ->
    if (!providers.gradleProperty('orespawnBenchmarkMode').isPresent()) {
        return
    }
    run.systemProperty 'orespawn.worldgenBenchmarkMode',
            providers.gradleProperty('orespawnBenchmarkMode').get()
    run.systemProperty 'orespawn.worldgenBenchmarkRadius',
            providers.gradleProperty('orespawnBenchmarkRadius').getOrElse(radius)
    run.systemProperty 'orespawn.worldgenBenchmarkRepetitions',
            providers.gradleProperty('orespawnBenchmarkRepetitions').getOrElse(repetitions)
    run.systemProperty 'orespawn.worldgenBenchmarkVanillaOres',
            providers.gradleProperty('orespawnBenchmarkVanillaOres').getOrElse('false')
    run.systemProperty 'orespawn.worldgenBenchmarkOreAudit',
            providers.gradleProperty('orespawnBenchmarkOreAudit').getOrElse('false')
    run.systemProperty 'orespawn.worldgenBenchmarkFluidAudit',
            providers.gradleProperty('orespawnBenchmarkFluidAudit').getOrElse('false')
    if (providers.gradleProperty('orespawnBenchmarkBiomeAudit').isPresent()) {
        run.systemProperty 'orespawn.worldgenBenchmarkBiomeAudit',
                providers.gradleProperty('orespawnBenchmarkBiomeAudit').get()
    }
    if (providers.gradleProperty('orespawnBenchmarkBlockAudit').isPresent()) {
        run.systemProperty 'orespawn.worldgenBenchmarkBlockAudit',
                providers.gradleProperty('orespawnBenchmarkBlockAudit').get()
    }
    run.systemProperty 'orespawn.worldgenBenchmarkCenterX',
            providers.gradleProperty('orespawnBenchmarkCenterX').getOrElse(center)
    run.systemProperty 'orespawn.worldgenBenchmarkCenterZ',
            providers.gradleProperty('orespawnBenchmarkCenterZ').getOrElse(center)
    run.systemProperty 'orespawn.worldgenBenchmarkCenterStep',
            providers.gradleProperty('orespawnBenchmarkCenterStep').getOrElse('64')
    run.systemProperty 'orespawn.worldgenBenchmarkDimension',
            providers.gradleProperty('orespawnBenchmarkDimension').getOrElse('overworld')
    if (providers.gradleProperty('orespawnBenchmarkBiomeType').isPresent()) {
        run.systemProperty 'orespawn.worldgenBenchmarkBiomeType',
                providers.gradleProperty('orespawnBenchmarkBiomeType').get()
    }
    run.systemProperty 'orespawn.worldgenBenchmarkStopServer',
            providers.gradleProperty('orespawnBenchmarkStopServer').getOrElse(stopServer)
    if (providers.gradleProperty('worldgenJfrFile').isPresent()) {
        run.jvmArgument "-XX:StartFlightRecording=filename=${providers.gradleProperty('worldgenJfrFile').get()},settings=profile,dumponexit=true"
    }
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run')
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        // The GameTest server always uses Minecraft's flat test preset, so
        // real terrain benchmarks must run through a normal integrated world.
        configureBenchmark(delegate, '8', '5', '1024', 'false')
        if (providers.gradleProperty('orespawnBenchmarkWorld').isPresent()) {
            arguments.addAll '--quickPlaySingleplayer',
                    providers.gradleProperty('orespawnBenchmarkWorld').get()
        }
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        argument '--nogui'
        configureBenchmark(delegate, '8', '5', '1024', 'true')
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
    }

    clientData {
        workingDirectory project.layout.projectDirectory.dir('run-data')
        arguments.addAll '--mod', mod_id, '--all', '--output',
                file('src/generated/resources/').absolutePath, '--existing',
                file('src/main/resources/').absolutePath
    }

    ['Fresh', 'Reload'].each { String phase ->
        register("surfaceIntegration${phase}") {
            runType 'gameTestServer'
            workingDirectory layout.buildDirectory.dir('surface-integration-run')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'surfaceprobe'
            systemProperty 'forge.logging.console.level', 'info'
            systemProperty 'surfaceprobe.integrationPhase', phase.toLowerCase(Locale.ROOT)
            modSource project.sourceSets.main
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.named('processResources', ProcessResources).configure {
    from('docs/AGENTS.md') {
        into ''
        rename { 'AGENTS.md' }
    }
    from('docs') {
        into 'META-INF/orespawn/docs'
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'      : 'OreSpawn',
                'Specification-Vendor'     : 'SkyBlade1978',
                'Specification-Version'    : '1',
                'Implementation-Title'     : project.name,
                'Implementation-Version'   : project.jar.archiveVersion,
                'Implementation-Vendor'    : 'SkyBlade1978',
                'Implementation-Timestamp' : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'OreSpawn-API-Version'     : '1',
                'OreSpawn-Loader'          : 'neoforge'
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifactId = "OreSpawn-${minecraft_version}-neoforge"
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('javadoc', Javadoc).configure {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addBooleanOption('-no-fonts', true)
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

def surfaceIntegrationClasses = layout.buildDirectory.dir('surface-integration-fixture/classes')
def compileSurfaceIntegrationTestMod = tasks.register('compileSurfaceIntegrationTestMod', JavaCompile) {
    dependsOn tasks.named('classes')
    source fileTree('src/biomeIntegrationTest/java')
    classpath = files(sourceSets.main.output, sourceSets.main.compileClasspath)
    destinationDirectory.set(surfaceIntegrationClasses)
    javaCompiler.set(javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(25)
    })
    options.release = 25
    options.encoding = 'UTF-8'
}

def surfaceIntegrationTestModJar = tasks.register('surfaceIntegrationTestModJar', Jar) {
    dependsOn compileSurfaceIntegrationTestMod
    archiveFileName = 'surfaceprobe.jar'
    destinationDirectory = layout.buildDirectory.dir('surface-integration-fixture')
    manifest {
        attributes 'MixinConfigs': 'surfaceprobe.mixins.json'
    }
    from surfaceIntegrationClasses
    from 'src/biomeIntegrationTest/resources'
}

def surfaceIntegrationRunDirectory = layout.buildDirectory.dir('surface-integration-run')
def prepareSurfaceIntegrationTest = tasks.register('prepareSurfaceIntegrationTest') {
    dependsOn surfaceIntegrationTestModJar
    doLast {
        delete surfaceIntegrationRunDirectory
        copy {
            from surfaceIntegrationTestModJar.flatMap { it.archiveFile }
            into surfaceIntegrationRunDirectory.map { it.dir('mods') }
        }
    }
}

tasks.configureEach {
    if (name == 'runSurfaceIntegrationFresh') {
        dependsOn prepareSurfaceIntegrationTest
    } else if (name == 'runSurfaceIntegrationReload') {
        dependsOn 'runSurfaceIntegrationFresh'
    }
}

def surfaceIntegrationTest = tasks.register('surfaceIntegrationTest') {
    group = 'verification'
    description = 'Verifies provider surfaces and dynamic-biome geology across fresh and reloaded normal terrain.'
    dependsOn 'runSurfaceIntegrationReload'
    doLast {
        File marker = surfaceIntegrationRunDirectory.get().file(
                'gametestserver/gametestworld/surfaceprobe-integration.properties').asFile
        if (!marker.isFile()) {
            throw new GradleException("Surface integration completion marker is missing: ${marker}")
        }
        Properties result = new Properties()
        marker.withInputStream { result.load(it) }
        if (result.getProperty('reload_verified') != 'true') {
            throw new GradleException("Surface integration reload was not verified: ${marker}")
        }
        logger.lifecycle('Provider surfaces and dynamic-biome geology verified: {} dimensions, {} columns each, fresh + reload',
                result.getProperty('dimensions'), result.getProperty('columns_per_dimension'))
    }
}

tasks.named('check') {
    dependsOn surfaceIntegrationTest
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

eclipse {
    project {
        natures 'org.eclipse.buildship.core.gradleprojectnature'
        buildCommand 'org.eclipse.buildship.core.gradleprojectbuilder'
    }
    classpath {
        file {
            whenMerged { classpath ->
                def libraryPaths = new LinkedHashSet<String>()
                classpath.entries = classpath.entries.findAll { entry ->
                    !(entry instanceof org.gradle.plugins.ide.eclipse.model.Library)
                            || libraryPaths.add(entry.path)
                }
            }
        }
    }
}

tasks.named('eclipse').configure {
    doLast {
        String requestedGradleHome = System.getenv('GRADLE_USER_HOME')
        if (requestedGradleHome == null || requestedGradleHome.trim().isEmpty()) {
            return
        }

        File preferencesFile = file('.settings/org.eclipse.buildship.core.prefs')
        Properties preferences = new Properties()
        if (preferencesFile.isFile()) {
            preferencesFile.withInputStream { preferences.load(it) }
        }
        String gradleHome = file(requestedGradleHome).canonicalPath
        preferences.setProperty('eclipse.preferences.version', '1')
        preferences.setProperty('connection.gradle.distribution', 'GRADLE_DISTRIBUTION(WRAPPER)')
        preferences.setProperty('override.workspace.settings', 'true')
        preferences.setProperty('gradle.user.home', gradleHome)
        preferences.setProperty('connection.gradle.user.home', gradleHome)
        preferences.setProperty('java.home', System.getProperty('java.home'))
        preferencesFile.parentFile.mkdirs()
        preferencesFile.withOutputStream {
            preferences.store(it, 'Generated by the OreSpawn Eclipse task to keep NeoGradle launch modules on one cache.')
        }
    }
}
