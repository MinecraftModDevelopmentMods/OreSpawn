task verifyLegacyFixtures {
    group = 'verification'
    description = 'Verifies the sealed ABI and migration corpus used only by isolated tests.'
    inputs.files legacyFixtureHashes.keySet().collect { new File(legacyFixtureRoot, it) }
    doLast {
        legacyFixtureHashes.each { String relativePath, String expectedHash ->
            File fixture = new File(legacyFixtureRoot, relativePath)
            if (!fixture.isFile()) {
                throw new GradleException("Missing sealed legacy fixture: ${fixture}")
            }
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            fixture.withInputStream { input ->
                byte[] buffer = new byte[8192]
                for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
                    if (read > 0) digest.update(buffer, 0, read)
                }
            }
            String actualHash = digest.digest().encodeHex().toString().toUpperCase()
            if (actualHash != expectedHash) {
                throw new GradleException("Legacy fixture hash mismatch for ${relativePath}: "
                        + "expected ${expectedHash}, found ${actualHash}")
            }
        }
    }
}

