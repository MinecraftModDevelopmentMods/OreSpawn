def configureForge25Run = { JavaExec runTask, String launchTarget ->
    runTask.dependsOn prepareForgeRunModClasses
    runTask.mainClass.set('net.minecraftforge.userdev.LaunchTesting')
    runTask.environment 'target', launchTarget
    runTask.environment 'MCP_MAPPINGS', "${mapping_channel}_${mapping_version}"
    runTask.environment 'MCP_VERSION', mcp_version
    runTask.environment 'FORGE_VERSION', forge_version
    runTask.environment 'FORGE_GROUP', 'net.minecraftforge'
    runTask.environment 'MC_VERSION', minecraft_version
    // Forge 25's exploded-directory locator resolves one physical output per
    // mod entry.  Give it a merged, build-owned classes/resources directory,
    // repeated for the target's legacy duplicate-entry discovery contract.
    runTask.environment 'MOD_CLASSES', "${mod_id}%%${forgeRunModClassesDirectory}${File.pathSeparator}" +
            "${mod_id}%%${forgeRunModClassesDirectory}"
}
