plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "OreSpawn-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    withJavadocJar()
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

def applyBenchmarkProperties = { run, String defaultRadius, String defaultRepetitions,
        String defaultCenter ->
    if (!providers.gradleProperty('orespawnBenchmarkMode').isPresent()) {
        return
    }

    run.systemProperty 'orespawn.worldgenBenchmarkMode',
            providers.gradleProperty('orespawnBenchmarkMode').get()
    run.systemProperty 'orespawn.worldgenBenchmarkRadius',
            providers.gradleProperty('orespawnBenchmarkRadius').getOrElse(defaultRadius)
    run.systemProperty 'orespawn.worldgenBenchmarkRepetitions',
            providers.gradleProperty('orespawnBenchmarkRepetitions').getOrElse(defaultRepetitions)
    run.systemProperty 'orespawn.worldgenBenchmarkVanillaOres',
            providers.gradleProperty('orespawnBenchmarkVanillaOres').getOrElse('false')
    run.systemProperty 'orespawn.worldgenBenchmarkOreAudit',
            providers.gradleProperty('orespawnBenchmarkOreAudit').getOrElse('false')
    run.systemProperty 'orespawn.worldgenBenchmarkFluidAudit',
            providers.gradleProperty('orespawnBenchmarkFluidAudit').getOrElse('false')
    if (providers.gradleProperty('orespawnBenchmarkBiomeAudit').isPresent()) {
        run.systemProperty 'orespawn.worldgenBenchmarkBiomeAudit',
                providers.gradleProperty('orespawnBenchmarkBiomeAudit').get()
    }
    if (providers.gradleProperty('orespawnBenchmarkBlockAudit').isPresent()) {
        run.systemProperty 'orespawn.worldgenBenchmarkBlockAudit',
                providers.gradleProperty('orespawnBenchmarkBlockAudit').get()
    }
    run.systemProperty 'orespawn.worldgenBenchmarkCenterX',
            providers.gradleProperty('orespawnBenchmarkCenterX').getOrElse(defaultCenter)
    run.systemProperty 'orespawn.worldgenBenchmarkCenterZ',
            providers.gradleProperty('orespawnBenchmarkCenterZ').getOrElse(defaultCenter)
    run.systemProperty 'orespawn.worldgenBenchmarkCenterStep',
            providers.gradleProperty('orespawnBenchmarkCenterStep').getOrElse('64')
    run.systemProperty 'orespawn.worldgenBenchmarkDimension',
            providers.gradleProperty('orespawnBenchmarkDimension').getOrElse('overworld')
    if (providers.gradleProperty('orespawnBenchmarkBiomeType').isPresent()) {
        run.systemProperty 'orespawn.worldgenBenchmarkBiomeType',
                providers.gradleProperty('orespawnBenchmarkBiomeType').get()
    }
    run.systemProperty 'orespawn.worldgenBenchmarkStopServer', 'true'
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // ForgeGradle 7 discovers the standard META-INF access transformer when enabled.
    accessTransformer = true

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        register('client')

        register('server') {
            args '--nogui'
            applyBenchmarkProperties(delegate, '8', '5', '1024')
        }

        register('gameTestServer') {
            applyBenchmarkProperties(delegate, '4', '3', '256')
        }

        ['Fresh', 'Reload'].each { String phase ->
            register("surfaceIntegration${phase}") {
                mainClass = 'net.minecraftforge.bootstrap.ForgeBootstrap'
                args '--launchTarget', 'forge_userdev_server_gametest', '--gameDir', '.'
                environment 'MCP_MAPPINGS', "official_${minecraft_version}"
                workingDir = layout.buildDirectory.dir('surface-integration-run')
                systemProperty 'forge.enableGameTest', 'true'
                systemProperty 'forge.enabledGameTestNamespaces', 'surfaceprobe'
                systemProperty 'forge.logging.console.level', 'info'
                systemProperty 'surfaceprobe.integrationPhase', phase.toLowerCase(Locale.ROOT)
                mods {
                    create(mod_id) {
                        source sourceSets.main
                    }
                }
            }
        }

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')
            args '--mod', mod_id, '--all',
                    '--output', layout.projectDirectory.dir('src/generated/resources'),
                    '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

// ForgeGradle's merged Eclipse output and Gradle 9.3 cannot safely share the
// JavaCompile and ProcessResources output directory. Compile into staging,
// then copy classes into the merged mod root after resources are ready.
def compiledMainClasses = layout.buildDirectory.dir('compiled-classes/main')
tasks.named('compileJava', JavaCompile).configure {
    destinationDirectory.set(compiledMainClasses)
}
def mergeMainClasses = tasks.register('mergeMainClasses') {
    dependsOn tasks.named('compileJava'), tasks.named('processResources')
    doLast {
        project.copy {
            from compiledMainClasses
            into sourceSets.main.output.resourcesDir
        }
    }
}
tasks.named('classes').configure {
    dependsOn mergeMainClasses
}

def compiledTestClasses = layout.buildDirectory.dir('compiled-classes/test')
tasks.named('compileTestJava', JavaCompile).configure {
    destinationDirectory.set(compiledTestClasses)
}
def mergeTestClasses = tasks.register('mergeTestClasses') {
    dependsOn tasks.named('compileTestJava'), tasks.named('processTestResources')
    doLast {
        project.copy {
            from compiledTestClasses
            into sourceSets.test.output.resourcesDir
        }
    }
}
tasks.named('testClasses').configure {
    dependsOn mergeTestClasses
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.1'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'       : 'OreSpawn',
                'Specification-Vendor'      : 'SkyBlade1978',
                'Specification-Version'     : '1',
                'Implementation-Title'      : project.name,
                'Implementation-Version'    : project.jar.archiveVersion,
                'Implementation-Vendor'     : 'SkyBlade1978',
                'Implementation-Timestamp'  : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'OreSpawn-API-Version'      : '1'
        ])
    }
}

tasks.named('processResources', ProcessResources).configure {
    from('docs/AGENTS.md') {
        into ''
        rename { 'AGENTS.md' }
    }
    from('docs') {
        into 'META-INF/orespawn/docs'
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
            artifact sourcesJar
            artifact javadocJar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('javadoc', Javadoc).configure {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

def surfaceIntegrationClasses = layout.buildDirectory.dir('surface-integration-fixture/classes')
def compileSurfaceIntegrationTestMod = tasks.register('compileSurfaceIntegrationTestMod', JavaCompile) {
    dependsOn tasks.named('classes')
    source fileTree('src/biomeIntegrationTest/java')
    classpath = files(sourceSets.main.output, sourceSets.main.compileClasspath)
    destinationDirectory.set(surfaceIntegrationClasses)
    javaCompiler.set(javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
    })
    options.release = 21
    options.encoding = 'UTF-8'
}

def surfaceIntegrationTestModJar = tasks.register('surfaceIntegrationTestModJar', Jar) {
    dependsOn compileSurfaceIntegrationTestMod
    archiveFileName = 'surfaceprobe.jar'
    destinationDirectory = layout.buildDirectory.dir('surface-integration-fixture')
    manifest {
        attributes 'MixinConfigs': 'surfaceprobe.mixins.json'
    }
    from surfaceIntegrationClasses
    from 'src/biomeIntegrationTest/resources'
}

def surfaceIntegrationRunDirectory = layout.buildDirectory.dir('surface-integration-run')
def prepareSurfaceIntegrationTest = tasks.register('prepareSurfaceIntegrationTest') {
    dependsOn surfaceIntegrationTestModJar
    doLast {
        delete surfaceIntegrationRunDirectory
        copy {
            from surfaceIntegrationTestModJar.flatMap { it.archiveFile }
            into surfaceIntegrationRunDirectory.map { it.dir('mods') }
        }
    }
}

tasks.configureEach {
    if (name == 'runSurfaceIntegrationFresh') {
        dependsOn prepareSurfaceIntegrationTest
    } else if (name == 'runSurfaceIntegrationReload') {
        dependsOn 'runSurfaceIntegrationFresh'
    }
}

def surfaceIntegrationTest = tasks.register('surfaceIntegrationTest') {
    group = 'verification'
    description = 'Verifies provider surfaces and dynamic-biome geology across fresh and reloaded normal terrain.'
    dependsOn 'runSurfaceIntegrationReload'
    doLast {
        File marker = surfaceIntegrationRunDirectory.get().file(
                'gametestserver/gametestworld/surfaceprobe-integration.properties').asFile
        if (!marker.isFile()) {
            throw new GradleException("Surface integration completion marker is missing: ${marker}")
        }
        Properties result = new Properties()
        marker.withInputStream { result.load(it) }
        if (result.getProperty('reload_verified') != 'true') {
            throw new GradleException("Surface integration reload was not verified: ${marker}")
        }
        logger.lifecycle('Provider surfaces and dynamic-biome geology verified: {} dimensions, {} columns each, fresh + reload',
                result.getProperty('dimensions'), result.getProperty('columns_per_dimension'))
    }
}

tasks.named('check') {
    dependsOn surfaceIntegrationTest
}

// ForgeGradle 7 generates a launch for every source set, but its ordinary
// Eclipse launches currently omit JDT's test-code exclusion. Without this,
// Eclipse adds build/sourceSets/test to the Java module path and Java rejects
// the split OreSpawn packages before Minecraft starts.
tasks.named('genEclipseRuns').configure {
    doLast {
        String exclusionKey = 'org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE'
        String exclusion =
                "<booleanAttribute key=\"${exclusionKey}\" value=\"true\"/>"

        ['runClient.launch', 'runServer.launch', 'runGameTestServer.launch',
                'runData.launch'].each { String launchName ->
            File launchFile = file(launchName)
            if (!launchFile.isFile()) {
                throw new GradleException(
                        "ForgeGradle did not generate expected Eclipse launch: ${launchFile}")
            }

            String launch = launchFile.getText('UTF-8')
            if (launch.contains("key=\"${exclusionKey}\"")) {
                launch = launch.replaceFirst(
                        /<booleanAttribute key="org\.eclipse\.jdt\.launching\.ATTR_EXCLUDE_TEST_CODE" value="[^"]*"\/>/,
                        exclusion)
            } else {
                int headerEnd = launch.indexOf('\n', launch.indexOf('<launchConfiguration'))
                if (headerEnd < 0) {
                    throw new GradleException(
                            "Malformed Eclipse Java launch configuration: ${launchFile}")
                }
                String lineSeparator = launch.contains('\r\n') ? '\r\n' : '\n'
                launch = "${launch.substring(0, headerEnd + 1)}" +
                        "  ${exclusion}${lineSeparator}" +
                        launch.substring(headerEnd + 1)
            }
            launchFile.setText(launch, 'UTF-8')
        }
    }
}
