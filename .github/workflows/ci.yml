name: OreSpawn 26.1.2 NeoForge CI

on:
  push:
    branches:
      - master-26.1.2-neo
      - 'feature/**'
  pull_request:
    branches:
      - master-26.1.2-neo

permissions:
  contents: read

concurrency:
  group: orespawn-26.1.2-neo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cold-bootstrap:
    name: Cold NeoForge bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install exact Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'
      - name: Bootstrap an isolated empty NeoGradle cache
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          test ! -d .gradle
          export GRADLE_USER_HOME="$RUNNER_TEMP/orespawn-neoforge-cold-cache"
          rm -rf "$GRADLE_USER_HOME"
          ./gradlew help verifyLegacyFixtures --no-daemon --no-build-cache --stacktrace --max-workers=2
          ./gradlew help verifyLegacyFixtures --offline --no-daemon --no-build-cache --stacktrace --max-workers=2

  build:
    name: Build, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install exact Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Build, test, and audit release artifacts
        run: |
          chmod +x ./gradlew
          ./gradlew clean check build javadoc verifyReleaseArtifacts writeReleaseChecksums eclipse verifyEclipseProductionClasspath --no-daemon --stacktrace --max-workers=2
      - name: Upload audited release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: OreSpawn-26.1.2-neoforge-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/libs/OreSpawn-4.0.9.2601022.jar
            build/libs/OreSpawn-4.0.9.2601022-sources.jar
            build/libs/OreSpawn-4.0.9.2601022-javadoc.jar
            build/release/SHA256SUMS
            CHANGELOG.txt
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: OreSpawn-26.1.2-neoforge-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/test-results/**
            build/reports/**
            build/*-run/logs/**
            build/surface-integration-run/**/*.properties
            build/problems/**
