name: OreSpawn 1.21.1 CI

on:
  push:
    branches:
      - master-1.21.1
      - 'feature/**'
  pull_request:
    branches:
      - master-1.21.1

permissions:
  contents: read

concurrency:
  group: orespawn-1.21.1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Java 21 runtime and toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.7+6.0.LTS'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Build, test, and audit release artifacts
        run: >-
          ./gradlew clean check build javadoc verifyReleaseArtifacts writeReleaseChecksums
          verifyEclipseProductionClasspath --no-daemon --stacktrace

      - name: Upload audited release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: OreSpawn-1.21.1-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/libs/OreSpawn-4.0.10.121011.jar
            build/libs/OreSpawn-4.0.10.121011-sources.jar
            build/libs/OreSpawn-4.0.10.121011-javadoc.jar
            build/release/SHA256SUMS
            CHANGELOG.txt

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: OreSpawn-1.21.1-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/test-results/**
            build/reports/**
            build/*-run/logs/**
            build/surface-integration-run/**/*.properties
            build/problems/**
