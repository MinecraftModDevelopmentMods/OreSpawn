name: CodeQL

on:
  push:
    branches:
      - master-26.1.2-neo
      - 'feature/**'
  pull_request:
    branches:
      - master-26.1.2-neo
  schedule:
    - cron: '43 7 * * 4'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install exact Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: java-kotlin
      - name: Compile production code
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          gradle_args=(
            clean classes --no-daemon --stacktrace --max-workers=2
            "-Dorg.gradle.java.installations.paths=$JAVA_HOME"
            -Dorg.gradle.java.installations.auto-detect=false
            -Dorg.gradle.java.installations.auto-download=false
          )
          for attempt in 1 2 3; do
            if ./gradlew "${gradle_args[@]}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "CodeQL compilation failed after $attempt attempts." >&2
              exit 1
            fi
            echo "::warning::CodeQL compilation attempt $attempt failed; retrying with the preserved NeoGradle cache."
          done
      - name: Analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
